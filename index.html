<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Learning Shelf</title>
    <meta
      name="description"
      content="An 18-week roadmap from beginner to advanced, plus a curated shelf of free courses, talks, tutorials and articles on agents, MCP, skills, RAG, evals and more."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316181d'/%3E%3Crect x='6' y='7' width='5' height='18' fill='%23c9b8ff'/%3E%3Crect x='13' y='10' width='5' height='15' fill='%23d4f25c'/%3E%3Crect x='20' y='5' width='6' height='20' fill='%238fd3ff' transform='rotate(8 23 15)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Layout: a library shelf. Sticky search bar on top, a category rail
         on the left (chip scroller on phones), and a main pane where each
         category is a shelf of tactile, hard-edged resource slips. */
      :root {
        --bg: #eef1ec;
        --surface: #ffffff;
        --sunk: #e2e7df;
        --ink: #16181d;
        --ink-soft: #4a4f57;
        --dim: #6f746c;
        --line: #16181d;
        --hair: #c7cdc3;
        --accent: #3b2bd9;
        --on-accent: #ffffff;
        --chip-ink: #16181d;
        --shadow: #16181d;

        /* category swatches: pastel fills that always carry dark text */
        --c-skills: #c9b8ff;
        --c-agents: #8fd3ff;
        --c-harness: #ffd166;
        --c-context: #8ef0c4;
        --c-mcp: #d4f25c;
        --c-evals: #ffb3d9;
        --c-graphrag: #ffab91;
        --c-docs: #b5e3e0;
        --c-claude-code: #e9b8a6;
        --c-foundations: #aab4ff;

        --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
        --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        --rail: 248px;
        --bar: 64px;
        color-scheme: light;
      }
      /* dark theme (chosen with the toggle): Catppuccin Frappé, hex values from the official palette */
      :root[data-theme="dark"] {
        --bg: #303446;          /* base */
        --surface: #414559;     /* surface0 */
        --sunk: #292c3c;        /* mantle */
        --ink: #c6d0f5;         /* text */
        --ink-soft: #a5adce;    /* subtext0 */
        --dim: #838ba7;         /* overlay1 */
        --line: #949cbb;        /* overlay2 */
        --hair: #51576d;        /* surface1 */
        --accent: #ca9ee6;      /* mauve */
        --on-accent: #232634;   /* crust */
        --shadow: #232634;      /* crust */
        --chip-ink: #232634;    /* crust */
        --c-skills: #ca9ee6;    /* mauve */
        --c-agents: #99d1db;    /* sky */
        --c-harness: #e5c890;   /* yellow */
        --c-context: #81c8be;   /* teal */
        --c-mcp: #a6d189;       /* green */
        --c-evals: #f4b8e4;     /* pink */
        --c-graphrag: #ef9f76;  /* peach */
        --c-docs: #85c1dc;      /* sapphire */
        --c-claude-code: #f2d5cf; /* rosewater */
        --c-foundations: #babbf1; /* lavender */
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.55 var(--body);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      a {
        color: inherit;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--on-accent);
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- top bar ---------- */
      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) auto;
        align-items: center;
        min-height: var(--bar);
        background: var(--bg);
        border-bottom: 1px solid var(--hair);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-inline: 20px;
        height: 100%;
        border-right: 1px solid var(--hair);
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .brand-mark {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 22px;
      }
      .brand-mark i {
        display: block;
        width: 6px;
        border: 1.5px solid var(--line);
      }
      .brand-mark i:nth-child(1) { height: 20px; background: var(--c-skills); }
      .brand-mark i:nth-child(2) { height: 15px; background: var(--c-mcp); }
      .brand-mark i:nth-child(3) { height: 22px; background: var(--c-agents); transform: rotate(9deg); transform-origin: bottom left; }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-inline: 20px;
        padding: 0 12px;
        height: 42px;
        border: 2px solid var(--line);
        background: var(--surface);
        box-shadow: 3px 3px 0 var(--shadow);
        min-width: 0;
      }
      .search:focus-within {
        box-shadow: 5px 5px 0 var(--hair);
      }
      .search svg {
        flex: none;
        color: var(--dim);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        height: 100%;
      }
      .search input::placeholder {
        color: var(--dim);
      }
      kbd {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 1px 6px;
        border: 1.5px solid var(--hair);
        background: var(--sunk);
        color: var(--ink-soft);
      }
      /* hide the browser's own × so only our clear button shows */
      .search input::-webkit-search-cancel-button,
      .search input::-webkit-search-decoration {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
      .search-clear {
        flex: none;
        border: 1.5px solid var(--hair);
        background: var(--sunk);
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
        padding: 2px 8px;
        box-shadow: 0 0 0 var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease,
          background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .search-clear:hover,
      .search-clear:focus-visible {
        background: var(--c-evals);
        border-color: var(--line);
        color: var(--chip-ink);
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .search-clear:active {
        transform: translate(0, 0);
        box-shadow: 0 0 0 var(--shadow);
      }
      .bar-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-inline: 0 20px;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .bar-meta b {
        color: var(--ink);
      }
      .theme-btn {
        border: 2px solid var(--line);
        background: var(--surface);
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .theme-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      /* the way in for newcomers: links to start.html */
      .start-btn {
        border: 2px solid var(--accent);
        background: var(--accent);
        color: var(--on-accent);
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .start-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .start-short {
        display: none;
      }
      @media (max-width: 1100px) {
        .start-long {
          display: none;
        }
        .start-short {
          display: inline;
        }
      }

      /* ---------- shell ---------- */
      .shell {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        align-items: start;
      }

      /* ---------- category rail ---------- */
      .rail {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + var(--bar));
        max-height: calc(100vh - var(--bar));
        overflow-y: auto;
        border-right: 1px solid var(--hair);
        min-height: calc(100vh - var(--bar));
        padding-block: 20px;
      }
      .rail-label {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 0 20px 10px;
      }
      .rail-nav {
        display: flex;
        flex-direction: column;
      }
      .rail-item {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 9px 20px;
        border: 0;
        background: none;
        text-align: left;
        font-size: 0.95rem;
        /* progress through the topic, drawn as a bar along the bottom edge */
        background-image: linear-gradient(var(--pc), var(--pc));
        background-repeat: no-repeat;
        background-position: left bottom;
        background-size: var(--p, 0%) 3px;
      }
      .rail-item:hover {
        background-color: var(--sunk);
      }
      .rail-item .sw {
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--line);
        background: var(--sw, var(--surface));
      }
      .rail-item .n {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rail-item[aria-pressed="true"] {
        background-color: var(--ink);
        color: var(--bg);
      }
      .rail-item[aria-pressed="true"] .n {
        color: var(--bg);
      }
      .rail-item[aria-pressed="true"] .sw {
        border-color: var(--bg);
      }
      .rail-foot {
        margin: 24px 20px 0;
        padding-top: 16px;
        border-top: 1.5px dashed var(--hair);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .fmt-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .fmt-btn {
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 3px 8px;
        font-family: var(--mono);
        font-size: 0.72rem;
      }
      .rail-progress {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .rail-progress .meter {
        width: 80px;
      }
      .fmt-btn[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      /* ---------- main ---------- */
      main {
        min-width: 0;
        padding: 36px 40px 24px;
      }
      .view-toggle {
        display: flex;
        border: 2px solid var(--line);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .view-toggle button {
        border: 0;
        background: var(--surface);
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
      }
      .view-toggle button + button {
        border-left: 2px solid var(--line);
      }
      .view-toggle button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }

      /* ---------- shelves ---------- */
      .shelves {
        display: flex;
        flex-direction: column;
        gap: 44px;
      }
      .shelf-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-bottom: 16px;
      }
      .shelf-head h2 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .shelf-head h2 .tab {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid var(--line);
        background: var(--sw);
        transform: rotate(-6deg);
      }

      /* list view: slips stacked like index cards in a drawer */
      .slips {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .slip {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        gap: 18px;
        padding: 14px 18px 14px 60px;
        background: var(--surface);
        border: 2px solid var(--line);
        box-shadow: 4px 4px 0 var(--shadow);
        text-decoration: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .slip:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--sw);
      }
      .slip:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--shadow);
      }
      .fmt {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1.5px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .fmt svg {
        width: 11px;
        height: 11px;
      }
      .slip-body {
        min-width: 0;
      }
      .slip-title {
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.12rem;
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }
      .slip-meta {
        margin: 4px 0 0;
        font-size: 0.85rem;
        color: var(--ink-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
      }
      .slip-meta .host {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--dim);
        overflow-wrap: anywhere;
      }

      /* cards view */
      .grid-view .slips {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
      }
      .grid-view .slip {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        align-items: start;
        min-height: 170px;
        padding: 0;
        gap: 0;
      }
      .grid-view .fmt {
        grid-column: 1;
        margin: 16px 0 0 58px;
      }
      .grid-view .slip-body {
        align-self: end;
        padding: 18px 16px 16px;
        border-top: 2px dashed var(--hair);
        margin-top: 16px;
      }

      /* progress: a tick on every slip, sharing its record with the roadmap */
      .slips > li {
        position: relative;
      }
      .slips .mark {
        position: absolute;
        top: 50%;
        left: 14px;
        transform: translateY(-50%);
      }
      .grid-view .slips .mark {
        top: 12px;
        left: 12px;
        transform: none;
      }
      .slips .is-done .slip {
        background: var(--sunk);
        box-shadow: 4px 4px 0 var(--hair);
      }
      .slips .is-done .slip-title {
        color: var(--ink-soft);
      }
      .shelf-done {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-top: 18px;
        padding: 14px 18px;
        border: 2px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        box-shadow: 4px 4px 0 var(--shadow);
      }
      .shelf-done > span {
        font-size: 1.6rem;
        line-height: 1;
      }
      .shelf-done p {
        flex: 1 1 280px;
        margin: 0;
        font-weight: 700;
        line-height: 1.4;
      }
      .shelf-done button {
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        padding: 6px 12px;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 700;
      }
      .done-badge,
      .next-badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--ink);
      }
      .shelf-progress {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--ink-soft);
      }
      .meter {
        display: block;
        flex: none;
        width: 120px;
        height: 10px;
        border: 1.5px solid var(--line);
        background: var(--surface);
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--sw);
      }

      .empty {
        padding: 48px 24px;
        border: 2px dashed var(--hair);
        text-align: center;
        color: var(--ink-soft);
      }
      .empty strong {
        display: block;
        font-family: var(--display);
        font-size: 1.4rem;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .empty button {
        margin-top: 14px;
        border: 2px solid var(--line);
        background: var(--surface);
        padding: 6px 14px;
        box-shadow: 3px 3px 0 var(--shadow);
      }

      footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid var(--hair);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        font-size: 0.85rem;
        color: var(--dim);
      }
      footer .keys {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      /* ---------- roadmap ----------
         Overview first, details on demand: a winding path of week stops
         (done / current / upcoming) on the left, and the selected week's
         checklist in a sticky panel on the right (a bottom sheet on phones). */
      .shell.solo {
        grid-template-columns: minmax(0, 1fr);
      }

      /* ---------- intro: where first-time visitors land ---------- */
      .intro {
        max-width: 720px;
        margin: 0 auto;
        padding: 56px 20px 40px;
      }
      .intro h1 {
        margin: 0 0 18px;
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .intro p {
        margin: 0 0 14px;
        font-size: 1.08rem;
        color: var(--ink-soft);
      }
      .intro-ways {
        display: grid;
        gap: 14px;
        margin: 26px 0 22px;
      }
      .way {
        display: block;
        width: 100%;
        text-align: left;
        text-decoration: none;
        padding: 16px 20px;
        border: 2px solid var(--line);
        background: var(--surface);
        box-shadow: 3px 3px 0 var(--shadow);
        transition: transform 0.12s, box-shadow 0.12s;
      }
      .way:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0 var(--shadow);
      }
      .way:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }
      .way-k {
        display: block;
        font-family: var(--mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
      }
      .way b {
        display: block;
        margin: 4px 0 4px;
        font-family: var(--display);
        font-size: 1.3rem;
        font-weight: 750;
        letter-spacing: -0.01em;
      }
      .way-d {
        display: block;
        color: var(--ink-soft);
        font-size: 0.95rem;
      }
      .intro .intro-note {
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--dim);
      }
      .shell.solo .rail {
        display: none;
      }
      .rm {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }
      .rm-main {
        position: relative;
        min-width: 0;
      }
      /* on wide screens the stats float in the corner so the path can start at the top */
      @media (min-width: 1101px) {
        .rm-hero {
          position: absolute;
          top: 0;
          right: 0;
          z-index: 2;
        }
        .rm-main .path {
          margin-top: 0;
        }
        .rm-main .path > .checkpoint:first-of-type {
          margin-top: 0;
        }
      }
      /* intro on the left, progress stats pinned to the top-right corner */
      .rm-hero {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px 32px;
      }
      /* progress as a compact list: label on the left, value on the right */
      .stats {
        display: grid;
        width: 230px;
        margin-left: auto;
        border: 1.5px solid var(--line);
        background: var(--surface);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .stat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 12px;
        border-bottom: 1px solid var(--hair);
      }
      .stat b {
        font-family: var(--display);
        font-size: 0.95rem;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .csv-btn,
      .reset-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 7px 12px;
        border: 0;
        background: var(--surface);
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink);
        white-space: nowrap;
      }
      .csv-btn {
        border-bottom: 1px solid var(--hair);
      }
      .csv-btn svg,
      .reset-btn svg {
        width: 13px;
        height: 13px;
      }
      .csv-btn:hover,
      .reset-btn:hover:not(:disabled) {
        background: var(--sunk);
      }
      .reset-btn[data-armed],
      .reset-btn[data-armed]:hover {
        background: var(--c-evals);
        color: var(--chip-ink);
      }
      .reset-btn:disabled {
        color: var(--dim);
        cursor: default;
      }
      .link-btn {
        padding: 0;
        border: 0;
        background: none;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* the path */
      .path {
        --amp: 120px;
        position: relative;
        max-width: 880px;
        margin-top: 36px;
        padding-bottom: 24px;
      }
      .path-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .path-svg .base {
        fill: none;
        stroke: var(--hair);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 1 13;
      }
      .path-svg .fill {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
        stroke-linecap: round;
      }
      .search-note {
        margin: 24px 0 0;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
      }
      .checkpoint {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 2px;
        width: fit-content;
        max-width: 100%;
        margin: 26px auto 34px;
        padding: 10px 20px 12px;
        text-align: center;
        border: 2px solid var(--line);
        background: var(--bg);
        box-shadow: 3px 3px 0 var(--shadow);
      }
      .checkpoint .k {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .checkpoint b {
        font-family: var(--display);
        font-size: 1.15rem;
        line-height: 1.2;
      }
      .checkpoint.done {
        background: var(--ink);
        color: var(--bg);
      }
      .checkpoint.done .k {
        color: var(--bg);
      }
      .stop-row {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        height: 134px;
        align-items: center;
      }
      .stop {
        position: relative;
        display: block;
        width: 78px;
        height: 78px;
        padding: 0;
        border: 0;
        background: none;
        transform: translateX(calc(var(--amp) * var(--k)));
        transition: opacity 0.2s ease;
      }
      .stop.dim {
        opacity: 0.28;
      }
      .node {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: conic-gradient(var(--sw) calc(var(--p) * 1%), var(--hair) 0);
        box-shadow: 0 5px 0 var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .stop:hover .node {
        transform: translateY(-3px);
        box-shadow: 0 8px 0 var(--shadow);
      }
      .stop:active .node {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--shadow);
      }
      .face {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border: 2.5px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.5rem;
        color: var(--ink);
      }
      .face svg {
        width: 28px;
        height: 28px;
      }
      .stop.is-todo .face {
        border-style: dashed;
        color: var(--dim);
      }
      .stop.is-done .node {
        background: var(--line);
      }
      .stop.is-done .face,
      .stop.is-current .face {
        background: var(--sw);
        color: var(--chip-ink);
      }
      .stop.is-current .node::after {
        content: "";
        position: absolute;
        inset: -9px;
        border: 3px solid var(--sw);
        border-radius: 50%;
        animation: pulse 1.8s ease-out infinite;
        pointer-events: none;
      }
      @keyframes pulse {
        from { transform: scale(0.9); opacity: 1; }
        to { transform: scale(1.3); opacity: 0; }
      }
      .stop:focus-visible {
        outline: none;
      }
      .stop:focus-visible .node,
      .stop[aria-pressed="true"] .node {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }
      .here {
        position: absolute;
        bottom: calc(100% + 14px);
        left: 50%;
        padding: 3px 9px;
        background: var(--ink);
        color: var(--bg);
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        transform: translateX(-50%);
        animation: bob 1.8s ease-in-out infinite;
      }
      .here::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--ink);
      }
      @keyframes bob {
        50% { transform: translate(-50%, -4px); }
      }
      .stop-label {
        position: absolute;
        top: 50%;
        left: calc(100% + 18px);
        display: grid;
        gap: 1px;
        width: 200px;
        text-align: left;
        transform: translateY(-50%);
      }
      .stop-label.left {
        left: auto;
        right: calc(100% + 18px);
        text-align: right;
      }
      .stop-label .wk {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .stop-label .t {
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.05rem;
        line-height: 1.2;
        color: var(--ink);
      }
      .stop:hover .stop-label .t {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .stop-label .m {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
      }

      /* the week panel: a drawer that reads like one page of a syllabus.
         The week number in its colour block is the one loud element; the
         reading list underneath stays plain, numbered in suggested order,
         and each number doubles as that item's checkbox. */
      .panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: min(720px, 100vw);
        overflow: auto;
        overscroll-behavior: contain;
        background: var(--surface);
        border-left: 2px solid var(--line);
        box-shadow: -24px 0 48px rgba(22, 24, 29, 0.14);
        transform: translateX(104%);
        visibility: hidden;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.34s;
      }
      .panel.open {
        transform: none;
        visibility: visible;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 25;
        background: rgba(22, 24, 29, 0.38);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .sheet-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      html.drawer-open {
        overflow: hidden;
      }
      .panel :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .panel-head {
        padding: 18px 40px 32px;
      }
      .panel-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.9rem;
        color: var(--dim);
      }
      .arrows {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ink-soft);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--sunk);
        color: var(--ink);
      }
      .icon-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .wk-head {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: start;
        gap: 28px;
        margin-top: 18px;
      }
      .wk-num {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border: 2px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        font-family: var(--display);
        font-size: 5rem;
        font-weight: 800;
        font-variation-settings: "wdth" 75;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .panel-head h2 {
        margin: 2px 0 0;
        font-family: var(--display);
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
        color: var(--ink);
        text-wrap: balance;
      }
      .panel-head .goal {
        margin: 12px 0 0;
        max-width: 58ch;
        font-size: 1.02rem;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .panel-body {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 36px;
        padding: 0 40px 40px;
      }
      .list-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--line);
      }
      .list-head h3 {
        margin: 0;
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .list-head span {
        font-size: 0.9rem;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .extras .list-head {
        border-bottom-width: 1px;
        border-bottom-color: var(--hair);
      }
      .extras .list-head h3 {
        font-size: 1rem;
        color: var(--ink-soft);
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .step {
        position: relative;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        padding: 20px 0;
        border-bottom: 1px solid var(--hair);
      }
      /* the item to do next is flagged in the margin with the week's colour */
      .step.is-next::before {
        content: "";
        position: absolute;
        top: -1px;
        bottom: -1px;
        left: -40px;
        width: 5px;
        background: var(--sw);
      }
      .mark {
        position: relative;
        display: block;
        width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .mark input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .mark span {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--ink);
        font-family: var(--display);
        font-size: 1rem;
        font-weight: 700;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .mark span svg {
        display: none;
        width: 18px;
        height: 18px;
      }
      .mark:hover span {
        background: var(--sunk);
      }
      .mark input:checked + span {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }
      .mark input:checked + span b {
        display: none;
      }
      .mark input:checked + span svg {
        display: block;
      }
      .mark input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .step-body {
        min-width: 0;
        padding-top: 4px;
      }
      .step-link {
        color: var(--ink);
        text-decoration: none;
      }
      .step-link:hover .step-title {
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
      }
      .step-title {
        font-size: 1.06rem;
        font-weight: 700;
        line-height: 1.35;
      }
      .step.is-done .step-title {
        color: var(--dim);
      }
      .step-meta {
        margin: 3px 0 0;
        font-size: 0.9rem;
        color: var(--ink-soft);
      }
      /* must-read items: a star before the title and a heavier number box */
      .step.is-key .mark span {
        border-width: 3px;
      }
      .star {
        margin-right: 6px;
        color: var(--ink);
      }
      .step-meta b {
        color: var(--ink);
      }
      .step-note {
        margin: 8px 0 0;
        max-width: 56ch;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--dim);
      }

      .wk-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 22px;
      }
      .wk-actions .hint {
        font-size: 0.92rem;
        color: var(--dim);
      }
      .complete-btn,
      .next-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 13px 22px;
        border-radius: 6px;
        font-family: var(--body);
        font-size: 1rem;
        font-weight: 700;
        text-align: left;
      }
      .complete-btn svg {
        width: 18px;
        height: 18px;
      }
      .complete-btn {
        border: 2px solid var(--ink);
        background: var(--ink);
        color: var(--surface);
      }
      .complete-btn:hover {
        background: var(--ink-soft);
        border-color: var(--ink-soft);
      }
      .next-btn {
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .next-btn:hover {
        background: var(--sunk);
      }
      .complete-btn:active,
      .next-btn:active {
        transform: translateY(1px);
      }
      .done-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 14px;
        width: 100%;
        font-weight: 700;
        color: var(--ink);
      }
      .done-line .swatch {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--sw);
        color: var(--chip-ink);
      }
      .done-line .swatch svg {
        width: 18px;
        height: 18px;
      }
      .panel .link-btn {
        padding: 0;
        font-family: var(--body);
        font-size: 0.92rem;
        font-weight: 400;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .panel .link-btn:hover {
        color: var(--ink);
      }
      .panel-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 16px 40px;
        border-top: 1px solid var(--hair);
        font-size: 0.88rem;
        color: var(--dim);
      }
      @media (max-width: 860px) {
        .panel-head {
          padding: 12px 20px 26px;
        }
        .wk-head {
          grid-template-columns: 76px minmax(0, 1fr);
          gap: 18px;
        }
        .wk-num {
          width: 76px;
          height: 76px;
          font-size: 3.4rem;
        }
        .panel-head h2 {
          font-size: 1.5rem;
        }
        .panel-body {
          padding: 0 20px 32px;
        }
        .step.is-next::before {
          left: -20px;
          width: 4px;
        }
        .panel-foot {
          padding: 14px 20px;
        }
      }
      /* hover preview of a week on the path */
      .peek {
        position: fixed;
        z-index: 20;
        width: 330px;
        max-width: calc(100vw - 32px);
        border: 1.5px solid var(--line);
        border-top: 5px solid var(--sw);
        background: var(--surface);
        box-shadow: 4px 4px 0 var(--shadow);
        padding: 14px 16px 12px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      .peek.show {
        opacity: 1;
        transform: none;
      }
      .peek-kicker {
        margin: 0;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .peek h4 {
        margin: 2px 0 6px;
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .peek-goal {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      .peek-sub {
        margin: 12px 0 6px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--ink);
      }
      .peek ol {
        margin: 0;
        padding: 0 0 0 1.2em;
        font-size: 0.86rem;
        line-height: 1.45;
        color: var(--ink);
      }
      .peek ol li + li {
        margin-top: 3px;
      }
      .peek ol small {
        color: var(--dim);
        font-size: 0.78rem;
      }
      .peek-extra {
        margin: 6px 0 0;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .peek-foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 9px;
        border-top: 1px solid var(--hair);
        font-size: 0.78rem;
        color: var(--dim);
      }
      .peek-foot b {
        color: var(--ink);
        font-weight: 700;
        white-space: nowrap;
      }
      /* library peek: a compact card docked under the layout and theme buttons */
      .peek.docked {
        padding: 11px 13px 10px;
        max-height: calc(100vh - var(--bar) - 26px);
        overflow: hidden;
      }
      .peek.docked h4 {
        font-size: 1rem;
      }
      .peek.docked .peek-goal {
        font-size: 0.8rem;
        line-height: 1.45;
      }
      .peek.docked .peek-tags {
        margin-top: 8px;
        gap: 4px;
      }
      .peek.docked .peek-tags span {
        font-size: 0.66rem;
      }
      .peek.docked .peek-road {
        margin-top: 8px;
        font-size: 0.75rem;
      }
      .peek.docked .peek-foot {
        flex-direction: column;
        gap: 2px;
        margin-top: 8px;
        padding-top: 7px;
        font-size: 0.72rem;
      }
      /* library peek: level, time and cost under the description */
      .peek-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .peek-tags span {
        padding: 2px 7px;
        border: 1.5px solid var(--line);
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--ink);
      }
      .peek-tags .lvl {
        background: var(--sw);
        color: var(--chip-ink);
        font-weight: 700;
      }
      .peek-road {
        margin: 10px 0 0;
        font-size: 0.8rem;
        line-height: 1.45;
        color: var(--ink-soft);
      }
      .peek-road b {
        color: var(--ink);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 12px 18px;
        border: 2px solid var(--line);
        background: var(--sw, var(--c-mcp));
        color: var(--chip-ink);
        font-weight: 700;
        box-shadow: 4px 4px 0 var(--shadow);
        transform: translate(-50%, calc(100% + 40px));
        visibility: hidden;
        transition: transform 0.3s ease, visibility 0s linear 0.3s;
      }
      /* celebration when a course is ticked: confetti bursts from the tick, balloons float up */
      .fx {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        overflow: hidden;
      }
      .fx i {
        position: absolute;
        width: 8px;
        height: 12px;
        border: 1px solid var(--line);
      }
      .fx span {
        position: absolute;
        font-size: 1.9rem;
        line-height: 1;
      }
      .toast.show {
        transform: translate(-50%, 0);
        visibility: visible;
        transition: transform 0.3s ease;
      }
      .wk-badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--dim);
      }
      .key-badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--ink);
      }

      /* ---------- narrow screens ---------- */
      @media (max-width: 860px) {
        .bar {
          grid-template-columns: minmax(0, 1fr) auto;
          padding-block: 10px;
          padding-inline: 16px;

      const FORMATS = {
