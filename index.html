            { url: "https://www.coursera.org/specializations/machine-learning-introduction", note: "Andrew Ng's three-course specialization: the thorough version." },
          ],
        },
        {
          id: "maths", stage: "advanced", t: "foundations",
          title: "The maths under the models",
          goal: "Get comfortable with the linear algebra, calculus and probability that model training is built on, then watch that maths teach a neural network, so research courses and papers make sense.",
          learn: [
            { url: "https://www.deeplearning.ai/specializations/mathematics-for-machine-learning-and-data-science" },
            { url: "http://neuralnetworksanddeeplearning.com/index.html", note: "Free online book: build a network from scratch and work through backpropagation step by step." },
            { url: "https://www.edx.org/bio/pavlos-protopapas-3", opt: true, note: "Harvard data science and machine learning courses to practise the maths on." },
          ],
        },
        {
          id: "frontier", stage: "advanced", t: "foundations",
          title: "The research frontier",
          goal: "Look under the hood at self-improving agents, how language models are trained from scratch, and machine learning on graphs.",
          learn: [
            { url: "https://cs329a.stanford.edu/" },
            { url: "https://cs336.stanford.edu/", note: "Build a language model from scratch: demanding, and the payoff for the maths week." },
            { url: "https://web.stanford.edu/class/cs224w/", opt: true, note: "The theory behind graph learning, if the knowledge graph week hooked you." },
          ],
        },
      ].map((w, i) => ({ ...w, n: i + 1 }));

      const FORMATS = {
        course: { label: "Course", icon: '<path d="M1 4l5-3 5 3-5 3z M3 5.5V8.5c1.5 1.3 4.5 1.3 6 0V5.5" fill="none" stroke="currentColor" stroke-width="1.4"/>' },
        video: { label: "Video", icon: '<path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/>' },
        series: { label: "Series", icon: '<path d="M1 2h10M1 6h10M1 10h10" stroke="currentColor" stroke-width="1.6"/>' },
        tutorial: { label: "Tutorial", icon: '<path d="M4 3L1 6l3 3M8 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5"/>' },
        article: { label: "Article", icon: '<path d="M2 1h8v10H2z M4 4h4M4 6h4M4 8h2" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
        notes: { label: "Notes", icon: '<path d="M2 1h6l2 2v8H2z M4 5h4M4 7.5h4" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
        guide: { label: "Guide", icon: '<path d="M1 2.5l3-1.2 4 1.4 3-1.2v8.2l-3 1.2-4-1.4-3 1.2z M4 1.3v8.2 M8 2.7v8.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>' },
        book: { label: "Book", icon: '<path d="M6 2.5C4.5 1.5 2.8 1.3 1 1.5v8c1.8-.2 3.5 0 5 1 1.5-1 3.2-1.2 5-1v-8c-1.8-.2-3.5 0-5 1z M6 2.5v8" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
        profile: { label: "Profile", icon: '<path d="M6 5.5a2 2 0 100-4 2 2 0 000 4z M1.8 10.8c0-2.3 1.9-3.6 4.2-3.6s4.2 1.3 4.2 3.6" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
      };

      // every visit opens on the library in list view; only a #week-N link opens the roadmap
      const state = { mode: "intro", topic: "all", format: "all", status: "all", q: "", view: "list" };

      // progress: ticked resource urls, plus "week:<id>" once a week is marked complete
      let done = new Set();
      try {
        done = new Set(JSON.parse(localStorage.getItem("shelf-progress") || "[]"));
      } catch (e) {}
      function saveProgress() {
        try {
          localStorage.setItem("shelf-progress", JSON.stringify([...done]));
        } catch (e) {}
      }

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const host = (u) => new URL(u).hostname.replace(/^www\./, "");
      const topicOf = (id) => TOPICS.find((t) => t.id === id);
      const pad = (n) => String(n).padStart(2, "0");

      const byUrl = Object.fromEntries(RESOURCES.map((r) => [r.url, r]));
      const weekOf = {};
      const mustRead = new Set();
      ROADMAP.forEach((w) =>
        w.learn.forEach((s) => {
          if (!byUrl[s.url]) console.warn("Roadmap link missing from RESOURCES:", s.url);
          weekOf[s.url] = w.n;
          if (s.key) mustRead.add(s.url);
        })
      );

      // a week's required steps are its core (non-optional) resources
      const required = (w) => w.learn.filter((s) => !s.opt).map((s) => s.url);
      const weekDone = (w) => required(w).filter((k) => done.has(k)).length;
      // a week only counts as complete when the learner presses its complete button
      const weekComplete = (w) => done.has("week:" + w.id);

      // weeks used to be saved by number; carry those over to the stable ids
      const OLD_WEEK_IDS = ["llms", "rag", "context", "agent", "mcp", "mcp-server", "skills", "evals", "graphs", "harness", "production", "frontier"];
      if ([...done].some((k) => /^week:\d+$/.test(k))) {
        done = new Set([...done].map((k) => (/^week:\d+$/.test(k) ? "week:" + OLD_WEEK_IDS[+k.slice(5) - 1] : k)));
        saveProgress();
      }

      function hits(parts) {
        if (!state.q) return true;
        const hay = parts.join(" ").toLowerCase();
        return state.q
          .toLowerCase()
          .split(/\s+/)
          .every((w) => hay.includes(w));
      }

      function matches(r) {
        if (state.format !== "all" && r.f !== state.format) return false;
        if (state.status !== "all" && done.has(r.url) !== (state.status === "done")) return false;
        return hits([r.title, r.by, host(r.url), topicOf(r.t).name, FORMATS[r.f].label]);
      }

      function weekMatches(w) {
        const res = w.learn.map((s) => byUrl[s.url]).filter(Boolean);
        return hits([
          "week " + w.n, w.title, w.goal, topicOf(w.t).name,
          ...res.flatMap((r) => [r.title, r.by, host(r.url)]),
        ]);
      }

      // library progress counts a topic's ticked resources, whatever the filters show
      const topicRes = (id) => (id === "all" ? RESOURCES : RESOURCES.filter((r) => r.t === id));
      const doneIn = (rs) => rs.filter((r) => done.has(r.url)).length;
      const STATUSES = { all: "any", todo: "to do", done: "done" };

      // each topic wears its planet from the intro; the rest get the sky's other bodies
      function railBody(id) {
        if (id === "all") return "mini-galaxy";
        if (id === SUN.id) return "mini-sun";
        const p = PLANETS.find((x) => x.id === id);
        return p ? "pl-" + p.body : "mini-moon";
      }

      function renderRail() {
        const pool = RESOURCES.filter(matches);
        const filtered = state.q || state.format !== "all" || state.status !== "all";
        const items = [{ id: "all", name: "All topics" }, ...TOPICS];
        $("#rail-nav").innerHTML = items
          .map((t) => {
            const all = topicRes(t.id);
            const d = doneIn(all);
            // with filters on, the count is what's showing; otherwise it's done/total
            const n = filtered ? pool.filter((r) => t.id === "all" || r.t === t.id).length : d ? `${d}/${all.length}` : all.length;
            const sw = t.id === "all" ? "var(--surface)" : `var(--c-${t.id})`;
            const pc = t.id === "all" ? "var(--accent)" : sw;
            return `<button class="rail-item" type="button" data-topic="${t.id}" aria-pressed="${state.topic === t.id}" title="${d} of ${all.length} done" style="--sw:${sw};--pc:${pc};--p:${Math.round((d / all.length) * 100)}%">
              <span class="sw mini ${railBody(t.id)}" aria-hidden="true"><span class="orb"></span></span><span>${esc(t.name)}</span><span class="n">${n}</span></button>`;
          })
          .join("");

        $("#status-row").innerHTML = Object.entries(STATUSES)
          .map(([k, label]) => `<button class="fmt-btn" type="button" data-status="${k}" aria-pressed="${state.status === k}">${label}</button>`)
          .join("");
        const d = doneIn(RESOURCES);
        $("#rail-reset").innerHTML = done.size
          ? '<button class="link-btn" type="button" data-reset-all title="Untick every course in the library and roadmap and start from scratch">Reset all progress</button>'
          : "";
        $("#rail-progress").innerHTML = `<span class="meter" style="--sw:var(--accent)" aria-hidden="true"><i style="width:${Math.round((d / RESOURCES.length) * 100)}%"></i></span><span>${d} of ${RESOURCES.length} done</span>`;

        const fmts = ["all", ...Object.keys(FORMATS).filter((f) => RESOURCES.some((r) => r.f === f))];
        $("#fmt-row").innerHTML = fmts
          .map(
            (f) =>
              `<button class="fmt-btn" type="button" data-format="${f}" aria-pressed="${state.format === f}">${f === "all" ? "any" : FORMATS[f].label.toLowerCase()}</button>`
          )
          .join("");
      }

      function slip(r, next) {
        const fmt = FORMATS[r.f];
        const on = done.has(r.url);
        const isNext = r.url === next;
        return `<li class="${on ? "is-done" : ""}${isNext ? "is-next" : ""}" data-url="${esc(r.url)}"><a class="slip" href="${esc(r.url)}" target="_blank" rel="noopener" style="--sw:var(--c-${r.t})">
          <span class="fmt"><svg viewBox="0 0 12 12" aria-hidden="true">${fmt.icon}</svg>${fmt.label}</span>
          <span class="slip-body">
            <p class="slip-title">${esc(r.title)}</p>
            <p class="slip-meta"><span>${esc(r.by)}</span><span class="host">${host(r.url)}</span>${
              weekOf[r.url] ? `<span class="wk-badge">week ${weekOf[r.url]}</span>` : ""
            }${mustRead.has(r.url) ? '<span class="key-badge">★ must read</span>' : ""}${
              on ? '<span class="done-badge">✓ done</span>' : isNext ? '<span class="next-badge">→ up next</span>' : ""
            }</p>
          </span>
        </a>
        <label class="mark">
          <input class="tick" type="checkbox" data-key="${esc(r.url)}"${on ? " checked" : ""} aria-label="Mark ${esc(r.title)} as done" />
          <span aria-hidden="true"><b></b>${ICON.check}</span>
        </label></li>`;
      }

      // stays under a finished tab, with a way on to the next module
      function doneBanner(t) {
        const nxt = TOPICS[TOPICS.indexOf(t) + 1];
        return `<div class="shelf-done" style="--sw:var(--c-${t.id})" role="status">
          <span aria-hidden="true">🍾</span><p>${esc(doneMsg(t))}</p>
          ${nxt ? `<button type="button" data-goto="${nxt.id}">Next module: ${esc(nxt.name)} →</button>` : ""}
        </div>`;
      }
      const doneMsg = (t) => `Congrats on completing the ${t.name} module! You've done great work. Keep the momentum going.`;

      function renderShelves() {
        hidePeek();
        const visible = RESOURCES.filter(matches);
        const topics = state.topic === "all" ? TOPICS : [topicOf(state.topic)];
        const html = topics
          .map((t) => {
            const rs = visible.filter((r) => r.t === t.id);
            if (!rs.length) return "";
            const all = topicRes(t.id);
            const d = doneIn(all);
            // tabs run beginner to advanced, so the first unticked resource is the next one to take
            const next = (all.find((r) => !done.has(r.url)) || {}).url;
            return `<section class="shelf" id="${t.id}" aria-labelledby="h-${t.id}">
              <div class="shelf-head">
                <h2 id="h-${t.id}"><span class="tab" style="--sw:var(--c-${t.id})" aria-hidden="true"></span>${esc(t.name)}</h2>
                <div class="shelf-progress" style="--sw:var(--c-${t.id})">
                  <span class="meter" aria-hidden="true"><i style="width:${Math.round((d / all.length) * 100)}%"></i></span>
                  <span>${d === all.length ? `all ${d} done ✓` : `${d} of ${all.length} done`}</span>
                  ${d ? `<button class="link-btn" type="button" data-reset-topic="${t.id}" title="Untick every course in ${esc(t.name)}">reset</button>` : ""}
                </div>
              </div>
              <ul class="slips">${rs.map((r) => slip(r, next)).join("")}</ul>
              ${d === all.length ? doneBanner(t) : ""}
            </section>`;
          })
          .join("");

        const shown = topics.reduce((n, t) => n + visible.filter((r) => r.t === t.id).length, 0);

        $("#shelves").innerHTML =
          html ||
          `<div class="empty"><strong>Nothing on this shelf</strong>No ${state.status === "all" ? "" : STATUSES[state.status] + " "}resources${state.q ? ` match “${esc(state.q)}”` : ""}${
            state.format !== "all" ? " in " + FORMATS[state.format].label.toLowerCase() + "s" : ""
          }. Try a broader word, another format or another status.<br /><button type="button" id="reset">Show everything</button></div>`;

        $("#shelves").classList.toggle("grid-view", state.view === "grid");
        $("#view-list").setAttribute("aria-pressed", state.view === "list");
        $("#view-grid").setAttribute("aria-pressed", state.view === "grid");
        $("#q-clear").hidden = !state.q;
      }

      const weekByN = (n) => ROADMAP.find((w) => w.n === n);
      const currentWeek = () => ROADMAP.find((w) => !weekComplete(w));
      const nextKey = (w) => required(w).find((k) => !done.has(k));
      const pctOf = (w) => Math.round((weekDone(w) / required(w).length) * 100);
      const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>';

      function renderHero() {
        const total = ROADMAP.reduce((a, w) => a + required(w).length, 0);
        const got = ROADMAP.reduce((a, w) => a + (weekComplete(w) ? required(w).length : weekDone(w)), 0);
        const weeks = ROADMAP.filter(weekComplete).length;
        const cur = currentWeek();
        const stage = STAGES.find((s) => s.id === (cur || ROADMAP[ROADMAP.length - 1]).stage);
        const started = ROADMAP.some((w) => weekComplete(w) || weekDone(w) > 0);

        return `<div class="rm-hero">
          <div class="stats">
            ${
              cur
                ? `<button class="resume-btn" type="button" data-resume="${cur.n}">
                    <span>${started ? "Continue where you left off" : "Start the roadmap"}</span>
                    <b>Week ${cur.n}: ${esc(cur.title)}</b>
                  </button>`
                : ""
            }
            <div class="stat"><span>Weeks complete</span><b>${weeks}/${ROADMAP.length}</b></div>
            <div class="stat"><span title="Core courses and articles ticked off; optional ones don't count">Items done</span><b>${got}/${total}</b></div>
            <div class="stat"><span>Current stage</span><b>${esc(stage.name)}</b></div>
            <button class="csv-btn" type="button" data-csv title="Download every week and material, with your progress, as a spreadsheet">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.8 7l3.2 3.2L11.2 7M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download CSV</span>
            </button>
            <button class="reset-btn" type="button" data-reset${done.size ? "" : " disabled"} title="Clear all ticks and completed weeks and start again from week 1">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.8h2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Start over</span>
            </button>
          </div>
        </div>`;
      }

      function renderPath() {
        const cur = currentWeek();
        const anyDone = ROADMAP.some((w) => weekComplete(w) || weekDone(w) > 0);
        let i = 0;
        const rows = STAGES.map((s, si) => {
          const ws = ROADMAP.filter((w) => w.stage === s.id);
          const full = ws.every(weekComplete);
          const head = `<div class="checkpoint${full ? " done" : ""}">
            <span class="k">Stage ${si + 1} · weeks ${ws[0].n}–${ws[ws.length - 1].n}${full ? " · complete" : ""}</span>
            <b>${esc(s.name)}: ${esc(s.sub)}</b>
          </div>`;
          const stops = ws
            .map((w) => {
              // a gentle wave: alternate stops swing left and right of centre
              const k = Math.round(Math.sin(i++ * 1.05) * 100) / 100;
              const complete = weekComplete(w);
              const d = weekDone(w);
              const n = required(w).length;
              const cls = complete ? "is-done" : w === cur ? "is-current" : d ? "is-started" : "is-todo";
              const dim = state.q && !weekMatches(w) ? " dim" : "";
              const status = complete ? "complete" : d === n ? "ready to complete" : w === cur ? (d ? `in progress · ${d}/${n}` : "up next") : d ? `${d}/${n} done` : `${n} item${n === 1 ? "" : "s"}`;
              return `<div class="stop-row">
                <button class="stop ${cls}${dim}" type="button" data-week="${w.n}" aria-pressed="${state.open && state.sel === w.n}"
                  aria-label="Week ${w.n}: ${esc(w.title)}, ${status}" style="--k:${k};--p:${complete ? 100 : pctOf(w)};--sw:var(--c-${w.t})">
                  ${w === cur ? `<span class="here">${anyDone ? "You are here" : "Start here"}</span>` : ""}
                  <span class="node"><span class="face">${complete ? CHECK : w.n}</span></span>
                  <span class="stop-label${k > 0.3 ? " left" : ""}" aria-hidden="true">
                    <span class="wk">Week ${pad(w.n)} · ${esc(topicOf(w.t).name)}</span>
                    <span class="t">${esc(w.title)}</span>
                    <span class="m">${status}</span>
                  </span>
                </button>
              </div>`;
            })
            .join("");
          return head + stops;
        }).join("");

        const hits = state.q ? ROADMAP.filter(weekMatches).length : 0;
        const note = state.q
          ? `<p class="search-note">${hits ? `${hits} of ${ROADMAP.length} weeks mention “${esc(state.q)}” and stay highlighted.` : `No week mentions “${esc(state.q)}”.`} <button class="link-btn" type="button" id="reset">clear search</button></p>`
          : "";
        return note + `<div class="path" id="path"><svg class="path-svg" aria-hidden="true"></svg>${rows}</div>`;
      }

      // connect the stops with a curve; the solid part runs up to where you are
      function drawPath() {
        const path = $("#path");
        if (!path || state.mode !== "roadmap") return;
        const box = path.getBoundingClientRect();
        const pts = [...path.querySelectorAll(".node")].map((n) => {
          const r = n.getBoundingClientRect();
          return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top];
        });
        if (!pts.length) return;
        const curve = (upto) => {
          let d = `M ${pts[0][0]} ${pts[0][1]}`;
          for (let j = 1; j <= upto; j++) {
            const [a, b] = [pts[j - 1], pts[j]];
            const my = (a[1] + b[1]) / 2;
            d += ` C ${a[0]} ${my} ${b[0]} ${my} ${b[0]} ${b[1]}`;
          }
          return d;
        };
        let reach = ROADMAP.findIndex((w) => !weekComplete(w));
        if (reach === -1) reach = pts.length - 1;
        path.querySelector(".path-svg").innerHTML =
          `<path class="base" d="${curve(pts.length - 1)}"/>` + (reach > 0 ? `<path class="fill" d="${curve(reach)}"/>` : "");
      }

      const ICON = {
        left: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        right: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        close: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
        check: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      };

      // one reading-list row; core items carry their suggested order as the checkbox face
      function step(s, nk, num) {
        const r = byUrl[s.url];
        if (!r) return "";
        const on = done.has(r.url);
        const next = r.url === nk;
        return `<li class="step${on ? " is-done" : ""}${next ? " is-next" : ""}${s.key ? " is-key" : ""}">
          <label class="mark">
            <input class="tick" type="checkbox" data-key="${esc(r.url)}"${on ? " checked" : ""} aria-label="Mark ${esc(r.title)} as done" />
            <span aria-hidden="true"><b>${num || ""}</b>${ICON.check}</span>
          </label>
          <div class="step-body">
            <a class="step-link" href="${esc(r.url)}" target="_blank" rel="noopener"><span class="step-title">${s.key ? '<span class="star" aria-hidden="true">★</span>' : ""}${esc(r.title)}</span></a>
            <p class="step-meta">${s.key ? "<b>Must read.</b> " : ""}${FORMATS[r.f].label} from ${esc(r.by)}${next ? ", start here" : ""}</p>
            ${s.note ? `<p class="step-note">${esc(s.note)}</p>` : ""}
          </div>
        </li>`;
      }

      function renderPanel() {
        const w = weekByN(state.sel) || ROADMAP[0];
        const si = STAGES.findIndex((s) => s.id === w.stage);
        const d = weekDone(w);
        const n = required(w).length;
        const nk = nextKey(w);
        const nxt = weekByN(w.n + 1);
        const complete = weekComplete(w);
        const core = w.learn.filter((s) => !s.opt);
        const extras = w.learn.filter((s) => s.opt);
        const panel = $("#panel");
        panel.style.setProperty("--sw", `var(--c-${w.t})`);
        panel.innerHTML = `<div class="panel-head">
            <div class="panel-top">
              <span>${esc(STAGES[si].name)} stage, week ${w.n} of ${ROADMAP.length}</span>
              <span class="arrows">
                <button class="icon-btn" type="button" data-go="${w.n - 1}"${w.n === 1 ? " disabled" : ""} aria-label="Previous week" title="Previous week">${ICON.left}</button>
                <button class="icon-btn" type="button" data-go="${w.n + 1}"${nxt ? "" : " disabled"} aria-label="Next week" title="Next week">${ICON.right}</button>
                <button class="icon-btn" type="button" data-close aria-label="Close" title="Close">${ICON.close}</button>
              </span>
            </div>
            <div class="wk-head">
              <span class="wk-num" aria-hidden="true">${w.n}</span>
              <div>
                <h2 id="panel-title">${esc(w.title)}</h2>
                <p class="goal">${esc(w.goal)}</p>
              </div>
            </div>
          </div>
          <div class="panel-body">
            <section>
              <div class="list-head"><h3>This week's materials</h3><span>${complete ? "All done" : `${d} of ${n} done`}</span></div>
              <ol class="steps">${core.map((s, i) => step(s, nk, i + 1)).join("")}</ol>
            </section>
            ${
              extras.length
                ? `<section class="extras">
                    <div class="list-head"><h3>Optional extras</h3><span>Not needed to finish the week</span></div>
                    <ul class="steps">${extras.map((s) => step(s, nk)).join("")}</ul>
                  </section>`
                : ""
            }
            <div class="wk-actions">
              ${
                complete
                  ? `<div class="done-line">
                      <span class="swatch">${ICON.check}</span>
                      <span>Week ${w.n} complete</span>
                      <button class="link-btn" type="button" data-undo="${w.n}">Undo</button>
                    </div>
                    ${nxt ? `<button class="next-btn" type="button" data-go="${nxt.n}">Start week ${nxt.n}: ${esc(nxt.title)}</button>` : ""}`
                  : `<button class="complete-btn" type="button" data-complete="${w.n}">${ICON.check}Mark week ${w.n} complete</button>
                    <span class="hint">${d === n ? "You've done every core item." : `${d} of ${n} core items done so far.`}</span>`
              }
            </div>
          </div>
          <div class="panel-foot">
            <span>Progress is saved in this browser only.</span>
            ${done.size ? `<button class="link-btn" type="button" data-reset>Reset progress</button>` : ""}
          </div>`;
      }

      function renderRoadmap() {
        $("#rm-main").innerHTML = renderHero() + renderPath();
        renderPanel();
        drawPath();
        $("#q-clear").hidden = !state.q;
      }

      // the solar system: the LLM is the Sun, and the nine other library topics
      // orbit it. The most important concept gets the biggest planet (Jupiter,
      // Saturn, Uranus, Neptune, Earth, Venus, Mars, Mercury, Pluto); the list is
      // in orbit order outward from the Sun. s is the planet's diameter in px.
      const SUN = { id: "foundations", name: "LLM" };
      const PLANETS = [
        { body: "mercury", id: "claude-code", name: "Claude Code", s: 24 },
        { body: "venus", id: "context", name: "Prompting", s: 40 },
        { body: "earth", id: "evals", name: "Evals", s: 44 },
        { body: "mars", id: "skills", name: "Skills", s: 32 },
        { body: "jupiter", id: "agents", name: "Agents", s: 104 },
        { body: "saturn", id: "harness", name: "Harness", s: 86 },
        { body: "uranus", id: "graphrag", name: "RAG", s: 60 },
        { body: "neptune", id: "mcp", name: "MCP", s: 58 },
        { body: "pluto", id: "observability", name: "Observability", s: 18 },
      ];
      const cap = (w) => w[0].toUpperCase() + w.slice(1);
      function renderIntro() {
        const cur = currentWeek();
        const road = !done.size
          ? "Follow the roadmap"
          : cur
            ? `Continue week ${cur.n}: ${esc(cur.title)}`
            : "Review the roadmap";
        $("#intro").innerHTML = `
          <canvas class="sky" aria-hidden="true"></canvas>
          <div class="sky-twinkle" aria-hidden="true">${TWINKLES}</div>
          <div class="intro-inner">
            <h1>Master AI, one concept at a time</h1>
            <div class="intro-text">
              <div class="intro-ways">
                <a class="way" href="start.html" style="--sw:var(--c-skills)">
                  <span>
                    <span class="way-q">New to AI engineering?</span>
                    <b>Read the guide</b>
                    <span class="way-d">The five parts of the field and the order to learn them in.</span>
                  </span>
                </a>
                <button class="way" type="button" data-mode="roadmap" style="--sw:var(--c-mcp)">
                  <span>
                    <span class="way-q">Want a plan?</span>
                    <b>${road}</b>
                    <span class="way-d">${ROADMAP.length} weeks, from beginner to advanced. Tick things off as you go.</span>
                  </span>
                </button>
                <button class="way" type="button" data-mode="library" style="--sw:var(--c-agents)">
                  <span>
                    <span class="way-q">Know what you need?</span>
                    <b>Browse the library</b>
                    <span class="way-d">Every resource, sorted by topic, with search and filters.</span>
                  </span>
                </button>
              </div>
            </div>
            <div class="intro-art">
              <div class="solar">
                <div class="orbits" aria-hidden="true"></div>
                <a class="sun" href="#${SUN.id}" aria-label="${SUN.name}, the Sun at the centre: open Foundations in the library"><span class="sun-name" aria-hidden="true">${SUN.name}</span></a>
                ${PLANETS.map((t, i) => `<a class="planet pl-${t.body}" href="#${t.id}" style="--s:${t.s}px;--i:${i}" aria-label="${t.name}, on ${cap(t.body)}: open this topic in the library"><span class="orb" aria-hidden="true"></span><span class="pname">${t.name}</span></a>`).join("")}
              </div>
            </div>
          </div>`;
        typeHeadline();
        drawGalaxy();
        layoutSolar();
        startPlanets3D();
      }

      // place the Sun, its orbit rings and the planets to fit the band: the Sun
      // glows in from the left and the planets fan out to the right, or, on
      // phones, the Sun sits above and the planets run down the page. Planets
      // alternate either side of the line so their names never collide.
      function layoutSolar() {
        const box = $("#intro .solar");
        if (!box || $("#intro").hidden) return;
        const W = box.clientWidth;
        if (!W) return;
        const tall = W < 1040;
        // wide: a big Sun rising in from the left edge; tall: a whole small Sun on top
        const R = tall ? 70 : 160;
        const gap = tall ? 84 : (W - 40 - R * 0.55 - 70) / PLANETS.length;
        const cx = tall ? W / 2 : -R * 0.45;
        const cy = tall ? R + 16 : 180;
        const H = tall ? cy + R + 56 + gap * (PLANETS.length - 1) + 70 : 360;
        const swing = tall ? Math.min(W * 0.24, 150) : 76; // how far planets sit either side of the line
        box.style.height = H + "px";
        box.style.setProperty("--k", tall ? 0.9 : 1);
        const sun = box.querySelector(".sun");
        Object.assign(sun.style, { left: cx - R + "px", top: cy - R + "px", width: R * 2 + "px", height: R * 2 + "px" });
        // wide: only a slice 0.55R deep shows, so centre the name in that slice
        const label = sun.querySelector(".sun-name");
        label.style.left = (tall ? R : R * 1.725) + "px";
        label.style.top = R + "px";
        const rings = box.querySelector(".orbits");
        rings.replaceChildren();
        box.querySelectorAll(".planet").forEach((a, i) => {
          const radius = R + (tall ? 56 : 70) + gap * i; // from the Sun's centre
          const side = i % 2 ? -1 : 1;
          const off = side * Math.min(swing, radius * 0.9);
          const along = Math.sqrt(radius * radius - off * off);
          a.style.setProperty("--px", (tall ? cx + off : cx + along) + "px");
          a.style.setProperty("--py", (tall ? cy + along : cy + off) + "px");
          a.classList.toggle("up", !tall && side < 0);
          const ring = document.createElement("span");
          ring.className = "orbit";
          Object.assign(ring.style, { left: cx - radius + "px", top: cy - radius + "px", width: radius * 2 + "px", height: radius * 2 + "px" });
          rings.append(ring);
        });
        syncPlanets3D();
      }

      // 3D planets. Once the intro shows, three.js (loaded only then, from a CDN)
      // draws each planet as a textured sphere spinning on its tilted axis and lit
      // by the Sun, in one transparent canvas over the band. The CSS planets stay
      // as the fallback if WebGL or the library can't load, and the links, names,
      // hover and keyboard focus are still the HTML ones on top. Maps: Solar System
      // Scope, CC BY 4.0 (see textures/CREDITS.md); Pluto is drawn here.
      const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
      // axial tilt in degrees (past 90, the planet spins backwards) and spin in turns a minute, for show
      const BODY3D = {
        mercury: { tilt: 0, spin: 1.5 },
        venus: { tilt: 177, spin: 1 },
        earth: { tilt: 23, spin: 6 },
        mars: { tilt: 25, spin: 5.8 },
        jupiter: { tilt: 3, spin: 10 },
        saturn: { tilt: 27, spin: 9 },
        uranus: { tilt: 98, spin: 7 },
        neptune: { tilt: 28, spin: 6.5 },
        pluto: { tilt: 120, spin: 1 },
      };
      let space3d; // undefined until tried, false if unavailable, then the running scene
      async function startPlanets3D() {
        // opened straight from disk, the browser won't let WebGL read the maps (the
        // planets would draw black), so keep the CSS planets
        if (location.protocol === "file:") space3d = false;
        if (space3d === false) return;
        if (!space3d) {
          if (startPlanets3D.loading) return;
          startPlanets3D.loading = true;
          try {
            const THREE = await import(THREE_URL);
            space3d = buildSpace3D(THREE, new THREE.WebGLRenderer({ antialias: true, alpha: true }));
          } catch (e) {
            space3d = false; // no WebGL or no network: keep the CSS planets
            return;
          }
        }
        attachPlanets3D();
      }

      function buildSpace3D(THREE, renderer) {
        renderer.setClearColor(0x000000, 0);
        const scene = new THREE.Scene();
        // pixel units with y downwards turned upwards: a planet at (px, py) sits at (px, -py)
        const camera = new THREE.OrthographicCamera(0, 1, 0, -1, -2000, 2000);
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));
        const sunLight = new THREE.PointLight(0xfff1dc, 3.4, 0, 0);
        scene.add(sunLight);
        // show the 3D planets only once every map has arrived (no black spheres while
        // loading), and give up for the CSS planets if any map fails
        const manager = new THREE.LoadingManager(
          () => {
            if (!space3d) return; // a map failed, so the CSS planets stay
            space3d.ready = true;
            reveal3D();
          },
          undefined,
          () => drop3D()
        );
        const loader = new THREE.TextureLoader(manager);
        const texture = (file) => {
          const t = loader.load("textures/" + file);
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 4;
          return t;
        };
        const ball = new THREE.SphereGeometry(1, 48, 32);
        const bodies = {};
        for (const p of PLANETS) {
          const holder = new THREE.Group(); // position and size
          const axis = new THREE.Group(); // the tilted axis, seen a little from above
          axis.rotation.z = THREE.MathUtils.degToRad(-BODY3D[p.body].tilt);
          axis.rotation.x = 0.35;
          const map = p.body === "pluto" ? plutoTexture(THREE) : texture(p.body + ".jpg");
          const globe = new THREE.Mesh(ball, new THREE.MeshStandardMaterial({ map, roughness: 1, metalness: 0 }));
          axis.add(globe);
          holder.add(axis);
          scene.add(holder);
          bodies[p.body] = { holder, axis, globe, h: 0, hover: false };
        }
        // Saturn's ring: the ring map runs from the inner edge to the outer one
        const ringGeo = new THREE.RingGeometry(1.25, 2.3, 96, 1);
        const pos = ringGeo.attributes.position, uv = ringGeo.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          const d = Math.hypot(pos.getX(i), pos.getY(i));
          uv.setXY(i, (d - 1.25) / (2.3 - 1.25), 0.5);
        }
        const ring = new THREE.Mesh(
          ringGeo,
          // unlit, since the Sun meets it almost edge on and would leave it dark
          new THREE.MeshBasicMaterial({ map: texture("saturn-ring.png"), color: 0xe6dcc8, transparent: true, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2; // into the equator's plane
        bodies.saturn.axis.add(ring);
        // Uranus's faint ring, upright because the planet lies on its side
        const uRing = new THREE.Mesh(
          new THREE.RingGeometry(1.55, 1.62, 96, 1),
          new THREE.MeshBasicMaterial({ color: 0xcfeff3, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
        );
        uRing.rotation.x = -Math.PI / 2;
        bodies.uranus.axis.add(uRing);
        // Triton, circling Neptune
        const pivot = new THREE.Group();
        const triton = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), new THREE.MeshStandardMaterial({ map: texture("triton.jpg"), roughness: 1 }));
        triton.position.set(1.9, 0.25, 0);
        pivot.rotation.x = 0.35;
        pivot.add(triton);
        bodies.neptune.holder.add(pivot);
        bodies.neptune.moon = pivot;
        return { renderer, scene, camera, sunLight, bodies, links: {}, running: false, born: 0, ready: false };
      }

      // Pluto has no map in the set, so paint one: tan ground, darker patches and its pale heart
      function plutoTexture(THREE) {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 128;
        const x = c.getContext("2d");
        const r = seeded(5);
        x.fillStyle = "#b99a7a";
        x.fillRect(0, 0, 256, 128);
        for (let i = 0; i < 60; i++) {
          x.fillStyle = `rgba(${(90 + r() * 40) | 0},${(60 + r() * 30) | 0},${(40 + r() * 20) | 0},${(0.15 + r() * 0.25).toFixed(2)})`;
          x.beginPath();
          x.ellipse(r() * 256, 20 + r() * 88, 6 + r() * 22, 4 + r() * 12, 0, 0, 7);
          x.fill();
        }
        x.fillStyle = "rgba(245, 236, 222, 0.92)";
        x.beginPath();
        x.arc(140, 62, 14, 0, 7);
        x.arc(164, 62, 14, 0, 7);
        x.fill();
        x.beginPath();
        x.moveTo(127, 68);
        x.lineTo(177, 68);
        x.lineTo(152, 94);
        x.fill();
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      // put the canvas into the (freshly rendered) band and wire hover and focus to the 3D planets
      function attachPlanets3D() {
        const box = $("#intro .solar");
        if (!box || !space3d) return;
        const cv = space3d.renderer.domElement;
        cv.className = "planets3d";
        cv.setAttribute("aria-hidden", "true");
        box.querySelector(".orbits").after(cv);
        space3d.links = {};
        box.querySelectorAll(".planet").forEach((a) => {
          const body = /pl-(\w+)/.exec(a.className)[1];
          const b = space3d.bodies[body];
          space3d.links[body] = a;
          const on = () => (b.hover = true), off = () => (b.hover = false);
          a.addEventListener("pointerenter", on);
          a.addEventListener("pointerleave", off);
          a.addEventListener("focus", on);
          a.addEventListener("blur", off);
        });
        space3d.born = performance.now();
        syncPlanets3D();
        reveal3D();
      }
      // swap the CSS planets for the 3D ones (the canvas fades in) once the maps are in
      function reveal3D() {
        const box = $("#intro .solar");
        if (!space3d || !space3d.ready || !box || !box.contains(space3d.renderer.domElement)) return;
        box.classList.add("gl");
        kick3D();
      }
      function drop3D() {
        if (!space3d) return;
        space3d.renderer.domElement.remove();
        document.querySelectorAll(".solar.gl").forEach((el) => el.classList.remove("gl"));
        space3d = false;
      }

      // match the 3D scene to the band: its size, each planet's place and size, the Sun's light
      function syncPlanets3D() {
        const box = $("#intro .solar");
        if (!space3d || !box || !box.contains(space3d.renderer.domElement)) return;
        const W = box.clientWidth, H = box.clientHeight;
        const k = parseFloat(box.style.getPropertyValue("--k")) || 1;
        space3d.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        space3d.renderer.setSize(W, H, false);
        Object.assign(space3d.camera, { left: 0, right: W, top: 0, bottom: -H });
        space3d.camera.updateProjectionMatrix();
        for (const [body, a] of Object.entries(space3d.links)) {
          const b = space3d.bodies[body];
          b.x = parseFloat(a.style.getPropertyValue("--px"));
          b.y = parseFloat(a.style.getPropertyValue("--py"));
          b.r = (parseFloat(a.style.getPropertyValue("--s")) * k) / 2;
        }
        const sun = box.querySelector(".sun");
        const R = parseFloat(sun.style.width) / 2;
        space3d.sunLight.position.set(parseFloat(sun.style.left) + R, -(parseFloat(sun.style.top) + R), 320);
        kick3D();
      }
      function kick3D() {
        if (!space3d || space3d.running) return;
        space3d.running = true;
        requestAnimationFrame(spinFrame);
      }
      function spinFrame(now) {
        const s3 = space3d;
        if (!s3) return; // the 3D planets were dropped for the CSS ones
        const box = $("#intro .solar");
        if (!box || $("#intro").hidden || !box.contains(s3.renderer.domElement)) return (s3.running = false);
        const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const dt = Math.min(0.05, (now - (s3.last || now)) / 1000);
        s3.last = now;
        const age = now - s3.born;
        PLANETS.forEach((p, i) => {
          const b = s3.bodies[p.body];
          if (b.x === undefined) return;
          // grow in one after another with a little overshoot, then bob; a bit bigger under the pointer
          const t = still ? 1 : Math.min(1, Math.max(0, (age - (i * 110 + 350)) / 900));
          const arrive = t === 0 ? 0 : 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
          b.h += ((b.hover ? 1 : 0) - b.h) * Math.min(1, dt * 10);
          const bob = still ? 0 : 5 * Math.cos(((now / 1000) * Math.PI * 2) / (16 + i)) - 5;
          b.holder.position.set(b.x, -(b.y + bob), 0);
          b.holder.scale.setScalar(Math.max(0.0001, b.r * arrive * (1 + 0.2 * b.h)));
          if (!still) b.globe.rotation.y += dt * (BODY3D[p.body].spin / 60) * Math.PI * 2;
          if (b.moon && !still) b.moon.rotation.y += dt * 0.5;
        });
        s3.renderer.render(s3.scene, s3.camera);
        if (still) return (s3.running = false); // one still frame, redrawn when maps load or the band resizes
        requestAnimationFrame(spinFrame);
      }

      // the intro's night sky. A seeded random keeps it the same on every visit:
      // a band of glow from lower left to upper right with a warm core, dust
      // lanes down its middle, and stars that crowd along it
      const seeded = (seed) => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const TWINKLES = (() => {
        const r = seeded(11);
        return Array.from({ length: 36 }, () =>
          `<i style="left:${(r() * 100).toFixed(1)}%;top:${(r() * 100).toFixed(1)}%;--d:${(2.5 + r() * 4).toFixed(1)}s;--t:${(-r() * 6).toFixed(1)}s"></i>`
        ).join("");
      })();
      // the sky is kept quiet so the planets stand out in front of it
      const SKY_DIM = 0.5;
      function drawGalaxy() {
        const cv = $("#intro .sky");
        if (!cv || $("#intro").hidden) return;
        const W = cv.clientWidth, H = cv.clientHeight;
        if (!W || !H) return;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        const c = cv.getContext("2d");
        c.scale(dpr, dpr);
        const rnd = seeded(7);
        const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5; // about -1..1, bunched near 0

        // dusk ground: flat slate, warming to a steel-blue glow that rises from the
        // bottom edge (drawn on a squashed circle so it spreads wide and low)
        c.fillStyle = "#1e252e";
        c.fillRect(0, 0, W, H);
        const gr = W * 0.7;
        c.save();
        c.translate(W / 2, H * 1.02);
        c.scale(1, (H * 0.6) / gr);
        const dusk = c.createRadialGradient(0, 0, 0, 0, 0, gr);
        dusk.addColorStop(0, "rgba(74,95,138,0.6)");
        dusk.addColorStop(0.55, "rgba(74,95,138,0.3)");
        dusk.addColorStop(1, "rgba(74,95,138,0)");
        c.fillStyle = dusk;
        c.fillRect(-gr, -gr, gr * 2, gr * 2);
        c.restore();

        const ax = -0.1 * W, ay = 0.98 * H, bx = 1.1 * W, by = 0.02 * H;
        const len = Math.hypot(bx - ax, by - ay);
        const ux = (bx - ax) / len, uy = (by - ay) / len;
        const band = Math.max(W, H) * 0.15;
        const at = (t, off) => [ax + ux * len * t - uy * off, ay + uy * len * t + ux * off];
        const glow = (x, y, r, rgb, a) => {
          const g = c.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, `rgba(${rgb},${a})`);
          g.addColorStop(1, `rgba(${rgb},0)`);
          c.fillStyle = g;
          c.fillRect(x - r, y - r, r * 2, r * 2);
        };

        c.globalCompositeOperation = "lighter";
        const tints = ["120,90,255", "80,130,255", "255,120,200", "150,110,255"];
        for (let i = 0; i < 90; i++) {
          const [x, y] = at(rnd(), gauss() * band * 0.8);
          glow(x, y, band * (0.35 + rnd() * 0.6), tints[i % 4], (0.04 + rnd() * 0.05) * SKY_DIM);
        }
        for (let i = 0; i < 30; i++) {
          const [x, y] = at(0.56 + gauss() * 0.12, gauss() * band * 0.4);
          glow(x, y, band * (0.2 + rnd() * 0.4), "255,214,170", (0.04 + rnd() * 0.05) * SKY_DIM);
        }
        const stars = Math.round((W * H) / 930);
        for (let i = 0; i < stars; i++) {
          let x, y;
          if (rnd() < 0.55) [x, y] = at(rnd(), gauss() * band * 1.1);
          else (x = rnd() * W), (y = rnd() * H);
          const r = rnd() < 0.97 ? 0.3 + rnd() * 0.7 : 1 + rnd() * 0.8;
          c.fillStyle = `rgba(255,${(235 + rnd() * 20) | 0},${(215 + rnd() * 40) | 0},${((0.35 + rnd() * 0.65) * 0.65).toFixed(2)})`;
          c.beginPath();
          c.arc(x, y, r, 0, 7);
          c.fill();
          if (r > 1.4) glow(x, y, r * 6, "200,210,255", 0.14);
        }
        c.globalCompositeOperation = "source-over";
        for (let i = 0; i < 70; i++) {
          const [x, y] = at(0.12 + rnd() * 0.8, gauss() * band * 0.25);
          glow(x, y, band * (0.08 + rnd() * 0.18), "20,26,34", 0.3 + rnd() * 0.25);
        }
      }
      // redraw when the intro changes size (window resize, fonts arriving, typing)
      let skyTimer;
      new ResizeObserver(() => {
        clearTimeout(skyTimer);
        skyTimer = setTimeout(() => {
          layoutSolar();
          drawGalaxy();
        }, 120);
      }).observe($("#intro"));

      // Types the headline one key strike at a time, like an old manual typewriter
      // (the same as senthilcaesar.github.io's greeting): uneven rhythm, a pause
      // after words, and slightly misaligned letters. Once per visit.
      let headlineTyped = false;
      function typeHeadline() {
        const h = $("#intro h1");
        if (headlineTyped || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        headlineTyped = true;

        // wrap every character in a hidden span, so the line is laid out in full from the start
        const chars = [...h.textContent].map((ch) => {
          const span = document.createElement("span");
          span.className = "tw-char tw-hidden";
          span.setAttribute("aria-hidden", "true");
          span.textContent = ch;
          span.style.setProperty("--tw-r", `${(Math.random() - 0.5) * 3}deg`);
          span.style.setProperty("--tw-y", `${(Math.random() - 0.5) * 0.06}em`);
          span.style.setProperty("--tw-ink", (0.82 + Math.random() * 0.18).toFixed(2));
          return span;
        });
        h.setAttribute("aria-label", h.textContent);
        h.replaceChildren(...chars);

        const caret = document.createElement("span");
        caret.className = "tw-caret";
        caret.setAttribute("aria-hidden", "true");

        let i = 0;
        function typeNext() {
          if (!h.isConnected) return; // left the intro mid-line; it comes back fully typed
          if (i >= chars.length) {
            setTimeout(() => caret.remove(), 1200);
            return;
          }
          const span = chars[i++];
          span.classList.remove("tw-hidden");
          span.classList.add("tw-struck");
          span.after(caret);

          // a typist's rhythm: quick strikes, a beat after each word, the odd hesitation
          let delay = 110 + Math.random() * 110;
          if (span.textContent === " ") delay = 260 + Math.random() * 160;
          else if (Math.random() < 0.08) delay += 250;
          setTimeout(typeNext, delay);
        }

        chars[0].before(caret);
        setTimeout(typeNext, 600);
      }

      function render() {
        const road = state.mode === "roadmap";
        const intro = state.mode === "intro";
        document.documentElement.classList.toggle("on-intro", intro);
        requestAnimationFrame(placeOrbit);
        $("#mode-intro").setAttribute("aria-pressed", intro);
        $("#mode-roadmap").setAttribute("aria-pressed", road);
        $("#mode-library").setAttribute("aria-pressed", state.mode === "library");
        $(".shell").classList.toggle("solo", road || intro);
        $("#intro").hidden = !intro;
        $("#roadmap").hidden = !road;
        $("#shelves").hidden = road || intro;
        if (intro) {
          closeSheet();
          renderIntro();
        } else if (road) {
          renderRoadmap();
        } else {
          closeSheet();
          renderRail();
          renderShelves();
        }
      }

      function openSheet() {
        hidePeek();
        state.open = true;
        $("#panel").classList.add("open");
        $("#backdrop").classList.add("open");
        document.documentElement.classList.add("drawer-open");
        document.querySelectorAll(".stop").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.week === state.sel));
        const close = $("#panel [data-close]");
        if (close) close.focus({ preventScroll: true });
      }
      function closeSheet() {
        const wasOpen = $("#panel").classList.contains("open");
        state.open = false;
        $("#panel").classList.remove("open");
        $("#backdrop").classList.remove("open");
        document.documentElement.classList.remove("drawer-open");
        document.querySelectorAll(".stop").forEach((b) => b.setAttribute("aria-pressed", "false"));
        const stop = document.querySelector(`.stop[data-week="${state.sel}"]`);
        if (wasOpen && stop) stop.focus({ preventScroll: true });
      }

      // the nav's planet sits under the current view and glides to the next one.
      // Arriving from the other page, it starts under the view you came from.
      function placeOrbit() {
        const nav = document.querySelector(".orbit-nav");
        const cur = nav && nav.querySelector('[aria-pressed="true"], [aria-current="page"]');
        if (!cur) return;
        const mid = (el) => el.offsetLeft + el.offsetWidth / 2 + "px";
        if (!nav.classList.contains("glide")) {
          let from = cur;
          try {
            const last = sessionStorage.getItem("orbit-from");
            from = [...nav.children].find((el) => el.textContent.trim() === last) || cur;
          } catch (e) {}
          nav.style.setProperty("--orbit-x", mid(from));
          nav.getBoundingClientRect(); // settle the start before the glide
          nav.classList.add("glide");
        }
        nav.style.setProperty("--orbit-x", mid(cur));
        try {
          sessionStorage.setItem("orbit-from", cur.textContent.trim());
        } catch (e) {}
      }
      window.addEventListener("resize", placeOrbit);
      document.fonts.ready.then(placeOrbit);

      // closing a week by hand goes back to the roadmap entry it was opened from
      function dismissSheet() {
        if (history.state && history.state.sheet) return history.back();
        history.replaceState(null, "", "#roadmap");
        closeSheet();
      }

      // select a week: fill the drawer and, when asked, slide it in
      function selectWeek(n, opts = {}) {
        if (!weekByN(n)) return;
        state.sel = n;
        // the open week lives in the URL; stepping between weeks replaces the
        // entry, so Back closes the week instead of walking through each one
        if (opts.route !== false) {
          const h = "#week-" + n;
          if (state.open || /^#week-/.test(location.hash)) history.replaceState(history.state, "", h);
          else history.pushState({ sheet: true }, "", h);
        }
        renderRoadmap();
        $("#panel").scrollTop = 0;
        if (opts.scroll) {
          const stop = document.querySelector(`.stop[data-week="${n}"]`);
          if (stop) stop.scrollIntoView({ block: "center", behavior: opts.instant ? "auto" : "smooth" });
        }
        if (opts.open) openSheet();
        if (opts.focus) {
          const t = [...document.querySelectorAll("#panel .tick")].find((x) => x.dataset.key === opts.focus);
          if (t) {
            t.focus({ preventScroll: true });
            t.closest(".step").scrollIntoView({ block: "nearest" });
          }
        }
      }

      // the whole roadmap as a spreadsheet: one row per material, with this browser's progress
      function downloadCSV() {
        const cell = (v) => {
          const t = String(v ?? "");
          return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
        };
        const rows = [["Week", "Stage", "Week title", "Week goal", "Order", "Required", "Material", "Format", "Provider", "Link", "Must read", "Note", "Done", "Week complete"]];
        ROADMAP.forEach((w) => {
          const stage = STAGES.find((s) => s.id === w.stage).name;
          let order = 0;
          w.learn.forEach((s) => {
            const r = byUrl[s.url];
            if (!r) return;
            rows.push([
              w.n, stage, w.title, w.goal, s.opt ? "" : ++order, s.opt ? "Optional" : "Core",
              r.title, FORMATS[r.f].label, r.by, r.url, s.key ? "Yes" : "", s.note || "",
              done.has(r.url) ? "Yes" : "No", weekComplete(w) ? "Yes" : "No",
            ]);
          });
        });
        // the BOM lets Excel read the dashes and curly quotes as UTF-8
        const csv = "\ufeff" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
        a.download = "ai-learning-roadmap.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      // hover preview: what a week covers, shown beside its stop on the path
      const peekEl = $("#peek");
      let peekTimer;
      function peekHTML(w) {
        const si = STAGES.findIndex((s) => s.id === w.stage);
        const core = w.learn.filter((s) => !s.opt && byUrl[s.url]);
        const extras = w.learn.filter((s) => s.opt).length;
        const d = weekDone(w);
        const n = required(w).length;
        const status = weekComplete(w) ? "Completed" : d ? `${d} of ${n} done` : "Not started";
        return `<p class="peek-kicker">Week ${w.n} of ${ROADMAP.length}, ${esc(STAGES[si].name.toLowerCase())} stage</p>
          <h4>${esc(w.title)}</h4>
          <p class="peek-goal">${esc(w.goal)}</p>
          <p class="peek-sub">You'll learn from</p>
          <ol>${core
            .map((s) => {
              const r = byUrl[s.url];
              return `<li>${s.key ? "★ " : ""}${esc(r.title)} <small>${s.key ? "must read, " : ""}${FORMATS[r.f].label.toLowerCase()}, ${esc(r.by)}</small></li>`;
            })
            .join("")}</ol>
          ${extras ? `<p class="peek-extra">Plus ${extras} optional extra${extras === 1 ? "" : "s"}.</p>` : ""}
          <div class="peek-foot"><b>${status}</b><span>Click to open this week</span></div>`;
      }
      function showPeek(stop) {
        const w = weekByN(+stop.dataset.week);
        if (!w || state.open) return;
        peekEl.style.setProperty("--sw", `var(--c-${w.t})`);
        peekEl.innerHTML = peekHTML(w);
        peekEl.hidden = false;
        // sit in the clear space right of the path so neighbouring labels stay readable;
        // on narrower screens fall back to just beside this stop
        const node = stop.querySelector(".node").getBoundingClientRect();
        const label = stop.querySelector(".stop-label").getBoundingClientRect();
        const clear = Math.max(...[...document.querySelectorAll("#path .stop-label, #path .node")].map((el) => el.getBoundingClientRect().right));
        const pw = peekEl.offsetWidth;
        const ph = peekEl.offsetHeight;
        let x = clear + 28;
        if (x + pw > innerWidth - 16) x = Math.max(node.right, label.right) + 20;
        if (x + pw > innerWidth - 16) x = Math.min(node.left, label.left) - pw - 20;
        x = Math.max(16, Math.min(x, innerWidth - pw - 16));
        let y = node.top + node.height / 2 - ph / 2;
        y = Math.max(76, Math.min(y, innerHeight - ph - 16));
        peekEl.style.left = x + "px";
        peekEl.style.top = y + "px";
        stop.setAttribute("aria-describedby", "peek");
        requestAnimationFrame(() => peekEl.classList.add("show"));
      }
      function hidePeek() {
        clearTimeout(peekTimer);
        peekEl.classList.remove("show", "docked");
        peekEl.style.width = "";
        peekEl.hidden = true;
        document.querySelectorAll('[aria-describedby="peek"]').forEach((b) => b.removeAttribute("aria-describedby"));
      }

      // library peek: what a resource covers (`about`, plus `level`, `time` and `cost` where the publisher states them), how long it takes and where it sits in the roadmap
      const weekNote = {};
      ROADMAP.forEach((w) => w.learn.forEach((s) => s.note && (weekNote[s.url] = s.note)));
      function slipPeekHTML(r) {
        const w = weekOf[r.url] && weekByN(weekOf[r.url]);
        const all = topicRes(r.t);
        const next = (all.find((x) => !done.has(x.url)) || {}).url;
        const status = done.has(r.url) ? "✓ Done" : r.url === next ? "→ Up next" : "Not started";
        const tags = [r.level && `<span class="lvl">${esc(r.level)}</span>`, r.time && `<span>${esc(r.time)}</span>`, r.cost && `<span>${esc(r.cost)}</span>`]
          .filter(Boolean)
          .join("");
        return `<p class="peek-kicker">${FORMATS[r.f].label} · ${esc(r.by)}</p>
          <h4>${esc(r.title)}</h4>
          <p class="peek-goal">${esc(r.about)}</p>
          ${tags ? `<div class="peek-tags">${tags}</div>` : ""}
          ${w ? `<p class="peek-road"><b>Roadmap week ${w.n}:</b> ${esc(w.title)}${weekNote[r.url] ? `. ${esc(weekNote[r.url])}` : ""}</p>` : ""}
          <div class="peek-foot"><b>${status}</b><span>Click to open on ${host(r.url)}</span></div>`;
      }
      function showSlipPeek(li) {
        const r = byUrl[li.dataset.url];
        if (!r || !r.about) return;
        peekEl.style.setProperty("--sw", `var(--c-${r.t})`);
        peekEl.innerHTML = slipPeekHTML(r);
        peekEl.hidden = false;
        // docked in one fixed spot: just under the navigation and theme buttons, spanning their width
        const from = $(".bar-meta .orbit-nav").getBoundingClientRect();
        const to = $("#theme-btn").getBoundingClientRect();
        const pw = Math.min(Math.max(260, to.right - from.left), innerWidth - 32);
        peekEl.classList.add("docked");
        peekEl.style.width = pw + "px";
        peekEl.style.left = Math.max(16, to.right - pw) + "px";
        peekEl.style.top = $(".bar").getBoundingClientRect().bottom + 10 + "px";
        li.querySelector(".slip").setAttribute("aria-describedby", "peek");
        requestAnimationFrame(() => peekEl.classList.add("show"));
      }

      function toast(msg, t, ms = 3200) {
        const el = $("#toast");
        el.textContent = msg;
        el.style.setProperty("--sw", `var(--c-${t})`);
        el.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove("show"), ms);
      }

      // confetti and balloons from the tick; a bigger burst with champagne when a topic or week is finished
      const FX_COLORS = [...TOPICS.map((t) => `var(--c-${t.id})`), "var(--accent)"];
      // the week you just finished flares like a small star, then settles as done
      function lightUp(n) {
        const stop = document.querySelector(`.stop[data-week="${n}"]`);
        if (!stop) return;
        stop.classList.add("lit");
        setTimeout(() => stop.classList.remove("lit"), 1700);
      }

      function celebrate(rect, big) {
        if (!rect || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const layer = document.createElement("div");
        layer.className = "fx";
        layer.setAttribute("aria-hidden", "true");
        document.body.append(layer);
        const anims = [];
        for (let i = 0; i < (big ? 70 : 34); i++) {
          const c = document.createElement("i");
          c.style.cssText = `left:${x}px;top:${y}px;background:${FX_COLORS[i % FX_COLORS.length]}${i % 3 ? "" : ";border-radius:50%"}`;
          layer.append(c);
          const a = Math.random() * Math.PI * 2;
          const v = (big ? 160 : 90) + Math.random() * (big ? 220 : 130);
          const dx = Math.cos(a) * v;
          const dy = Math.sin(a) * v - 80;
          anims.push(
            c.animate(
              [
                { transform: "translate(-50%, -50%) rotate(0deg)", opacity: 1 },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: 0.6 },
                { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 160}px)) rotate(${Math.random() * 720}deg)`, opacity: 0 },
              ],
              { duration: 1200 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" }
            )
          );
        }
        const floats = big ? ["🎈", "🍾", "🎈", "🥂", "🎈", "🎉"] : ["🎈", "🎉", "🎈"];
        floats.forEach((e, i) => {
          const b = document.createElement("span");
          b.textContent = e;
          b.style.cssText = `left:${x + (i - (floats.length - 1) / 2) * 38}px;top:${y}px`;
          layer.append(b);
          anims.push(
            b.animate(
              [
                { transform: "translate(-50%, 0) scale(.4)", opacity: 0 },
                { transform: "translate(-50%, -30px) scale(1)", opacity: 1, offset: 0.15 },
                { transform: `translate(calc(-50% + ${(Math.random() - 0.5) * 70}px), -${big ? 420 : 260}px) scale(1)`, opacity: 0 },
              ],
              { duration: 2200 + i * 150, delay: i * 80, easing: "ease-out", fill: "forwards" }
            )
          );
        });
        Promise.all(anims.map((a) => a.finished)).then(() => layer.remove());
      }

      // every view has its own URL, so Back and Forward move between them:
      // no hash = intro, #roadmap, #week-5 (that week open), #library, #mcp (a topic)
      function routeHash() {
        if (state.mode === "intro") return "";
        if (state.mode === "roadmap") return state.open ? "week-" + state.sel : "roadmap";
        return state.topic === "all" ? "library" : state.topic;
      }
      function pushRoute(replace) {
        const h = routeHash();
        if (location.hash.slice(1) === h) return;
        const url = h ? "#" + h : location.pathname + location.search;
        if (replace) history.replaceState(null, "", url);
        else history.pushState(null, "", url);
      }
      function applyRoute(instant) {
        let hash = location.hash.slice(1);
        if (hash === "continue") {
          hash = "week-" + (currentWeek() || ROADMAP[0]).n;
          history.replaceState(null, "", "#" + hash);
        }
        const wk = /^week-(\d+)$/.exec(hash);
        if (wk && weekByN(+wk[1])) {
          state.mode = "roadmap";
          render();
          return selectWeek(+wk[1], { scroll: true, instant, open: true, route: false });
        }
        if (hash === "roadmap") state.mode = "roadmap";
        else if (hash === "library") (state.mode = "library"), (state.topic = "all");
        else if (topicOf(hash)) (state.mode = "library"), (state.topic = hash);
        else state.mode = "intro";
        if (state.open) closeSheet();
        render();
        window.scrollTo(0, 0);
      }

      function setMode(m) {
        state.mode = m;
        render();
        pushRoute();
        window.scrollTo(0, 0);
      }
      $("#mode-intro").addEventListener("click", () => setMode("intro"));
      $("#mode-roadmap").addEventListener("click", () => setMode("roadmap"));
      $("#mode-library").addEventListener("click", () => setMode("library"));
      $("#intro").addEventListener("click", (e) => {
        const b = e.target.closest("[data-mode]");
        if (b) setMode(b.dataset.mode);
      });
      // the brand takes you back to the intro
      $(".brand").addEventListener("click", (e) => {
        e.preventDefault();
        setMode("intro");
      });

      function reset() {
        state.topic = "all";
        state.format = "all";
        state.status = "all";
        state.q = "";
        $("#q").value = "";
        render();
        pushRoute(true);
      }

      // resets ask for a second click before wiping anything, like the roadmap's
      function armed(btn) {
        if (btn.dataset.armed) return true;
        const was = btn.textContent;
        btn.dataset.armed = "1";
        btn.textContent = "Click again to reset";
        setTimeout(() => {
          if (btn.isConnected) {
            delete btn.dataset.armed;
            btn.textContent = was;
          }
        }, 4000);
        return false;
      }
      $(".rail-foot").addEventListener("click", (e) => {
        const b = e.target.closest("[data-reset-all]");
        if (!b || !armed(b)) return;
        done.clear();
        saveProgress();
        state.status = "all";
        render();
        toast("Progress cleared. Start again from scratch.", TOPICS[0].id);
      });

      $("#rail-nav").addEventListener("click", (e) => {
        const b = e.target.closest("[data-topic]");
        if (!b) return;
        state.topic = b.dataset.topic;
        render();
        pushRoute();
        $("#main").scrollIntoView({ block: "start", behavior: "smooth" });
      });
      $("#fmt-row").addEventListener("click", (e) => {
        const b = e.target.closest("[data-format]");
        if (!b) return;
        state.format = b.dataset.format;
        render();
      });
      $("#status-row").addEventListener("click", (e) => {
        const b = e.target.closest("[data-status]");
        if (!b) return;
        state.status = b.dataset.status;
        render();
      });
      $("#shelves").addEventListener("click", (e) => {
        if (e.target.id === "reset") reset();
        const rt = e.target.closest("[data-reset-topic]");
        if (rt && armed(rt)) {
          const t = topicOf(rt.dataset.resetTopic);
          topicRes(t.id).forEach((r) => done.delete(r.url));
          saveProgress();
          render();
          toast(`${t.name} progress cleared. Start the module again from the top.`, t.id);
        }
        const go = e.target.closest("[data-goto]");
        if (go) {
          state.topic = go.dataset.goto;
          render();
          pushRoute();
          $("#main").scrollIntoView({ block: "start", behavior: "smooth" });
        }
      });
      // ticks here and on the roadmap share one record, so a course done in one shows in both
      $("#shelves").addEventListener("change", (e) => {
        const k = e.target.dataset.key;
        if (!k) return;
        if (e.target.checked) done.add(k);
        else done.delete(k);
        saveProgress();
        const rect = e.target.closest(".mark").getBoundingClientRect();
        renderRail();
        renderShelves();
        const again = [...document.querySelectorAll("#shelves .tick")].find((x) => x.dataset.key === k);
        if (again) again.focus({ preventScroll: true });
        if (!e.target.checked) return;
        const t = topicOf(byUrl[k].t);
        const all = topicRes(t.id);
        const d = doneIn(all);
        const nxt = TOPICS[TOPICS.indexOf(t) + 1];
        const finished = d === all.length;
        celebrate(rect, finished);
        toast(
          finished
            ? `🍾 ${doneMsg(t)}`
            : `🎉 Congratulations! You completed ${byUrl[k].title} · ${d} of ${all.length} done in ${t.name}`,
          t.id,
          finished ? 7000 : 3200
        );
      });
      $("#roadmap").addEventListener("click", (e) => {
        if (e.target.id === "reset") return reset();
        const wk = e.target.closest("[data-week]");
        if (wk) return selectWeek(+wk.dataset.week, { open: true, focus: wk.dataset.focus });
        const go = e.target.closest("[data-go]");
        if (go) return selectWeek(+go.dataset.go, { open: true });
        const resume = e.target.closest("[data-resume]");
        if (resume) return selectWeek(+resume.dataset.resume, { open: true, scroll: true });
        if (e.target.closest("[data-close]")) return dismissSheet();
        const fin = e.target.closest("[data-complete]");
        if (fin) {
          const w = weekByN(+fin.dataset.complete);
          celebrate(fin.getBoundingClientRect(), true);
          done.add("week:" + w.id);
          required(w).forEach((k) => done.add(k));
          saveProgress();
          renderRoadmap();
          lightUp(w.n);
          const nxt = weekByN(w.n + 1);
          const left = ROADMAP.filter((x) => !weekComplete(x)).length;
          toast(
            left
              ? `Week ${w.n} done, ${left} to go. Next up: ${nxt ? nxt.title : currentWeek().title}`
              : "Roadmap complete! Time to teach it.",
            w.t
          );
          const go = $("#panel [data-go='" + (w.n + 1) + "'].next-btn");
          if (go) go.focus({ preventScroll: true });
          return;
        }
        const undo = e.target.closest("[data-undo]");
        if (undo) {
          done.delete("week:" + weekByN(+undo.dataset.undo).id);
          saveProgress();
          renderRoadmap();
          const btn = $("#panel [data-complete]");
          if (btn) btn.focus({ preventScroll: true });
          return;
        }
        if (e.target.closest("[data-csv]")) return downloadCSV();
        // reset asks for a second click before wiping everything
        const rs = e.target.closest("[data-reset]");
        if (rs) {
          const label = rs.querySelector("span") || rs;
          if (rs.dataset.armed) {
            done.clear();
            saveProgress();
            closeSheet();
            state.sel = 1;
            renderRoadmap();
            window.scrollTo({ top: 0, behavior: "smooth" });
            toast("Progress cleared. Start again from week 1.", ROADMAP[0].t);
          } else {
            const was = label.textContent;
            rs.dataset.armed = "1";
            label.textContent = "Click again to reset";
            setTimeout(() => {
              if (rs.isConnected) {
                delete rs.dataset.armed;
                label.textContent = was;
              }
            }, 4000);
          }
        }
      });
      $("#roadmap").addEventListener("change", (e) => {
        const k = e.target.dataset.key;
        if (!k) return;
        if (e.target.checked) done.add(k);
        else done.delete(k);
        saveProgress();
        const rect = e.target.closest(".mark").getBoundingClientRect();
        renderRoadmap();
        const again = [...document.querySelectorAll("#panel .tick")].find((t) => t.dataset.key === k);
        if (again) again.focus({ preventScroll: true });
        if (!e.target.checked) return;
        celebrate(rect);
        toast(`🎉 Congratulations! You completed ${byUrl[k].title}`, byUrl[k].t);
      });
      $("#backdrop").addEventListener("click", dismissSheet);
      if (matchMedia("(hover: hover)").matches) {
        $("#rm-main").addEventListener("mouseover", (e) => {
          const stop = e.target.closest(".stop");
          if (!stop || stop.contains(e.relatedTarget)) return;
          clearTimeout(peekTimer);
          peekTimer = setTimeout(() => showPeek(stop), 120);
        });
        $("#rm-main").addEventListener("mouseout", (e) => {
          const stop = e.target.closest(".stop");
          if (stop && !stop.contains(e.relatedTarget)) hidePeek();
        });
      }
      if (matchMedia("(hover: hover)").matches) {
        $("#shelves").addEventListener("mouseover", (e) => {
          const li = e.target.closest(".slips > li");
          if (!li || li.contains(e.relatedTarget)) return;
          clearTimeout(peekTimer);
          peekTimer = setTimeout(() => showSlipPeek(li), 250);
        });
        $("#shelves").addEventListener("mouseout", (e) => {
          const li = e.target.closest(".slips > li");
          if (li && !li.contains(e.relatedTarget)) hidePeek();
        });
      }
      $("#shelves").addEventListener("focusin", (e) => {
        const a = e.target.closest(".slip");
        if (a && a.matches(":focus-visible")) showSlipPeek(a.parentElement);
      });
      $("#shelves").addEventListener("focusout", hidePeek);
      $("#rm-main").addEventListener("focusin", (e) => {
        const stop = e.target.closest(".stop");
        if (stop && stop.matches(":focus-visible")) showPeek(stop);
      });
      $("#rm-main").addEventListener("focusout", hidePeek);
      addEventListener("scroll", hidePeek, { passive: true });
      new ResizeObserver(() => drawPath()).observe($("#main"));
      if (document.fonts) document.fonts.ready.then(drawPath);
      $("#q").addEventListener("input", (e) => {
        state.q = e.target.value.trim();
        if (state.q && state.mode === "intro") state.mode = "library";
        render();
        pushRoute();
      });
      $("#q-clear").addEventListener("click", (e) => {
        e.preventDefault();
        state.q = "";
        $("#q").value = "";
        render();
        $("#q").focus();
      });

      function setView(v) {
        state.view = v;
        renderShelves();
      }
      $("#view-list").addEventListener("click", () => setView("list"));
      $("#view-grid").addEventListener("click", () => setView("grid"));

      // theme: opens in dark unless the visitor chose light before (set in
      // the head, before first paint); each click flips between light and dark
      const root = document.documentElement;
      const themeBtn = $("#theme-btn");
      let theme = root.getAttribute("data-theme") === "light" ? "light" : "dark";

      const THEME_ICON = {
        // shown in light mode: the Moon, to switch to dark
        light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>',
        // shown in dark mode: the Sun, to switch to light
        dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
      };
      function applyTheme() {
        root.setAttribute("data-theme", theme);
        themeBtn.innerHTML = THEME_ICON[theme];
        const label = "Switch to " + (theme === "dark" ? "light" : "dark") + " theme";
        themeBtn.setAttribute("aria-label", label);
        themeBtn.title = label;
      }
      applyTheme();
      themeBtn.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        applyTheme();
        themeBtn.classList.remove("swap");
        void themeBtn.offsetWidth; // restart the spin on every click
        themeBtn.classList.add("swap");
        try {
          localStorage.setItem("shelf-theme", theme);
        } catch (e) {}
      });

      document.addEventListener("keydown", (e) => {
        const typing = e.target.matches("input[type=search]");
        if (e.key === "/" && !typing) {
          e.preventDefault();
          $("#q").focus();
        } else if (e.key === "Escape") {
          if ($("#panel").classList.contains("open")) return dismissSheet();
          if (typing) $("#q").blur();
          reset();
        } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && state.open && !e.metaKey && !e.altKey) {
          e.preventDefault();
          selectWeek(state.sel + (e.key === "ArrowRight" ? 1 : -1), { open: true });
        } else if (e.key === "v" && !typing && !e.metaKey && !e.ctrlKey && state.mode === "library") {
          setView(state.view === "list" ? "grid" : "list");
        }
      });

      // deep links: index.html#week-5 opens the roadmap at that week,
      // index.html#mcp opens the library on that topic; no hash opens the intro
      state.sel = (currentWeek() || ROADMAP[ROADMAP.length - 1]).n;
      applyRoute(true);
      // the guide page's search sends index.html?q=term: show those results in the library
      const q0 = new URLSearchParams(location.search).get("q");
      if (q0 && q0.trim()) {
        state.q = q0.trim();
        $("#q").value = state.q;
        state.mode = "library";
        history.replaceState(null, "", location.pathname + "#" + routeHash());
        render();
      }
      // Back, Forward and hand-edited hashes all land here
      window.addEventListener("popstate", () => applyRoute(false));
    </script>
  </body>
</html>
