<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Learning Shelf</title>
    <script>
      // apply the theme before first paint so the page doesn't flash:
      // dark unless the visitor chose light before
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("shelf-theme");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", savedTheme === "light" ? "light" : "dark");
    </script>
    <meta
      name="description"
      content="An 18-week roadmap from beginner to advanced, plus a curated shelf of free courses, talks, tutorials and articles on agents, MCP, skills, RAG, evals and more."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316181d'/%3E%3Crect x='6' y='7' width='5' height='18' fill='%23c9b8ff'/%3E%3Crect x='13' y='10' width='5' height='15' fill='%23d4f25c'/%3E%3Crect x='20' y='5' width='6' height='20' fill='%238fd3ff' transform='rotate(8 23 15)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Special+Elite&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Layout: a library shelf. Sticky search bar on top, a category rail
         on the left (chip scroller on phones), and a main pane where each
         category is a shelf of tactile, hard-edged resource slips. */
      :root {
        --bg: #eef1ec;
        --surface: #ffffff;
        --sunk: #e2e7df;
        --ink: #16181d;
        --ink-soft: #4a4f57;
        --dim: #6f746c;
        --line: #16181d;
        --hair: #c7cdc3;
        --accent: #3b2bd9;
        --on-accent: #ffffff;
        --chip-ink: #16181d;
        --shadow: #16181d;

        /* category swatches: each topic wears its planet's colour, as a pastel
           fill that always carries dark text */
        --c-foundations: #ffc65c;   /* the Sun */
        --c-claude-code: #cdc8c1;   /* Mercury */
        --c-context: #f6e6b0;       /* Venus */
        --c-evals: #8cc4ee;         /* Earth */
        --c-skills: #f4a383;        /* Mars */
        --c-agents: #e8b48a;        /* Jupiter */
        --c-harness: #e9cd7e;       /* Saturn */
        --c-graphrag: #a6e3e8;      /* Uranus */
        --c-mcp: #9eaaff;           /* Neptune */
        --c-observability: #dfc5b2; /* Pluto */
        --c-docs: #d6d6de;          /* the Moon */

        --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
        --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        --rail: 248px;
        --bar: 64px;
        color-scheme: light;
      }
      /* dark theme (chosen with the toggle): a Milky Way night sky */
      :root[data-theme="dark"] {
        /* dusk slate: a cool charcoal ground that warms to steel blue near the
           bottom, starlight text, a lilac accent; the topic pastels below are
           kept from the earlier dark palette */
        --bg: #1e252e;
        --surface: #262e3a;
        --sunk: #19202a;
        --ink: #d6d8f2;
        --ink-soft: #bcbfe3;
        --dim: #8f93bd;
        --line: #7f86c6;
        --hair: #333c4a;
        --accent: #b6a3ff;
        --on-accent: #1e252e;
        --shadow: #3a4558;
        --chip-ink: #141729;
        --c-foundations: #f2bd5e;   /* the Sun */
        --c-claude-code: #bab6b0;   /* Mercury */
        --c-context: #e6d49c;       /* Venus */
        --c-evals: #7fb4e0;         /* Earth */
        --c-skills: #e2917a;        /* Mars */
        --c-agents: #d9a57e;        /* Jupiter */
        --c-harness: #d8bc6e;       /* Saturn */
        --c-graphrag: #8fd0d6;      /* Uranus */
        --c-mcp: #8d9af0;           /* Neptune */
        --c-observability: #cbb19d; /* Pluto */
        --c-docs: #c3c3cd;          /* the Moon */
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.55 var(--body);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* dark mode's dusk: a flat slate sky that brightens into a broad steel-blue
         glow rising from the bottom edge, its lower corners falling back into
         shadow, with two sprinkles of small stars, fixed behind every page. Kept
         soft so text over it stays crisp, and cards, panels and the header sit
         on solid surfaces above it. */
      :root[data-theme="dark"] body::before,
      :root[data-theme="dark"] body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      :root[data-theme="dark"] body::before {
        background:
          radial-gradient(ellipse 70% 55% at 50% 100%, rgba(74, 95, 138, 0.55), rgba(74, 95, 138, 0) 72%),
          radial-gradient(ellipse 40% 40% at 22% 88%, rgba(74, 95, 138, 0.22), rgba(74, 95, 138, 0) 70%),
          radial-gradient(ellipse 40% 40% at 78% 88%, rgba(74, 95, 138, 0.22), rgba(74, 95, 138, 0) 70%),
          linear-gradient(to bottom, rgba(30, 37, 46, 0) 45%, rgba(40, 52, 70, 0.35));
      }
      :root[data-theme="dark"] body::after {
        background:
          radial-gradient(1.3px 1.3px at 22px 34px, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0)),
          radial-gradient(1px 1px at 141px 82px, rgba(220, 226, 255, 0.6), rgba(220, 226, 255, 0)),
          radial-gradient(1px 1px at 93px 196px, rgba(255, 240, 222, 0.55), rgba(255, 240, 222, 0)),
          radial-gradient(1.5px 1.5px at 214px 151px, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0)),
          radial-gradient(1px 1px at 262px 41px, rgba(212, 222, 255, 0.5), rgba(212, 222, 255, 0)),
          radial-gradient(1px 1px at 47px 262px, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0)),
          radial-gradient(1px 1px at 183px 251px, rgba(232, 226, 255, 0.5), rgba(232, 226, 255, 0)),
          radial-gradient(1px 1px at 308px 214px, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0)),
          radial-gradient(1.2px 1.2px at 351px 97px, rgba(255, 246, 230, 0.55), rgba(255, 246, 230, 0)),
          radial-gradient(1px 1px at 392px 312px, rgba(220, 230, 255, 0.45), rgba(220, 230, 255, 0));
        background-size: 420px 340px;
        opacity: 0.5;
      }
      a {
        color: inherit;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--on-accent);
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- top bar ---------- */
      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) auto;
        align-items: center;
        min-height: var(--bar);
        background: var(--bg);
        border-bottom: 1px solid var(--hair);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-inline: 20px;
        height: 100%;
        border-right: 1px solid var(--hair);
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      /* the logo: a small Sun with one planet circling it */
      .brand-sun {
        position: relative;
        flex: none;
        width: 26px;
        height: 26px;
      }
      .brand-sun::before {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 38%, #fff6cf, #ffc94a 55%, #f08a24);
        box-shadow: 0 0 8px 1px rgba(255, 180, 60, 0.55);
      }
      .brand-sun i {
        position: absolute;
        inset: 0;
        border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent);
        border-radius: 50%;
        animation: brand-orbit 9s linear infinite;
      }
      .brand-sun i::after {
        content: "";
        position: absolute;
        top: -3px;
        left: calc(50% - 3px);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--orbit-dot);
        box-shadow: 0 0 6px var(--orbit-dot);
      }
      @keyframes brand-orbit {
        to {
          rotate: 360deg;
        }
      }

      /* the views: plain names over a thin orbit line, with a small planet on the
         line under the current view that glides to the one you pick next
         (placeOrbit), and a faint ring where it would land under the pointer.
         Every name keeps the same weight, so switching never shifts the row. */
      .bar {
        --orbit-dot: var(--accent);
      }
      .orbit-nav {
        --orbit-x: -40px;
        position: relative;
        display: flex;
        gap: 4px;
        padding-bottom: 12px;
      }
      .orbit-nav::before {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 5px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          color-mix(in srgb, var(--ink) 32%, transparent) 12%,
          color-mix(in srgb, var(--ink) 32%, transparent) 88%,
          transparent
        );
      }
      .orbit-nav::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: calc(var(--orbit-x) - 5px);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff, var(--orbit-dot) 60%);
        box-shadow: 0 0 10px 2px color-mix(in srgb, var(--orbit-dot) 55%, transparent);
      }
      .orbit-nav.glide::after {
        transition: left 0.65s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .orbit-nav > :is(button, a) {
        position: relative;
        border: 0;
        background: none;
        padding: 6px 12px;
        font-family: var(--display);
        font-size: 0.98rem;
        font-weight: 650;
        line-height: normal;
        letter-spacing: -0.005em;
        color: var(--dim);
        text-decoration: none;
        transition: color 0.2s;
      }
      .orbit-nav > :is([aria-pressed="true"], [aria-current="page"]) {
        color: var(--ink);
      }
      .orbit-nav > :is(button, a)::after {
        content: "";
        position: absolute;
        left: calc(50% - 5px);
        bottom: -12px;
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        border: 1.5px solid var(--orbit-dot);
        border-radius: 50%;
        opacity: 0;
        scale: 0.4;
        transition: opacity 0.2s, scale 0.2s;
      }
      @media (hover: hover) {
        .orbit-nav > :is(button, a):hover {
          color: var(--ink);
        }
        .orbit-nav > :not([aria-pressed="true"], [aria-current="page"]):hover::after {
          opacity: 0.8;
          scale: 1;
        }
      }

      /* the theme switch: a round outlined button, like the search field, with a
         Moon in light mode (to go dark) and a Sun in dark mode (to go light);
         the icon tilts on hover and spins as it swaps */
      .theme-btn {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent);
        border-radius: 50%;
        background: color-mix(in srgb, var(--surface) 60%, transparent);
        color: var(--ink);
        transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      }
      .theme-btn svg {
        transition: rotate 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      @media (hover: hover) {
        .theme-btn:hover {
          border-color: var(--orbit-dot);
          box-shadow: 0 0 14px color-mix(in srgb, var(--orbit-dot) 30%, transparent);
        }
        .theme-btn:hover svg {
          rotate: -18deg;
        }
      }
      .theme-btn.swap svg {
        animation: theme-swap 0.45s cubic-bezier(0.3, 1.4, 0.5, 1);
      }
      @keyframes theme-swap {
        from {
          rotate: -120deg;
          scale: 0.4;
          opacity: 0;
        }
      }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        height: 42px;
        /* a soft orbit-style field: a thin outline that lights up in the
           planet's colour when you type, instead of the hard box and shadow */
        border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface) 60%, transparent);
        transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        min-width: 0;
        /* small so the view buttons lead; centred between the logo and the buttons */
        justify-self: center;
        width: min(420px, calc(100% - 40px));
      }
      .search:hover {
        border-color: color-mix(in srgb, var(--ink) 40%, transparent);
      }
      .search:focus-within {
        border-color: var(--orbit-dot);
        background: var(--surface);
        box-shadow:
          0 0 0 3px color-mix(in srgb, var(--orbit-dot) 22%, transparent),
          0 0 18px color-mix(in srgb, var(--orbit-dot) 22%, transparent);
      }
      .search kbd {
        border-radius: 6px;
      }
      .search svg {
        flex: none;
        color: var(--dim);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        height: 100%;
      }
      .search input::placeholder {
        color: var(--dim);
      }
      kbd {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 1px 6px;
        border: 1.5px solid var(--hair);
        background: var(--sunk);
        color: var(--ink-soft);
      }
      /* hide the browser's own × so only our clear button shows */
      .search input::-webkit-search-cancel-button,
      .search input::-webkit-search-decoration {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
      .search-clear {
        flex: none;
        border: 1.5px solid var(--hair);
        background: var(--sunk);
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
        padding: 2px 8px;
        box-shadow: 0 0 0 var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease,
          background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .search-clear:hover,
      .search-clear:focus-visible {
        background: var(--c-evals);
        border-color: var(--line);
        color: var(--chip-ink);
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .search-clear:active {
        transform: translate(0, 0);
        box-shadow: 0 0 0 var(--shadow);
      }
      .bar-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-inline: 0 20px;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .bar-meta b {
        color: var(--ink);
      }
      /* give the search box room once the bar gets tight: drop the brand's
         name until phones move search to its own row */
      /* once there's room, sit on the header's midline rather than the middle of its column */
      @media (min-width: 1440px) {
        .bar > .brand {
          grid-column: 1;
          grid-row: 1;
        }
        .bar > .search {
          grid-column: 1 / -1;
          grid-row: 1;
        }
        .bar > .bar-meta {
          grid-column: 3;
          grid-row: 1;
        }
      }
      @media (min-width: 861px) and (max-width: 1100px) {
        .bar {
          grid-template-columns: auto minmax(0, 1fr) auto;
        }
        .brand {
          border-right: 0;
        }
        .brand-text {
          display: none;
        }
      }

      /* ---------- shell ---------- */
      .shell {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        align-items: start;
      }

      /* ---------- category rail ---------- */
      .rail {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + var(--bar));
        max-height: calc(100vh - var(--bar));
        overflow-y: auto;
        border-right: 1px solid var(--hair);
        min-height: calc(100vh - var(--bar));
        padding-block: 20px;
      }
      .rail-label {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 0 20px 10px;
      }
      .rail-nav {
        display: flex;
        flex-direction: column;
      }
      .rail-item {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 9px 20px;
        border: 0;
        background: none;
        text-align: left;
        font-size: 0.95rem;
        /* progress through the topic, drawn as a bar along the bottom edge */
        background-image: linear-gradient(var(--pc), var(--pc));
        background-repeat: no-repeat;
        background-position: left bottom;
        background-size: var(--p, 0%) 3px;
      }
      .rail-item:hover {
        background-color: var(--sunk);
      }
      .rail-item .sw {
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--line);
        background: var(--sw, var(--surface));
      }
      /* the topic's planet, small and still */
      .rail-item .sw.mini {
        --s: 16px;
        --k: 1;
        --i: 0;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 0;
        background: none;
      }
      .rail-item .sw.mini .orb {
        animation: none;
        transition: scale 0.25s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .rail-item:hover .sw.mini .orb,
      .rail-item[aria-pressed="true"] .sw.mini .orb {
        scale: 1.15;
      }
      .mini-sun {
        --c: #ffb43a;
      }
      .mini-sun .orb {
        background: radial-gradient(circle at 40% 38%, #fff6cf, #ffc94a 55%, #f08a24);
        box-shadow: 0 0 7px 1px rgba(255, 180, 58, 0.7);
      }
      .mini-moon {
        --c: #c9c9d3;
        --paint:
          radial-gradient(circle at 62% 38%, rgba(60, 60, 70, 0.35) 0 10%, rgba(60, 60, 70, 0) 12%),
          radial-gradient(circle at 36% 64%, rgba(60, 60, 70, 0.3) 0 8%, rgba(60, 60, 70, 0) 10%),
          radial-gradient(circle at 40% 35%, #e4e4ea, #a3a3ae 60%, #55555f 100%);
      }
      /* a small barred spiral seen at a tilt */
      .mini-galaxy .orb {
        border-radius: 50%;
        background:
          radial-gradient(circle, #fffbe8 0 10%, rgba(255, 251, 232, 0) 22%),
          conic-gradient(from 20deg, #8d74ff, rgba(70, 50, 190, 0.35) 25%, #8d74ff 50%, rgba(70, 50, 190, 0.35) 75%, #8d74ff);
        -webkit-mask: radial-gradient(circle, #000 35%, transparent 70%);
        mask: radial-gradient(circle, #000 35%, transparent 70%);
        box-shadow: none;
        transform: rotate(-24deg) scaleY(0.6);
      }
      .rail-item .n {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rail-item[aria-pressed="true"] {
        background-color: var(--ink);
        color: var(--bg);
      }
      .rail-item[aria-pressed="true"] .n {
        color: var(--bg);
      }
      .rail-item[aria-pressed="true"] .sw {
        border-color: var(--bg);
      }
      .rail-foot {
        margin: 24px 20px 0;
        padding-top: 16px;
        border-top: 1.5px dashed var(--hair);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .fmt-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .fmt-btn {
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 3px 8px;
        font-family: var(--mono);
        font-size: 0.72rem;
      }
      .rail-progress {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .rail-progress .meter {
        width: 80px;
      }
      .fmt-btn[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      /* ---------- main ---------- */
      main {
        min-width: 0;
        padding: 36px 40px 24px;
      }


      /* ---------- shelves ---------- */
      .shelves {
        display: flex;
        flex-direction: column;
        gap: 44px;
      }
      .shelf-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-bottom: 16px;
      }
      .shelf-head h2 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .shelf-head h2 .tab {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid var(--line);
        background: var(--sw);
        transform: rotate(-6deg);
      }

      /* list view: slips stacked like index cards in a drawer */
      .slips {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .slip {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        gap: 18px;
        padding: 14px 18px 14px 60px;
        background: var(--surface);
        border: 2px solid var(--line);
        box-shadow: 4px 4px 0 var(--shadow);
        text-decoration: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .slip:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--sw);
      }
      .slip:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--shadow);
      }
      .fmt {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1.5px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .fmt svg {
        width: 11px;
        height: 11px;
      }
      .slip-body {
        min-width: 0;
      }
      .slip-title {
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.12rem;
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }
      .slip-meta {
        margin: 4px 0 0;
        font-size: 0.85rem;
        color: var(--ink-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
      }
      .slip-meta .host {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--dim);
        overflow-wrap: anywhere;
      }

      /* cards view */
      .grid-view .slips {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
      }
      .grid-view .slip {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        align-items: start;
        min-height: 170px;
        padding: 0;
        gap: 0;
      }
      .grid-view .fmt {
        grid-column: 1;
        margin: 16px 0 0 58px;
      }
      .grid-view .slip-body {
        align-self: end;
        padding: 18px 16px 16px;
        border-top: 2px dashed var(--hair);
        margin-top: 16px;
      }

      /* progress: a tick on every slip, sharing its record with the roadmap */
      .slips > li {
        position: relative;
      }
      .slips .mark {
        position: absolute;
        top: 50%;
        left: 14px;
        transform: translateY(-50%);
      }
      .grid-view .slips .mark {
        top: 12px;
        left: 12px;
        transform: none;
      }
      .slips .is-done .slip {
        background: var(--sunk);
        box-shadow: 4px 4px 0 var(--hair);
      }
      .slips .is-done .slip-title {
        color: var(--ink-soft);
      }
      .shelf-done {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-top: 18px;
        padding: 14px 18px;
        border: 2px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        box-shadow: 4px 4px 0 var(--shadow);
      }
      .shelf-done > span {
        font-size: 1.6rem;
        line-height: 1;
      }
      .shelf-done p {
        flex: 1 1 280px;
        margin: 0;
        font-weight: 700;
        line-height: 1.4;
      }
      .shelf-done button {
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        padding: 6px 12px;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 700;
      }
      .done-badge,
      .next-badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--ink);
      }
      .shelf-progress {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--ink-soft);
      }
      .meter {
        display: block;
        flex: none;
        width: 120px;
        height: 10px;
        border: 1.5px solid var(--line);
        background: var(--surface);
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--sw);
      }

      .empty {
        padding: 48px 24px;
        border: 2px dashed var(--hair);
        text-align: center;
        color: var(--ink-soft);
      }
      .empty strong {
        display: block;
        font-family: var(--display);
        font-size: 1.4rem;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .empty button {
        margin-top: 14px;
        border: 2px solid var(--line);
        background: var(--surface);
        padding: 6px 14px;
        box-shadow: 3px 3px 0 var(--shadow);
      }

      footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid var(--hair);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        font-size: 0.85rem;
        color: var(--dim);
      }
      footer .keys {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      /* on the home view the header, footer and page behind them take the dusk
         sky's slate, so the galaxy isn't framed by pale strips; layout is unchanged */
      :root.on-intro body {
        background: #1e252e;
      }
      :root.on-intro .bar,
      :root.on-intro footer {
        --bg: #1e252e;
        --surface: #262e3a;
        --sunk: #19202a;
        --ink: #ecebff;
        --ink-soft: #c3c1e6;
        --dim: #9896c2;
        --line: #8d91c9;
        --hair: #333c4a;
        --shadow: #d6cfff;
        --orbit-dot: #ffcf6a;
        color: var(--ink);
        color-scheme: dark;
      }

      /* ---------- roadmap ----------
         Overview first, details on demand: a winding path of week stops
         (done / current / upcoming) on the left, and the selected week's
         checklist in a sticky panel on the right (a bottom sheet on phones). */
      .shell.solo {
        grid-template-columns: minmax(0, 1fr);
      }

      /* ---------- intro: where first-time visitors land ----------
         One loud thing: five planets (library topics) that arrive on load and
         grow on hover, set against a dusk sky (slate, with a steel-blue glow
         rising from the bottom) and the Milky Way drawn on a canvas. Reduced motion is handled by the global rule. */
      .intro {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        /* bleed past main's padding so the sky has no hard edge */
        margin: -36px -40px 0;
        min-height: calc(100vh - var(--bar));
        background: #1e252e;
        /* hard shadows in starlight, since black ones vanish against the sky */
        --shadow: #d6cfff;
      }
      /* fade the sky's foot into the footer's slate, so there's no seam */
      .intro::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 160px;
        z-index: -1;
        background: linear-gradient(to bottom, rgba(30, 37, 46, 0), #1e252e);
        pointer-events: none;
      }
      .sky,
      .sky-twinkle {
        position: absolute;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .sky-twinkle i {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px 1px rgba(210, 220, 255, 0.8);
        opacity: 0.55;
        animation: twinkle var(--d) ease-in-out var(--t) infinite;
      }
      @keyframes twinkle {
        50% {
          opacity: 0.15;
          transform: scale(0.6);
        }
      }

      .intro-inner {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
        align-items: center;
        max-width: 1160px;
        margin: 0 auto;
        padding: 64px 32px 56px;
      }
      /* one line at every width: size the text to the room available and
         cap it on wide screens */
      .intro h1 {
        grid-column: 1 / -1;
        color: #f4f1ff; /* starlight on the night sky */
        margin: 0;
        white-space: nowrap;
        /* the typewriter style from senthilcaesar.github.io's greeting */
        font-family: "Special Elite", "Courier New", monospace;
        font-weight: 400;
        word-spacing: 0.2em; /* Special Elite has a narrow space */
        /* the line is about 17.4em wide, so divide the room by 18.4 */
        font-size: min(4.6rem, calc((min(100vw, 1160px) - 64px) / 18.4));
        line-height: 1.15;
      }

      /* Typewriter (as on senthilcaesar.github.io): characters keep their space
         while hidden, so nothing shifts. Each key strike lands with its own slight
         tilt, offset and ink density, set per character from JS, like type from a
         worn ribbon. */
      .tw-char {
        display: inline-block;
        white-space: pre;
      }
      .tw-char.tw-hidden {
        visibility: hidden;
      }
      .tw-char.tw-struck {
        transform: translateY(var(--tw-y, 0)) rotate(var(--tw-r, 0deg));
        opacity: var(--tw-ink, 1);
        animation: tw-strike 0.16s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      @keyframes tw-strike {
        0% {
          transform: translateY(-0.18em) scale(1.12);
          opacity: 0.2;
          text-shadow: 0 0 0.04em currentColor;
        }
        60% {
          transform: translateY(0.03em) scale(0.97);
          opacity: 1;
          text-shadow: 0 0 0.06em currentColor;
        }
      }
      /* the type guide: an underline that sits where the next letter will land */
      .tw-caret {
        display: inline-block;
        width: 0.6em;
        height: 1em;
        margin-right: -0.6em;
        border-bottom: 2px solid currentColor;
        vertical-align: text-bottom;
        animation: tw-blink 0.9s step-end infinite;
      }
      @keyframes tw-blink {
        50% {
          border-color: transparent;
        }
      }

      .intro-ways {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 32px;
        margin: 0 0 22px;
      }
      .intro-art {
        order: 1;
      }
      .intro-text {
        order: 2;
      }
      .way {
        display: grid;
        align-items: center;
        width: 100%;
        text-align: left;
        text-decoration: none;
        padding: 16px 20px;
        border: 2px solid var(--line);
        background: var(--surface);
        box-shadow: 4px 4px 0 var(--shadow);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .way:hover {
        transform: translate(-3px, -3px);
        box-shadow: 7px 7px 0 var(--shadow);
      }
      .way:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }
      .way-q {
        display: block;
        font-size: 0.88rem;
        color: var(--dim);
      }
      .way b {
        display: block;
        margin: 1px 0 3px;
        font-family: var(--display);
        font-size: 1.28rem;
        font-weight: 750;
        letter-spacing: -0.015em;
        line-height: 1.2;
      }
      .way-d {
        display: block;
        color: var(--ink-soft);
        font-size: 0.93rem;
        line-height: 1.45;
      }

      /* the solar system: the Sun is the LLM, and nine planets are the concepts
         that orbit it, the most important on the biggest planet. layoutSolar()
         places the Sun, the orbit rings and each planet (--px/--py is the orb's
         centre); a wide band across the intro, or a tall column on phones.
         Arrival uses opacity/scale on the link, drift uses translate and hover
         uses scale on the orb, so the three motions never fight over one property. */
      .solar {
        --k: 1;
        position: relative;
        height: 360px;
        /* full bleed: the band runs edge to edge of the window, past the column */
        margin-inline: calc((100% - 100vw) / 2);
      }
      /* only the rings are clipped, fading out at the band's top and bottom;
         the Sun and its glow spill softly past it */
      .orbits {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
      }
      /* the 3D planets' canvas sits over the rings and under the names and links;
         once it's drawing, the CSS planets underneath turn into plain hit areas */
      .planets3d {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .solar.gl .planets3d {
        opacity: 1;
      }
      .solar .planet {
        z-index: 2;
      }
      .solar.gl .orb {
        background: none;
        box-shadow: none;
      }
      .solar.gl .orb::before,
      .solar.gl .orb::after {
        display: none;
      }
      .orbit {
        position: absolute;
        border: 1px solid rgba(200, 205, 255, 0.14);
        border-radius: 50%;
        pointer-events: none;
      }
      .sun {
        position: absolute;
        border-radius: 50%;
        text-decoration: none;
        background: radial-gradient(circle, #fffbe8 0 38%, #ffd76a 58%, #ff9d2e 82%, #e2561c 100%);
        box-shadow: 0 0 60px 18px rgba(255, 170, 60, 0.45), 0 0 160px 60px rgba(255, 120, 40, 0.18);
        animation: arrive 0.9s ease-out backwards, corona 5s ease-in-out 1s infinite alternate;
      }
      .sun-name {
        position: absolute;
        translate: -50% -50%;
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: 0.02em;
        color: #5a2408;
      }
      .sun:hover .sun-name,
      .sun:focus-visible .sun-name {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .sun:focus-visible {
        outline: 3px solid #ecebff;
        outline-offset: 6px;
      }
      @keyframes corona {
        to {
          box-shadow: 0 0 80px 26px rgba(255, 180, 70, 0.55), 0 0 200px 80px rgba(255, 120, 40, 0.22);
        }
      }
      .planet {
        position: absolute;
        left: var(--px);
        top: var(--py);
        translate: -50% calc(var(--s) * var(--k) * -0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #ecebff;
        animation: arrive 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.25) backwards;
        animation-delay: calc(var(--i) * 110ms + 350ms);
      }
      /* planets above the line carry their name above them */
      .planet.up {
        flex-direction: column-reverse;
        translate: -50% calc(var(--s) * var(--k) * 0.5 - 100%);
      }
      .planet:focus-visible {
        outline: none;
      }
      .planet:focus-visible .orb {
        outline: 3px solid #ecebff;
        outline-offset: 6px;
      }
      .orb {
        position: relative;
        flex: none;
        width: calc(var(--s) * var(--k));
        height: calc(var(--s) * var(--k));
        border-radius: 50%;
        /* a soft highlight over the planet's own paint */
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.5) 0 3%, rgba(255, 255, 255, 0) 30%),
          var(--paint);
        /* a glow in the planet's colour, and the night side shaded over everything */
        box-shadow:
          0 0 calc(var(--s) * var(--k) * 0.28) calc(var(--s) * var(--k) * -0.04) var(--c),
          inset calc(var(--s) * var(--k) * -0.1) calc(var(--s) * var(--k) * -0.12) calc(var(--s) * var(--k) * 0.22) rgba(3, 4, 12, 0.6);
        animation: drift var(--f, 8s) ease-in-out calc(var(--i) * -0.9s) infinite alternate;
        transition: scale 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .orb::before,
      .orb::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }
      .planet:hover .orb,
      .planet:focus-visible .orb {
        scale: 1.2;
      }
      .pname {
        font-family: var(--display);
        font-weight: 750;
        font-size: 0.88rem;
        white-space: nowrap;
        letter-spacing: -0.01em;
        text-shadow: 0 1px 10px rgba(20, 25, 32, 0.95);
      }
      .planet:hover .pname {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      /* each planet painted as itself, in gradient layers under the shared highlight */
      .pl-mercury {
        --c: #b9b4ad;
        --paint:
          radial-gradient(circle at 60% 40%, rgba(40, 38, 36, 0.3) 0 9%, rgba(40, 38, 36, 0) 10%),
          radial-gradient(circle at 38% 66%, rgba(40, 38, 36, 0.25) 0 7%, rgba(40, 38, 36, 0) 8%),
          radial-gradient(circle at 40% 35%, #c9c4bd, #8e8a84 60%, #45423e 100%);
      }
      .pl-venus {
        --c: #f0d79a;
        --paint:
          linear-gradient(160deg, rgba(255, 250, 230, 0) 0 30%, rgba(255, 250, 230, 0.25) 30% 40%, rgba(255, 250, 230, 0) 40% 64%, rgba(255, 250, 230, 0.18) 64% 72%, rgba(255, 250, 230, 0) 72%),
          radial-gradient(circle at 40% 35%, #f6e3b4, #d9b36c 60%, #7d5a26 100%);
      }
      .pl-earth {
        --c: #4a90e2;
        --paint:
          radial-gradient(ellipse 46% 9% at 50% 30%, rgba(255, 255, 255, 0.75) 0 40%, rgba(255, 255, 255, 0) 70%),
          radial-gradient(ellipse 40% 7% at 58% 80%, rgba(255, 255, 255, 0.6) 0 40%, rgba(255, 255, 255, 0) 70%),
          radial-gradient(circle at 50% 4%, #f4f8ff 0 10%, rgba(244, 248, 255, 0) 12%),
          radial-gradient(ellipse 30% 22% at 36% 46%, #6f9a52 0 60%, rgba(111, 154, 82, 0) 64%),
          radial-gradient(ellipse 20% 28% at 66% 60%, #8f8a4f 0 55%, rgba(143, 138, 79, 0) 60%),
          radial-gradient(circle at 40% 35%, #3f86d6, #1d4f97 60%, #0b2350 100%);
      }
      .pl-mars {
        --c: #e0663a;
        --paint:
          radial-gradient(ellipse 30% 12% at 50% 6%, #f6efe8 0 50%, rgba(246, 239, 232, 0) 62%),
          radial-gradient(ellipse 28% 14% at 40% 48%, #8c3a22 0 55%, rgba(140, 58, 34, 0) 66%),
          radial-gradient(ellipse 18% 22% at 66% 60%, #7d3320 0 50%, rgba(125, 51, 32, 0) 62%),
          radial-gradient(circle at 40% 35%, #e0764a, #b4492a 60%, #5e1f10 100%);
      }
      .pl-jupiter {
        --c: #e0b88a;
        --paint:
          radial-gradient(ellipse 15% 9% at 64% 64%, #c45a3a 0 55%, #d88a62 66%, rgba(216, 138, 98, 0) 74%),
          linear-gradient(176deg, #d9c3a1 0 12%, #f0e4cf 12% 22%, #b98a62 22% 30%, #efe2c8 30% 40%, #c49a72 40% 48%, #e9d8bb 48% 58%, #a8744f 58% 66%, #eadcc2 66% 76%, #c6a27c 76% 86%, #dcc6a4 86% 100%);
      }
      .pl-saturn {
        --c: #e8c98a;
        --paint: linear-gradient(174deg, #e6cf9c 0 18%, #f2e2bb 18% 30%, #d6b67e 30% 40%, #efdcb0 40% 55%, #cfae76 55% 64%, #ead6a8 64% 80%, #d2b37d 80% 100%);
      }
      .pl-saturn .orb::after {
        left: -42%;
        right: -42%;
        top: 40%;
        height: 20%;
        border: calc(var(--s) * var(--k) * 0.045 + 1px) solid #d9c49a;
        border-radius: 50%;
        box-shadow: 0 0 0 calc(var(--s) * var(--k) * 0.03 + 1px) rgba(217, 196, 154, 0.35);
        rotate: -16deg;
        opacity: 0.9;
      }
      .pl-uranus {
        --c: #8fd8e0;
        --paint: radial-gradient(circle at 40% 35%, #c5f1f4, #7cc9d3 60%, #2f6f7d 100%);
      }
      /* Uranus is tipped on its side, so its faint ring stands upright */
      .pl-uranus .orb::after {
        top: -22%;
        bottom: -22%;
        left: 44%;
        width: 12%;
        border: 1.5px solid rgba(200, 240, 245, 0.55);
        border-radius: 50%;
        rotate: 12deg;
      }
      .pl-neptune {
        --c: #4f7bff;
        --paint:
          radial-gradient(ellipse 16% 9% at 60% 58%, rgba(10, 20, 70, 0.55) 0 60%, rgba(10, 20, 70, 0) 70%),
          linear-gradient(172deg, rgba(170, 200, 255, 0) 0 30%, rgba(170, 200, 255, 0.18) 30% 36%, rgba(170, 200, 255, 0) 36% 62%, rgba(170, 200, 255, 0.14) 62% 67%, rgba(170, 200, 255, 0) 67%),
          radial-gradient(circle at 40% 35%, #5b8cff, #2f52c9 60%, #13226b 100%);
      }
      .pl-neptune .orb::after {
        width: 24%;
        height: 24%;
        top: -12%;
        right: -30%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f4f2ff, #8b88a8 75%);
      }
      .pl-pluto {
        --c: #d9c2a5;
        --paint:
          radial-gradient(ellipse 26% 22% at 58% 60%, #f3e8d8 0 60%, rgba(243, 232, 216, 0) 70%),
          radial-gradient(circle at 40% 35%, #d8bd9c, #9c7d5c 60%, #4a3826 100%);
      }
      @keyframes arrive {
        from {
          opacity: 0;
          scale: 0.3;
        }
      }
      @keyframes drift {
        to {
          translate: 0 -10px;
        }
      }

      /* main's padding shrinks at 860px, so the bleed does too */
      @media (max-width: 860px) {
        .intro {
          margin: -24px -16px 0;
        }
      }
      @media (max-width: 960px) {
        .intro h1 {
          font-size: calc((100vw - 32px) / 19);
        }
        .intro-inner {
          grid-template-columns: minmax(0, 1fr);
          gap: 28px;
          padding: 36px 16px 48px;
        }
        .intro-ways {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
          max-width: 540px;
        }
      }
      .shell.solo .rail {
        display: none;
      }
      .rm {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }
      .rm-main {
        position: relative;
        min-width: 0;
      }
      /* on wide screens the stats float in the corner so the path can start at the top */
      @media (min-width: 1101px) {
        .rm-hero {
          position: absolute;
          top: 0;
          right: 0;
          z-index: 2;
        }
        .rm-main .path {
          margin-top: 0;
        }
        .rm-main .path > .checkpoint:first-of-type {
          margin-top: 0;
        }
      }
      /* intro on the left, progress stats pinned to the top-right corner */
      .rm-hero {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px 32px;
      }
      /* progress as a compact list: label on the left, value on the right */
      .stats {
        display: grid;
        width: 230px;
        margin-left: auto;
        border: 1.5px solid var(--line);
        background: var(--surface);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .stat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 12px;
        border-bottom: 1px solid var(--hair);
      }
      .stat b {
        font-family: var(--display);
        font-size: 0.95rem;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .csv-btn,
      .reset-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 7px 12px;
        border: 0;
        background: var(--surface);
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink);
        white-space: nowrap;
      }
      .csv-btn {
        border-bottom: 1px solid var(--hair);
      }
      /* the way back in: always points at the first unfinished week */
      .resume-btn {
        display: grid;
        gap: 2px;
        width: 100%;
        padding: 11px 12px;
        border: 0;
        border-bottom: 1px solid var(--hair);
        background: var(--accent);
        color: var(--on-accent);
        font-family: var(--body);
        text-align: left;
      }
      .resume-btn span {
        font-size: 0.74rem;
        opacity: 0.85;
      }
      .resume-btn b {
        font-family: var(--display);
        font-size: 0.92rem;
        line-height: 1.25;
      }
      .resume-btn:hover {
        filter: brightness(1.08);
      }
      .resume-btn:active {
        transform: translateY(1px);
      }
      .csv-btn svg,
      .reset-btn svg {
        width: 13px;
        height: 13px;
      }
      .csv-btn:hover,
      .reset-btn:hover:not(:disabled) {
        background: var(--sunk);
      }
      .reset-btn[data-armed],
      .reset-btn[data-armed]:hover {
        background: var(--c-evals);
        color: var(--chip-ink);
      }
      .reset-btn:disabled {
        color: var(--dim);
        cursor: default;
      }
      .link-btn {
        padding: 0;
        border: 0;
        background: none;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* the path */
      .path {
        --amp: 120px;
        position: relative;
        max-width: 880px;
        margin-top: 36px;
        padding-bottom: 24px;
      }
      .path-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .path-svg .base {
        fill: none;
        stroke: var(--hair);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 1 13;
      }
      .path-svg .fill {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
        stroke-linecap: round;
      }
      .search-note {
        margin: 24px 0 0;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
      }
      .checkpoint {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 2px;
        width: fit-content;
        max-width: 100%;
        margin: 26px auto 34px;
        padding: 10px 20px 12px;
        text-align: center;
        border: 2px solid var(--line);
        background: var(--bg);
        box-shadow: 3px 3px 0 var(--shadow);
      }
      .checkpoint .k {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .checkpoint b {
        font-family: var(--display);
        font-size: 1.15rem;
        line-height: 1.2;
      }
      .checkpoint.done {
        background: var(--ink);
        color: var(--bg);
      }
      .checkpoint.done .k {
        color: var(--bg);
      }
      .stop-row {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        height: 134px;
        align-items: center;
      }
      .stop {
        position: relative;
        display: block;
        width: 78px;
        height: 78px;
        padding: 0;
        border: 0;
        background: none;
        transform: translateX(calc(var(--amp) * var(--k)));
        transition: opacity 0.2s ease;
      }
      .stop.dim {
        opacity: 0.28;
      }
      .node {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: conic-gradient(var(--sw) calc(var(--p) * 1%), var(--hair) 0);
        box-shadow: 0 5px 0 var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .stop:hover .node {
        transform: translateY(-3px);
        box-shadow: 0 8px 0 var(--shadow);
      }
      .stop:active .node {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--shadow);
      }
      .face {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border: 2.5px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.5rem;
        color: var(--ink);
      }
      .face svg {
        width: 28px;
        height: 28px;
      }
      .stop.is-todo .face {
        border-style: dashed;
        color: var(--dim);
      }
      .stop.is-done .node {
        background: var(--line);
      }
      .stop.is-done .face,
      .stop.is-current .face {
        background: var(--sw);
        color: var(--chip-ink);
      }
      .stop.is-current .node::after {
        content: "";
        position: absolute;
        inset: -9px;
        border: 3px solid var(--sw);
        border-radius: 50%;
        animation: pulse 1.8s ease-out infinite;
        pointer-events: none;
      }
      .stop.lit .node {
        animation: flare 1.6s ease-out;
      }
      @keyframes flare {
        0% { box-shadow: 0 0 0 0 var(--sw); transform: scale(1); }
        25% { box-shadow: 0 0 26px 10px var(--sw); transform: scale(1.18); }
        100% { box-shadow: 0 0 0 0 transparent; transform: scale(1); }
      }
      @keyframes pulse {
        from { transform: scale(0.9); opacity: 1; }
        to { transform: scale(1.3); opacity: 0; }
      }
      .stop:focus-visible {
        outline: none;
      }
      .stop:focus-visible .node,
      .stop[aria-pressed="true"] .node {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }
      .here {
        position: absolute;
        bottom: calc(100% + 14px);
        left: 50%;
        padding: 3px 9px;
        background: var(--ink);
        color: var(--bg);
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        transform: translateX(-50%);
        animation: bob 1.8s ease-in-out infinite;
      }
      .here::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--ink);
      }
      @keyframes bob {
        50% { transform: translate(-50%, -4px); }
      }
      .stop-label {
        position: absolute;
        top: 50%;
        left: calc(100% + 18px);
        display: grid;
        gap: 1px;
        width: 200px;
        text-align: left;
        transform: translateY(-50%);
      }
      .stop-label.left {
        left: auto;
        right: calc(100% + 18px);
        text-align: right;
      }
      .stop-label .wk {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .stop-label .t {
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.05rem;
        line-height: 1.2;
        color: var(--ink);
      }
      .stop:hover .stop-label .t {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .stop-label .m {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
      }

      /* the week panel: a drawer that reads like one page of a syllabus.
         The week number in its colour block is the one loud element; the
         reading list underneath stays plain, numbered in suggested order,
         and each number doubles as that item's checkbox. */
      .panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: min(720px, 100vw);
        overflow: auto;
        overscroll-behavior: contain;
        background: var(--surface);
        border-left: 2px solid var(--line);
        box-shadow: -24px 0 48px rgba(22, 24, 29, 0.14);
        transform: translateX(104%);
        visibility: hidden;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.34s;
      }
      .panel.open {
        transform: none;
        visibility: visible;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 25;
        background: rgba(22, 24, 29, 0.38);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .sheet-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      html.drawer-open {
        overflow: hidden;
      }
      .panel :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .panel-head {
        padding: 18px 40px 32px;
      }
      .panel-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.9rem;
        color: var(--dim);
      }
      .arrows {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ink-soft);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--sunk);
        color: var(--ink);
      }
      .icon-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .wk-head {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: start;
        gap: 28px;
        margin-top: 18px;
      }
      .wk-num {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border: 2px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        font-family: var(--display);
        font-size: 5rem;
        font-weight: 800;
        font-variation-settings: "wdth" 75;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .panel-head h2 {
        margin: 2px 0 0;
        font-family: var(--display);
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
        color: var(--ink);
        text-wrap: balance;
      }
      .panel-head .goal {
        margin: 12px 0 0;
        max-width: 58ch;
        font-size: 1.02rem;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .panel-body {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 36px;
        padding: 0 40px 40px;
      }
      .list-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--line);
      }
      .list-head h3 {
        margin: 0;
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .list-head span {
        font-size: 0.9rem;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .extras .list-head {
        border-bottom-width: 1px;
        border-bottom-color: var(--hair);
      }
      .extras .list-head h3 {
        font-size: 1rem;
        color: var(--ink-soft);
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .step {
        position: relative;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        padding: 20px 0;
        border-bottom: 1px solid var(--hair);
      }
      /* the item to do next is flagged in the margin with the week's colour */
      .step.is-next::before {
        content: "";
        position: absolute;
        top: -1px;
        bottom: -1px;
        left: -40px;
        width: 5px;
        background: var(--sw);
      }
      .mark {
        position: relative;
        display: block;
        width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .mark input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .mark span {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--ink);
        font-family: var(--display);
        font-size: 1rem;
        font-weight: 700;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .mark span svg {
        display: none;
        width: 18px;
        height: 18px;
      }
      .mark:hover span {
        background: var(--sunk);
      }
      .mark input:checked + span {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }
      .mark input:checked + span b {
        display: none;
      }
      .mark input:checked + span svg {
        display: block;
      }
      .mark input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .step-body {
        min-width: 0;
        padding-top: 4px;
      }
      .step-link {
        color: var(--ink);
        text-decoration: none;
      }
      .step-link:hover .step-title {
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
      }
      .step-title {
        font-size: 1.06rem;
        font-weight: 700;
        line-height: 1.35;
      }
      .step.is-done .step-title {
        color: var(--dim);
      }
      .step-meta {
        margin: 3px 0 0;
        font-size: 0.9rem;
        color: var(--ink-soft);
      }
      /* must-read items: a star before the title and a heavier number box */
      .step.is-key .mark span {
        border-width: 3px;
      }
      .star {
        margin-right: 6px;
        color: var(--ink);
      }
      .step-meta b {
        color: var(--ink);
      }
      .step-note {
        margin: 8px 0 0;
        max-width: 56ch;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--dim);
      }

      .wk-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 22px;
      }
      .wk-actions .hint {
        font-size: 0.92rem;
        color: var(--dim);
      }
      .complete-btn,
      .next-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 13px 22px;
        border-radius: 6px;
        font-family: var(--body);
        font-size: 1rem;
        font-weight: 700;
        text-align: left;
      }
      .complete-btn svg {
        width: 18px;
        height: 18px;
      }
      .complete-btn {
        border: 2px solid var(--ink);
        background: var(--ink);
        color: var(--surface);
      }
      .complete-btn:hover {
        background: var(--ink-soft);
        border-color: var(--ink-soft);
      }
      .next-btn {
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .next-btn:hover {
        background: var(--sunk);
      }
      .complete-btn:active,
      .next-btn:active {
        transform: translateY(1px);
      }
      .done-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 14px;
        width: 100%;
        font-weight: 700;
        color: var(--ink);
      }
      .done-line .swatch {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--sw);
        color: var(--chip-ink);
      }
      .done-line .swatch svg {
        width: 18px;
        height: 18px;
      }
      .panel .link-btn {
        padding: 0;
        font-family: var(--body);
        font-size: 0.92rem;
        font-weight: 400;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .panel .link-btn:hover {
        color: var(--ink);
      }
      .panel-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 16px 40px;
        border-top: 1px solid var(--hair);
        font-size: 0.88rem;
        color: var(--dim);
      }
      @media (max-width: 860px) {
        .panel-head {
          padding: 12px 20px 26px;
        }
        .wk-head {
          grid-template-columns: 76px minmax(0, 1fr);
          gap: 18px;
        }
        .wk-num {
          width: 76px;
          height: 76px;
          font-size: 3.4rem;
        }
        .panel-head h2 {
          font-size: 1.5rem;
        }
        .panel-body {
          padding: 0 20px 32px;
        }
        .step.is-next::before {
          left: -20px;
          width: 4px;
        }
        .panel-foot {
          padding: 14px 20px;
        }
      }
      /* hover preview of a week on the path */
      .peek {
        position: fixed;
        z-index: 20;
        width: 330px;
        max-width: calc(100vw - 32px);
        border: 1.5px solid var(--line);
        border-top: 5px solid var(--sw);
        background: var(--surface);
        box-shadow: 4px 4px 0 var(--shadow);
        padding: 14px 16px 12px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      .peek.show {
        opacity: 1;
        transform: none;
      }
      .peek-kicker {
        margin: 0;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .peek h4 {
        margin: 2px 0 6px;
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .peek-goal {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      .peek-sub {
        margin: 12px 0 6px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--ink);
      }
      .peek ol {
        margin: 0;
        padding: 0 0 0 1.2em;
        font-size: 0.86rem;
        line-height: 1.45;
        color: var(--ink);
      }
      .peek ol li + li {
        margin-top: 3px;
      }
      .peek ol small {
        color: var(--dim);
        font-size: 0.78rem;
      }
      .peek-extra {
        margin: 6px 0 0;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .peek-foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 9px;
        border-top: 1px solid var(--hair);
        font-size: 0.78rem;
        color: var(--dim);
      }
      .peek-foot b {
        color: var(--ink);
        font-weight: 700;
        white-space: nowrap;
      }
      /* library peek: a compact card docked under the layout and theme buttons */
      .peek.docked {
        padding: 11px 13px 10px;
        max-height: calc(100vh - var(--bar) - 26px);
        overflow: hidden;
      }
      .peek.docked h4 {
        font-size: 1rem;
      }
      .peek.docked .peek-goal {
        font-size: 0.8rem;
        line-height: 1.45;
      }
      .peek.docked .peek-tags {
        margin-top: 8px;
        gap: 4px;
      }
      .peek.docked .peek-tags span {
        font-size: 0.66rem;
      }
      .peek.docked .peek-road {
        margin-top: 8px;
        font-size: 0.75rem;
      }
      .peek.docked .peek-foot {
        flex-direction: column;
        gap: 2px;
        margin-top: 8px;
        padding-top: 7px;
        font-size: 0.72rem;
      }
      /* library peek: level, time and cost under the description */
      .peek-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .peek-tags span {
        padding: 2px 7px;
        border: 1.5px solid var(--line);
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--ink);
      }
      .peek-tags .lvl {

        background: var(--sw, var(--c-mcp));
        color: var(--chip-ink);
        font-weight: 700;
        box-shadow: 4px 4px 0 var(--shadow);

        transition: transform 0.3s ease, visibility 0s linear 0.3s;

      .fx {

        inset: 0;
        z-index: 50;
        pointer-events: none;
        overflow: hidden;
      }

        position: absolute;
        width: 8px;
        height: 12px;
        border: 1px solid var(--line);
      }
      .fx span {
        position: absolute;
        font-size: 1.9rem;
        line-height: 1;

        transform: translate(-50%, 0);

      @media (max-width: 860px) {
        .bar {
          grid-template-columns: minmax(0, 1fr) auto;
          padding-block: 10px;
          padding-inline: 16px;

          padding-inline: 0;

          width: auto;
          justify-self: stretch;
        }

          display: none;
        }
        .shell {
          grid-template-columns: minmax(0, 1fr);

        }

          overflow-x: auto;
          gap: 8px;
          padding: 2px 16px 6px;
          scrollbar-width: thin;
        }

          width: auto;
          flex: none;
          grid-template-columns: 16px auto auto;
          gap: 8px;
          padding: 6px 12px;
          border: 2px solid var(--line);
          background-color: var(--surface);
          white-space: nowrap;

          margin: 12px 16px 0;

          right: calc(100% + 12px);

        .bar {
          grid-template-columns: minmax(0, 1fr);
        }

           beside the logo, so the header stays three rows, not four */

          display: contents;
        }

          grid-row: 1;
          grid-column: 1 / -1;
          justify-self: start;
        }

          grid-row: 3;
          grid-column: 1 / -1;

      /* ---------- soft shapes, matching the header ----------
         Cards, chips and panels drop the hard black boxes and offset shadows for
         rounded corners, a thin soft outline and a soft shadow; hover lifts a
         card a little instead of jumping it diagonally. Kept last so it wins. */
      :root {
        --edge: color-mix(in srgb, var(--ink) 15%, transparent);
        --edge-hi: color-mix(in srgb, var(--ink) 28%, transparent);
        --lift: 0 1px 2px rgba(24, 26, 70, 0.06), 0 8px 22px -10px rgba(24, 26, 70, 0.18);
        --lift-hi: 0 2px 4px rgba(24, 26, 70, 0.08), 0 18px 34px -14px rgba(24, 26, 70, 0.28);
        --r-card: 16px;
      }
      :root[data-theme="dark"] {
        --edge: color-mix(in srgb, var(--ink) 16%, transparent);
        --edge-hi: color-mix(in srgb, var(--ink) 30%, transparent);
        --lift: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px -12px rgba(0, 0, 0, 0.7);
        --lift-hi: 0 2px 4px rgba(0, 0, 0, 0.4), 0 20px 38px -14px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(182, 163, 255, 0.12);
      }
      /* at night, a selection glows softly instead of turning into a pale block */
      :root[data-theme="dark"] .rail-item[aria-pressed="true"] {
        background-color: rgba(182, 163, 255, 0.14);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px rgba(182, 163, 255, 0.32), 0 0 18px -8px rgba(182, 163, 255, 0.6);
      }
      :root[data-theme="dark"] .rail-item[aria-pressed="true"] .n {
        color: var(--accent);
      }
      :root[data-theme="dark"] .fmt-btn[aria-pressed="true"] {
        background: rgba(182, 163, 255, 0.26);
        border-color: rgba(182, 163, 255, 0.7);
        color: #efeaff;
      }
      :root[data-theme="dark"] .resume-btn {
        background: linear-gradient(160deg, rgba(182, 163, 255, 0.24), rgba(120, 100, 230, 0.12));
        color: var(--ink);
        box-shadow: inset 0 -1px 0 rgba(182, 163, 255, 0.25);
      }
      :root[data-theme="dark"] .resume-btn span {
        color: var(--accent);
        opacity: 1;
      }
      :root[data-theme="dark"] .resume-btn:hover {
        filter: none;
        background: linear-gradient(160deg, rgba(182, 163, 255, 0.32), rgba(120, 100, 230, 0.18));
      }

      /* the daylight sky: light mode's counterpart to the Milky Way, a pale
         lavender-to-blue haze, three faint orbit rings round an unseen sun in the
         top right corner, and a few soft stars, fixed behind every page */
      :root:not([data-theme="dark"]) body::before,
      :root:not([data-theme="dark"]) body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      :root:not([data-theme="dark"]) body::before {
        background:
          radial-gradient(ellipse 55% 45% at 92% 0%, rgba(201, 184, 255, 0.32), rgba(201, 184, 255, 0) 70%),
          radial-gradient(ellipse 50% 40% at 0% 100%, rgba(143, 211, 255, 0.22), rgba(143, 211, 255, 0) 70%),
          radial-gradient(ellipse 40% 30% at 45% 55%, rgba(255, 214, 230, 0.12), rgba(255, 214, 230, 0) 70%);
      }
      :root:not([data-theme="dark"]) body::after {
        background:
          radial-gradient(1.6px 1.6px at 40px 60px, rgba(110, 96, 220, 0.35), rgba(110, 96, 220, 0)),
          radial-gradient(1.2px 1.2px at 230px 140px, rgba(110, 96, 220, 0.28), rgba(110, 96, 220, 0)),
          radial-gradient(1.4px 1.4px at 380px 40px, rgba(90, 140, 230, 0.3), rgba(90, 140, 230, 0)),
          radial-gradient(1.2px 1.2px at 120px 300px, rgba(110, 96, 220, 0.25), rgba(110, 96, 220, 0)),
          radial-gradient(1.6px 1.6px at 470px 250px, rgba(90, 140, 230, 0.28), rgba(90, 140, 230, 0));
        background-size: 540px 380px;
      }
      /* the night-sky home view keeps its own sky, so the daylight one stays out */
      :root.on-intro:not([data-theme="dark"]) body::before,
      :root.on-intro:not([data-theme="dark"]) body::after {
        display: none;
      }

        border: 1px solid var(--edge);
        border-radius: var(--r-card);
        box-shadow: var(--lift);
        overflow: hidden;

        overflow: visible;

      }

        },
        {
          id: "ml-foundations", stage: "advanced", t: "foundations",
          title: "Machine learning foundations",
          goal: "Learn classic machine learning (regression, classification, neural networks, how models are trained and evaluated) so the research courses that follow have solid ground.",
