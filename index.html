<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Learning Shelf</title>
    <meta
      name="description"
      content="A 12-week roadmap from beginner to advanced, plus a curated shelf of free courses, talks, tutorials and articles on agents, MCP, skills, RAG, evals and more."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316181d'/%3E%3Crect x='6' y='7' width='5' height='18' fill='%23c9b8ff'/%3E%3Crect x='13' y='10' width='5' height='15' fill='%23d4f25c'/%3E%3Crect x='20' y='5' width='6' height='20' fill='%238fd3ff' transform='rotate(8 23 15)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Layout: a library shelf. Sticky search bar on top, a category rail
         on the left (chip scroller on phones), and a main pane where each
         category is a shelf of tactile, hard-edged resource slips. */
      :root {
        --bg: #eef1ec;
        --surface: #ffffff;
        --sunk: #e2e7df;
        --ink: #16181d;
        --ink-soft: #4a4f57;
        --dim: #6f746c;
        --line: #16181d;
        --hair: #c7cdc3;
        --accent: #3b2bd9;
        --on-accent: #ffffff;
        --chip-ink: #16181d;
        --shadow: #16181d;

        /* category swatches: pastel fills that always carry dark text */
        --c-skills: #c9b8ff;
        --c-agents: #8fd3ff;
        --c-harness: #ffd166;
        --c-context: #8ef0c4;
        --c-mcp: #d4f25c;
        --c-evals: #ffb3d9;
        --c-graphrag: #ffab91;
        --c-docs: #b5e3e0;
        --c-coding: #e6c9a8;
        --c-foundations: #aab4ff;

        --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
        --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        --rail: 248px;
        --bar: 64px;
        color-scheme: light;
      }
      /* dark theme (chosen with the toggle): Catppuccin Frappé, hex values from the official palette */
      :root[data-theme="dark"] {
        --bg: #303446;          /* base */
        --surface: #414559;     /* surface0 */
        --sunk: #292c3c;        /* mantle */
        --ink: #c6d0f5;         /* text */
        --ink-soft: #a5adce;    /* subtext0 */
        --dim: #838ba7;         /* overlay1 */
        --line: #949cbb;        /* overlay2 */
        --hair: #51576d;        /* surface1 */
        --accent: #ca9ee6;      /* mauve */
        --on-accent: #232634;   /* crust */
        --shadow: #232634;      /* crust */
        --chip-ink: #232634;    /* crust */
        --c-skills: #ca9ee6;    /* mauve */
        --c-agents: #99d1db;    /* sky */
        --c-harness: #e5c890;   /* yellow */
        --c-context: #81c8be;   /* teal */
        --c-mcp: #a6d189;       /* green */
        --c-evals: #f4b8e4;     /* pink */
        --c-graphrag: #ef9f76;  /* peach */
        --c-docs: #85c1dc;      /* sapphire */
        --c-coding: #eebebe;    /* flamingo */
        --c-foundations: #babbf1; /* lavender */
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.55 var(--body);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      a {
        color: inherit;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--on-accent);
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- top bar ---------- */
      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) auto;
        align-items: center;
        min-height: var(--bar);
        background: var(--bg);
        border-bottom: 1px solid var(--hair);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-inline: 20px;
        height: 100%;
        border-right: 1px solid var(--hair);
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .brand-mark {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 22px;
      }
      .brand-mark i {
        display: block;
        width: 6px;
        border: 1.5px solid var(--line);
      }
      .brand-mark i:nth-child(1) { height: 20px; background: var(--c-skills); }
      .brand-mark i:nth-child(2) { height: 15px; background: var(--c-mcp); }
      .brand-mark i:nth-child(3) { height: 22px; background: var(--c-agents); transform: rotate(9deg); transform-origin: bottom left; }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-inline: 20px;
        padding: 0 12px;
        height: 42px;
        border: 2px solid var(--line);
        background: var(--surface);
        box-shadow: 3px 3px 0 var(--shadow);
        min-width: 0;
      }
      .search:focus-within {
        box-shadow: 5px 5px 0 var(--hair);
      }
      .search svg {
        flex: none;
        color: var(--dim);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        height: 100%;
      }
      .search input::placeholder {
        color: var(--dim);
      }
      kbd {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 1px 6px;
        border: 1.5px solid var(--hair);
        background: var(--sunk);
        color: var(--ink-soft);
      }
      /* hide the browser's own × so only our clear button shows */
      .search input::-webkit-search-cancel-button,
      .search input::-webkit-search-decoration {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
      .search-clear {
        flex: none;
        border: 1.5px solid var(--hair);
        background: var(--sunk);
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
        padding: 2px 8px;
        box-shadow: 0 0 0 var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease,
          background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .search-clear:hover,
      .search-clear:focus-visible {
        background: var(--c-evals);
        border-color: var(--line);
        color: var(--chip-ink);
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .search-clear:active {
        transform: translate(0, 0);
        box-shadow: 0 0 0 var(--shadow);
      }
      .bar-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-inline: 0 20px;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .bar-meta b {
        color: var(--ink);
      }
      .theme-btn {
        border: 2px solid var(--line);
        background: var(--surface);
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .theme-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      /* ---------- shell ---------- */
      .shell {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        align-items: start;
      }

      /* ---------- category rail ---------- */
      .rail {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + var(--bar));
        max-height: calc(100vh - var(--bar));
        overflow-y: auto;
        border-right: 1px solid var(--hair);
        min-height: calc(100vh - var(--bar));
        padding-block: 20px;
      }
      .rail-label {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 0 20px 10px;
      }
      .rail-nav {
        display: flex;
        flex-direction: column;
      }
      .rail-item {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 9px 20px;
        border: 0;
        background: none;
        text-align: left;
        font-size: 0.95rem;
      }
      .rail-item:hover {
        background: var(--sunk);
      }
      .rail-item .sw {
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--line);
        background: var(--sw, var(--surface));
      }
      .rail-item .n {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rail-item[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .rail-item[aria-pressed="true"] .n {
        color: var(--bg);
      }
      .rail-item[aria-pressed="true"] .sw {
        border-color: var(--bg);
      }
      .rail-foot {
        margin: 24px 20px 0;
        padding-top: 16px;
        border-top: 1.5px dashed var(--hair);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .fmt-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .fmt-btn {
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 3px 8px;
        font-family: var(--mono);
        font-size: 0.72rem;
      }
      .fmt-btn[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      /* ---------- main ---------- */
      main {
        min-width: 0;
        padding: 36px 40px 24px;
      }
      .view-toggle {
        display: flex;
        border: 2px solid var(--line);
        box-shadow: 2px 2px 0 var(--shadow);
      }
      .view-toggle button {
        border: 0;
        background: var(--surface);
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 0.75rem;
      }
      .view-toggle button + button {
        border-left: 2px solid var(--line);
      }
      .view-toggle button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }

      /* ---------- shelves ---------- */
      .shelves {
        display: flex;
        flex-direction: column;
        gap: 44px;
      }
      .shelf-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-bottom: 16px;
      }
      .shelf-head h2 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .shelf-head h2 .tab {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid var(--line);
        background: var(--sw);
        transform: rotate(-6deg);
      }

      /* list view: slips stacked like index cards in a drawer */
      .slips {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .slip {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        gap: 18px;
        padding: 14px 18px;
        background: var(--surface);
        border: 2px solid var(--line);
        box-shadow: 4px 4px 0 var(--shadow);
        text-decoration: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .slip:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--sw);
      }
      .slip:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--shadow);
      }
      .fmt {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1.5px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .fmt svg {
        width: 11px;
        height: 11px;
      }
      .slip-body {
        min-width: 0;
      }
      .slip-title {
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.12rem;
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }
      .slip-meta {
        margin: 4px 0 0;
        font-size: 0.85rem;
        color: var(--ink-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
      }
      .slip-meta .host {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--dim);
        overflow-wrap: anywhere;
      }

      /* cards view */
      .grid-view .slips {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
      }
      .grid-view .slip {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        align-items: start;
        min-height: 170px;
        padding: 0;
        gap: 0;
      }
      .grid-view .fmt {
        grid-column: 1;
        margin: 16px 0 0 16px;
      }
      .grid-view .slip-body {
        align-self: end;
        padding: 18px 16px 16px;
        border-top: 2px dashed var(--hair);
        margin-top: 16px;
      }

      .empty {
        padding: 48px 24px;
        border: 2px dashed var(--hair);
        text-align: center;
        color: var(--ink-soft);
      }
      .empty strong {
        display: block;
        font-family: var(--display);
        font-size: 1.4rem;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .empty button {
        margin-top: 14px;
        border: 2px solid var(--line);
        background: var(--surface);
        padding: 6px 14px;
        box-shadow: 3px 3px 0 var(--shadow);
      }

      footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid var(--hair);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        font-size: 0.85rem;
        color: var(--dim);
      }
      footer .keys {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      /* ---------- roadmap ----------
         Overview first, details on demand: a winding path of week stops
         (done / current / upcoming) on the left, and the selected week's
         checklist in a sticky panel on the right (a bottom sheet on phones). */
      .shell.solo {
        grid-template-columns: minmax(0, 1fr);
      }
      .shell.solo .rail {
        display: none;
      }
      .rm {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }
      .rm-main {
        position: relative;
        min-width: 0;
      }
      /* on wide screens the stats float in the corner so the path can start at the top */
      @media (min-width: 1101px) {
        .rm-hero {
          position: absolute;
          top: 0;
          right: 0;
          z-index: 2;
        }
        .rm-main .path {
          margin-top: 0;
        }
        .rm-main .path > .checkpoint:first-of-type {
          margin-top: 0;
        }
      }
      /* intro on the left, progress stats pinned to the top-right corner */
      .rm-hero {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px 32px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        margin-left: auto;
      }
      .stat {
        display: grid;
        padding: 8px 14px;
        border: 2px solid var(--line);
        background: var(--surface);
        box-shadow: 3px 3px 0 var(--shadow);
      }
      .stat b {
        font-family: var(--display);
        font-size: 1.4rem;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .link-btn {
        padding: 0;
        border: 0;
        background: none;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* the path */
      .path {
        --amp: 120px;
        position: relative;
        max-width: 880px;
        margin-top: 36px;
        padding-bottom: 24px;
      }
      .path-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .path-svg .base {
        fill: none;
        stroke: var(--hair);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 1 13;
      }
      .path-svg .fill {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
        stroke-linecap: round;
      }
      .search-note {
        margin: 24px 0 0;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
      }
      .checkpoint {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 2px;
        width: fit-content;
        max-width: 100%;
        margin: 26px auto 34px;
        padding: 10px 20px 12px;
        text-align: center;
        border: 2px solid var(--line);
        background: var(--bg);
        box-shadow: 3px 3px 0 var(--shadow);
      }
      .checkpoint .k {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .checkpoint b {
        font-family: var(--display);
        font-size: 1.15rem;
        line-height: 1.2;
      }
      .checkpoint.done {
        background: var(--ink);
        color: var(--bg);
      }
      .checkpoint.done .k {
        color: var(--bg);
      }
      .stop-row {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        height: 134px;
        align-items: center;
      }
      .stop {
        position: relative;
        display: block;
        width: 78px;
        height: 78px;
        padding: 0;
        border: 0;
        background: none;
        transform: translateX(calc(var(--amp) * var(--k)));
        transition: opacity 0.2s ease;
      }
      .stop.dim {
        opacity: 0.28;
      }
      .node {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: conic-gradient(var(--sw) calc(var(--p) * 1%), var(--hair) 0);
        box-shadow: 0 5px 0 var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .stop:hover .node {
        transform: translateY(-3px);
        box-shadow: 0 8px 0 var(--shadow);
      }
      .stop:active .node {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--shadow);
      }
      .face {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border: 2.5px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.5rem;
        color: var(--ink);
      }
      .face svg {
        width: 28px;
        height: 28px;
      }
      .stop.is-todo .face {
        border-style: dashed;
        color: var(--dim);
      }
      .stop.is-done .node {
        background: var(--line);
      }
      .stop.is-done .face,
      .stop.is-current .face {
        background: var(--sw);
        color: var(--chip-ink);
      }
      .stop.is-current .node::after {
        content: "";
        position: absolute;
        inset: -9px;
        border: 3px solid var(--sw);
        border-radius: 50%;
        animation: pulse 1.8s ease-out infinite;
        pointer-events: none;
      }
      @keyframes pulse {
        from { transform: scale(0.9); opacity: 1; }
        to { transform: scale(1.3); opacity: 0; }
      }
      .stop:focus-visible {
        outline: none;
      }
      .stop:focus-visible .node,
      .stop[aria-pressed="true"] .node {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }
      .here {
        position: absolute;
        bottom: calc(100% + 14px);
        left: 50%;
        padding: 3px 9px;
        background: var(--ink);
        color: var(--bg);
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        transform: translateX(-50%);
        animation: bob 1.8s ease-in-out infinite;
      }
      .here::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--ink);
      }
      @keyframes bob {
        50% { transform: translate(-50%, -4px); }
      }
      .stop-label {
        position: absolute;
        top: 50%;
        left: calc(100% + 18px);
        display: grid;
        gap: 1px;
        width: 200px;
        text-align: left;
        transform: translateY(-50%);
      }
      .stop-label.left {
        left: auto;
        right: calc(100% + 18px);
        text-align: right;
      }
      .stop-label .wk {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .stop-label .t {
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.05rem;
        line-height: 1.2;
        color: var(--ink);
      }
      .stop:hover .stop-label .t {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .stop-label .m {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
      }

      /* the week panel: a drawer that reads like one page of a syllabus.
         The week number in its colour block is the one loud element; the
         reading list underneath stays plain, numbered in suggested order,
         and each number doubles as that item's checkbox. */
      .panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: min(720px, 100vw);
        overflow: auto;
        overscroll-behavior: contain;
        background: var(--surface);
        border-left: 2px solid var(--line);
        box-shadow: -24px 0 48px rgba(22, 24, 29, 0.14);
        transform: translateX(104%);
        visibility: hidden;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.34s;
      }
      .panel.open {
        transform: none;
        visibility: visible;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 25;
        background: rgba(22, 24, 29, 0.38);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .sheet-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      html.drawer-open {
        overflow: hidden;
      }
      .panel :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .panel-head {
        padding: 18px 40px 32px;
      }
      .panel-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.9rem;
        color: var(--dim);
      }
      .arrows {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ink-soft);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--sunk);
        color: var(--ink);
      }
      .icon-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .wk-head {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: start;
        gap: 28px;
        margin-top: 18px;
      }
      .wk-num {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border: 2px solid var(--line);
        background: var(--sw);
        color: var(--chip-ink);
        font-family: var(--display);
        font-size: 5rem;
        font-weight: 800;
        font-variation-settings: "wdth" 75;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .panel-head h2 {
        margin: 2px 0 0;
        font-family: var(--display);
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
        color: var(--ink);
        text-wrap: balance;
      }
      .panel-head .goal {
        margin: 12px 0 0;
        max-width: 58ch;
        font-size: 1.02rem;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .panel-body {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 36px;
        padding: 0 40px 40px;
      }
      .list-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--line);
      }
      .list-head h3 {
        margin: 0;
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .list-head span {
        font-size: 0.9rem;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .extras .list-head {
        border-bottom-width: 1px;
        border-bottom-color: var(--hair);
      }
      .extras .list-head h3 {
        font-size: 1rem;
        color: var(--ink-soft);
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .step {
        position: relative;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        padding: 20px 0;
        border-bottom: 1px solid var(--hair);
      }
      /* the item to do next is flagged in the margin with the week's colour */
      .step.is-next::before {
        content: "";
        position: absolute;
        top: -1px;
        bottom: -1px;
        left: -40px;
        width: 5px;
        background: var(--sw);
      }
      .mark {
        position: relative;
        display: block;
        width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .mark input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .mark span {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--ink);
        font-family: var(--display);
        font-size: 1rem;
        font-weight: 700;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .mark span svg {
        display: none;
        width: 18px;
        height: 18px;
      }
      .mark:hover span {
        background: var(--sunk);
      }
      .mark input:checked + span {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }
      .mark input:checked + span b {
        display: none;
      }
      .mark input:checked + span svg {
        display: block;
      }
      .mark input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .step-body {
        min-width: 0;
        padding-top: 4px;
      }
      .step-link {
        color: var(--ink);
        text-decoration: none;
      }
      .step-link:hover .step-title {
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
      }
      .step-title {
        font-size: 1.06rem;
        font-weight: 700;
        line-height: 1.35;
      }
      .step.is-done .step-title {
        color: var(--dim);
      }
      .step-meta {
        margin: 3px 0 0;
        font-size: 0.9rem;
        color: var(--ink-soft);
      }
      .step-note {
        margin: 8px 0 0;
        max-width: 56ch;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--dim);
      }

      .wk-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 22px;
      }
      .wk-actions .hint {
        font-size: 0.92rem;
        color: var(--dim);
      }
      .complete-btn,
      .next-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 13px 22px;
        border-radius: 6px;
        font-family: var(--body);
        font-size: 1rem;
        font-weight: 700;
        text-align: left;
      }
      .complete-btn svg {
        width: 18px;
        height: 18px;
      }
      .complete-btn {
        border: 2px solid var(--ink);
        background: var(--ink);
        color: var(--surface);
      }
      .complete-btn:hover {
        background: var(--ink-soft);
        border-color: var(--ink-soft);
      }
      .next-btn {
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .next-btn:hover {
        background: var(--sunk);
      }
      .complete-btn:active,
      .next-btn:active {
        transform: translateY(1px);
      }
      .done-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 14px;
        width: 100%;
        font-weight: 700;
        color: var(--ink);
      }
      .done-line .swatch {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--sw);
        color: var(--chip-ink);
      }
      .done-line .swatch svg {
        width: 18px;
        height: 18px;
      }
      .panel .link-btn {
        padding: 0;
        font-family: var(--body);
        font-size: 0.92rem;
        font-weight: 400;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .panel .link-btn:hover {
        color: var(--ink);
      }
      .panel-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 16px 40px;
        border-top: 1px solid var(--hair);
        font-size: 0.88rem;
        color: var(--dim);
      }
      @media (max-width: 860px) {
        .panel-head {
          padding: 12px 20px 26px;
        }
        .wk-head {
          grid-template-columns: 76px minmax(0, 1fr);
          gap: 18px;
        }
        .wk-num {
          width: 76px;
          height: 76px;
          font-size: 3.4rem;
        }
        .panel-head h2 {
          font-size: 1.5rem;
        }
        .panel-body {
          padding: 0 20px 32px;
        }
        .step.is-next::before {
          left: -20px;
          width: 4px;
        }
        .panel-foot {
          padding: 14px 20px;
        }
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 12px 18px;
        border: 2px solid var(--line);
        background: var(--sw, var(--c-mcp));
        color: var(--chip-ink);
        font-weight: 700;
        box-shadow: 4px 4px 0 var(--shadow);
        transform: translate(-50%, calc(100% + 40px));
        visibility: hidden;
        transition: transform 0.3s ease, visibility 0s linear 0.3s;
      }
      .toast.show {
        transform: translate(-50%, 0);
        visibility: visible;
        transition: transform 0.3s ease;
      }
      .wk-badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--dim);
      }

      /* ---------- narrow screens ---------- */
      @media (max-width: 860px) {
        .bar {
          grid-template-columns: minmax(0, 1fr) auto;
          padding-block: 10px;
          padding-inline: 16px;
          row-gap: 10px;
        }
        .brand {
          border-right: 0;
          padding-inline: 0;
        }
        .bar-meta {
          padding-inline: 0;
        }
        .bar-meta .counter {
          display: none;
        }
        .search {
          grid-column: 1 / -1;
          grid-row: 2;
          margin-inline: 0;
        }
        .search kbd {
          display: none;
        }
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .rail {
          position: static;
          min-height: 0;
          max-height: none;
          border-right: 0;
          border-bottom: 1px solid var(--hair);
          padding-block: 14px;
        }
        .rail-label {
          padding-inline: 16px;
        }
        .rail-nav {
          flex-direction: row;
          overflow-x: auto;
          gap: 8px;
          padding: 2px 16px 6px;
          scrollbar-width: thin;
        }
        .rail-item {
          width: auto;
          flex: none;
          grid-template-columns: 12px auto auto;
          gap: 8px;
          padding: 6px 12px;
          border: 2px solid var(--line);
          background: var(--surface);
          white-space: nowrap;
        }
        .rail-foot {
          margin: 12px 16px 0;
          padding-top: 12px;
        }
        main {
          padding: 24px 16px 16px;
        }
        .slip {
          grid-template-columns: minmax(0, 1fr);
          gap: 10px;
        }
        footer .keys {
          display: none;
        }
        .path {
          --amp: 54px;
        }
        .stop,
        .node {
          width: 66px;
          height: 66px;
        }
        .face {
          width: 54px;
          height: 54px;
          font-size: 1.3rem;
        }
        .stop-label {
          width: 128px;
          left: calc(100% + 12px);
        }
        .stop-label.left {
          right: calc(100% + 12px);
        }
        .stop-label .t {
          font-size: 0.95rem;
        }
      }

      @media (max-width: 480px) {
        .bar {
          grid-template-columns: minmax(0, 1fr);
        }
        .bar-meta {
          grid-row: 3;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#top" aria-label="AI Learning Shelf, back to top">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        AI Learning Shelf
      </a>

      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">

          <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" />

        <input

    </header>

    <div class="shell" id="top">
      <nav class="rail" aria-label="Topics">

            <span><kbd>/</kbd> search</span>

            <span><kbd>←</kbd><kbd>→</kbd> change week</span>
            <span><kbd>v</kbd> switch layout</span>

      </main>
    </div>

    <div class="sheet-backdrop" id="backdrop"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

        { t: "evals", f: "course", title: "Automated Testing for LLMOps", by: "DeepLearning.AI", url: "https://www.deeplearning.ai/courses/automated-testing-llmops" },

        { t: "coding", f: "course", title: "Spec-Driven Development with Coding Agents", by: "DeepLearning.AI", url: "https://www.deeplearning.ai/courses/spec-driven-development-with-coding-agents" },

        { t: "mcp", f: "course", title: "Introduction to Model Context Protocol", by: "Anthropic Academy", url: "https://anthropic.skilljar.com/introduction-to-model-context-protocol" },
        { t: "mcp", f: "course", title: "MCP: Build Rich-Context AI Apps with Anthropic", by: "DeepLearning.AI", url: "https://www.deeplearning.ai/courses/mcp-build-rich-context-ai-apps-with-anthropic" },
        { t: "mcp", f: "video", title: "How Model Context Protocol (MCP) actually works", by: "Google Cloud Tech", url: "https://youtu.be/cGuyrANVi4A" },
        { t: "mcp", f: "tutorial", title: "Build your first MCP server in Python", by: "Pamela Fox · PyCon US 2026", url: "https://pamelafox.github.io/pycon2026-mcp-tutorial/" },
        { t: "mcp", f: "series", title: "Python + MCP: From local to production", by: "Microsoft Reactor", url: "https://developer.microsoft.com/en-us/reactor/series/S-1614/" },
        { t: "mcp", f: "video", title: "MCP Live! playlist", by: "YouTube", url: "https://youtube.com/playlist?list=PLJ2a7YWJ3jxk&si=YUapAKeneZH5kzri" },
        { t: "mcp", f: "notes", title: "Claude and MCP study notes", by: "Knowledge Lab", url: "https://senthilcaesar.github.io/knowledgelab/#claude-mcp" },

        { t: "docs", f: "video", title: "Building the document context layer for AI agents", by: "Jerry Liu, LlamaIndex · AI Engineer", url: "https://youtu.be/RQi7x-navxU" },
      ];

      // The roadmap: three stages, twelve weeks. Each week points at RESOURCES by
      // url; `opt: true` marks extra reading that doesn't count toward progress.
      const STAGES = [
        {
          id: "beginner",
          name: "Beginner",
          sub: "Foundations",
          blurb: "Get comfortable calling models from code, grounding them in your own documents, and building a first tool-using agent.",
        },
        {
          id: "intermediate",
          name: "Intermediate",
          sub: "Tools, skills and evals",
          blurb: "Connect agents to the outside world with MCP, package know-how as Skills, and measure whether any of it works.",
        },
        {
          id: "advanced",
          name: "Advanced",
          sub: "Systems and research",
          blurb: "Ground agents in knowledge graphs, engineer the harness around the model, and study how production and self-improving agent systems are built.",
        },
      ];

      const ROADMAP = [
        {
          n: 1, stage: "beginner", t: "foundations",
          title: "Build with LLMs in Python",
          goal: "Understand what happens in an LLM API call (messages, tokens, the context window, temperature, structured output) and make one from your own code.",
          learn: [
            { url: "https://developer.microsoft.com/en-us/reactor/series/S-1581/" },
            { url: "https://www.deeplearning.ai/courses/ai-python-for-beginners", opt: true, note: "New to Python? Take this first." },
            { url: "https://www.deeplearning.ai/courses/ai-for-everyone", opt: true, note: "A non-technical tour of what AI can and can't do." },
            { url: "https://www.deeplearning.ai/courses/generative-ai-for-everyone", opt: true, note: "How generative AI works and where it fits, without code." },
            { url: "https://www.ibm.com/training/artificial-intelligence", opt: true, note: "A gentler, concept-first overview if the code moves too fast." },
            { url: "https://www.edx.org/bio/pavlos-protopapas-3", opt: true, note: "Pick an intro machine learning course if you want the maths underneath." },
          ],
        },
        {
          n: 2, stage: "beginner", t: "graphrag",
          title: "Retrieval-augmented generation",
          goal: "Learn why models need retrieval, and how parsing, chunking, embeddings and vector search ground answers in your own documents.",
          learn: [
            { url: "https://www.deeplearning.ai/courses/retrieval-augmented-generation" },
            { url: "https://youtu.be/RQi7x-navxU", note: "Why document parsing quietly decides how good your RAG is." },
          ],
        },
        {
          n: 3, stage: "beginner", t: "context",
          title: "Context engineering",
          goal: "Treat the context window as a budget: what goes in, in what order, and what gets left out.",
          learn: [{ url: "https://senthilcaesar.github.io/blogs/#/posts/context-engineering" }],
        },
        {
          n: 4, stage: "beginner", t: "agents",
          title: "Your first agent",
          goal: "Move from single calls to a loop where the model chooses a tool, sees the result and decides what to do next.",
          learn: [
            { url: "https://developer.microsoft.com/en-us/reactor/series/S-1631/" },
            { url: "https://academy.langchain.com/courses/foundation-introduction-to-deepagents" },
          ],
        },
        {
          n: 5, stage: "intermediate", t: "mcp",
          title: "MCP fundamentals",
          goal: "Understand the Model Context Protocol: hosts, clients and servers, and the tools, resources and prompts a server exposes.",
          learn: [
            { url: "https://youtu.be/cGuyrANVi4A", note: "Start here: a short picture of the whole protocol." },
            { url: "https://anthropic.skilljar.com/introduction-to-model-context-protocol" },
            { url: "https://www.deeplearning.ai/courses/mcp-build-rich-context-ai-apps-with-anthropic" },
          ],
        },
        {
          n: 6, stage: "intermediate", t: "mcp",
          title: "Build and ship an MCP server",
          goal: "Write your own MCP server, test it, and take it from a local process to a remote deployment.",
          learn: [
            { url: "https://pamelafox.github.io/pycon2026-mcp-tutorial/" },
            { url: "https://developer.microsoft.com/en-us/reactor/series/S-1614/" },
            { url: "https://youtube.com/playlist?list=PLJ2a7YWJ3jxk&si=YUapAKeneZH5kzri", opt: true },
            { url: "https://senthilcaesar.github.io/knowledgelab/#claude-mcp", opt: true, note: "Handy for review once you have built something." },
          ],
        },
        {
          n: 7, stage: "intermediate", t: "skills",
          title: "Agent Skills",
          goal: "Package instructions, scripts and reference files as Skills, so an agent loads expertise only when a task needs it.",
          learn: [
            { url: "https://claude.com/blog/skills-explained" },
            { url: "https://anthropic.skilljar.com/introduction-to-agent-skills" },
            { url: "https://senthilcaesar.github.io/blogs/#/posts/writing-your-first-skill-md-file" },
            { url: "https://www.deeplearning.ai/courses/agent-skills-with-anthropic", opt: true },
          ],
        },
        {
          n: 8, stage: "intermediate", t: "evals",
          title: "Evaluating agents",
          goal: "Replace “it seems better” with numbers: test sets, code-based checks, LLM judges and automated runs on every change.",
          learn: [
            { url: "https://hugobowne.substack.com/p/how-evals-are-central-to-harness" },
            { url: "https://www.deeplearning.ai/courses/evaluating-ai-agents" },
            { url: "https://www.deeplearning.ai/courses/automated-testing-llmops" },
          ],
        },
        {
          n: 9, stage: "advanced", t: "graphrag",
          title: "Knowledge graphs and GraphRAG",
          goal: "Learn when relationships between facts matter more than similarity, and how agents can build and query knowledge graphs.",
          learn: [
            { url: "https://blog.bytebytego.com/p/graphrag-how-ai-answers-questions" },
            { url: "https://learn.deeplearning.ai/courses/knowledge-graphs-rag" },
            { url: "https://www.deeplearning.ai/courses/agentic-knowledge-graph-construction" },
            { url: "https://graphacademy.neo4j.com/categories/generative-ai", opt: true },
          ],
        },
        {
          n: 10, stage: "advanced", t: "harness",
          title: "Harnesses and coding agents",
          goal: "Understand the harness around the model (tools, memory, permissions, the loop itself) and drive coding agents with clear specs.",
          learn: [
            { url: "https://senthilcaesar.github.io/blogs/#/posts/engine-behind-autonomous-ai-agents-harnesses-autoresearch" },
            { url: "https://www.deeplearning.ai/courses/spec-driven-development-with-coding-agents" },
          ],
        },
        {
          n: 11, stage: "advanced", t: "agents",
          title: "Engineering production agent systems",
          goal: "Study how real agent systems are designed, optimised and kept reliable, cheap and fast.",
          learn: [
            { url: "https://cs329z.stanford.edu/", note: "A full university course: follow the lectures on the topics you need." },
            { url: "https://cs2680.com/", note: "Pairs well with CS 329Z on the systems and optimisation side." },
            { url: "https://www.coursera.org/professional-certificates/ibm-rag-and-agentic-ai", opt: true, note: "A longer, structured track if you want a certificate." },
          ],
        },
        {
          n: 12, stage: "advanced", t: "foundations",
          title: "The research frontier and a capstone",
          goal: "Look under the hood at self-improving agents, how language models are trained, and machine learning on graphs, then pull everything together.",
          learn: [
            { url: "https://cs329a.stanford.edu/" },
            { url: "https://cs336.stanford.edu/", opt: true, note: "Build a language model from scratch: demanding, and well worth it." },
            { url: "https://www.deeplearning.ai/specializations/mathematics-for-machine-learning-and-data-science", opt: true, note: "Linear algebra, calculus and probability to make CS 336 easier going." },
            { url: "https://web.stanford.edu/class/cs224w/", opt: true, note: "The theory behind graph learning, if week 9 hooked you." },
          ],
        },
      ];

      const FORMATS = {
        course: { label: "Course", icon: '<path d="M1 4l5-3 5 3-5 3z M3 5.5V8.5c1.5 1.3 4.5 1.3 6 0V5.5" fill="none" stroke="currentColor" stroke-width="1.4"/>' },
        video: { label: "Video", icon: '<path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/>' },
        series: { label: "Series", icon: '<path d="M1 2h10M1 6h10M1 10h10" stroke="currentColor" stroke-width="1.6"/>' },
        tutorial: { label: "Tutorial", icon: '<path d="M4 3L1 6l3 3M8 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5"/>' },
        article: { label: "Article", icon: '<path d="M2 1h8v10H2z M4 4h4M4 6h4M4 8h2" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
        notes: { label: "Notes", icon: '<path d="M2 1h6l2 2v8H2z M4 5h4M4 7.5h4" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
        profile: { label: "Profile", icon: '<path d="M6 5.5a2 2 0 100-4 2 2 0 000 4z M1.8 10.8c0-2.3 1.9-3.6 4.2-3.6s4.2 1.3 4.2 3.6" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
      };

      const state = { mode: "roadmap", topic: "all", format: "all", q: "", view: "grid" };
      try {
        const saved = JSON.parse(localStorage.getItem("shelf-prefs") || "{}");
        if (saved.view === "list") state.view = "list";
        if (saved.mode === "library") state.mode = "library";
      } catch (e) {}
      function savePrefs() {
        try {
          localStorage.setItem("shelf-prefs", JSON.stringify({ view: state.view, mode: state.mode }));
        } catch (e) {}
      }

      // progress: ticked resource urls, plus "week:<n>" once a week is marked complete
      let done = new Set();
      try {
        done = new Set(JSON.parse(localStorage.getItem("shelf-progress") || "[]"));
      } catch (e) {}
      function saveProgress() {
        try {
          localStorage.setItem("shelf-progress", JSON.stringify([...done]));
        } catch (e) {}
      }

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const host = (u) => new URL(u).hostname.replace(/^www\./, "");
      const topicOf = (id) => TOPICS.find((t) => t.id === id);
      const pad = (n) => String(n).padStart(2, "0");

      const byUrl = Object.fromEntries(RESOURCES.map((r) => [r.url, r]));
      const weekOf = {};
      ROADMAP.forEach((w) =>
        w.learn.forEach((s) => {
          if (!byUrl[s.url]) console.warn("Roadmap link missing from RESOURCES:", s.url);
          weekOf[s.url] = w.n;
        })
      );

      // a week's required steps are its core (non-optional) resources
      const required = (w) => w.learn.filter((s) => !s.opt).map((s) => s.url);
      const weekDone = (w) => required(w).filter((k) => done.has(k)).length;
      // a week only counts as complete when the learner presses its complete button
      const weekComplete = (w) => done.has("week:" + w.n);

      function hits(parts) {
        if (!state.q) return true;
        const hay = parts.join(" ").toLowerCase();
        return state.q
          .toLowerCase()
          .split(/\s+/)
          .every((w) => hay.includes(w));
      }

      function matches(r) {
        if (state.format !== "all" && r.f !== state.format) return false;
        return hits([r.title, r.by, host(r.url), topicOf(r.t).name, FORMATS[r.f].label]);
      }

      function weekMatches(w) {
        const res = w.learn.map((s) => byUrl[s.url]).filter(Boolean);
        return hits([
          "week " + w.n, w.title, w.goal, topicOf(w.t).name,
          ...res.flatMap((r) => [r.title, r.by, host(r.url)]),
        ]);
      }

      function renderRail() {
        const pool = RESOURCES.filter(matches);
        const items = [{ id: "all", name: "All topics" }, ...TOPICS];
        $("#rail-nav").innerHTML = items
          .map((t) => {
            const n = t.id === "all" ? pool.length : pool.filter((r) => r.t === t.id).length;
            const sw = t.id === "all" ? "var(--surface)" : `var(--c-${t.id})`;
            return `<button class="rail-item" type="button" data-topic="${t.id}" aria-pressed="${state.topic === t.id}" style="--sw:${sw}">
              <span class="sw" aria-hidden="true"></span><span>${esc(t.name)}</span><span class="n">${n}</span></button>`;
          })
          .join("");

        const fmts = ["all", ...Object.keys(FORMATS).filter((f) => RESOURCES.some((r) => r.f === f))];
        $("#fmt-row").innerHTML = fmts
          .map(
            (f) =>
              `<button class="fmt-btn" type="button" data-format="${f}" aria-pressed="${state.format === f}">${f === "all" ? "any" : FORMATS[f].label.toLowerCase()}</button>`
          )
          .join("");
      }

      function slip(r) {
        const fmt = FORMATS[r.f];
        return `<li><a class="slip" href="${esc(r.url)}" target="_blank" rel="noopener" style="--sw:var(--c-${r.t})">
          <span class="fmt"><svg viewBox="0 0 12 12" aria-hidden="true">${fmt.icon}</svg>${fmt.label}</span>
          <span class="slip-body">
            <p class="slip-title">${esc(r.title)}</p>
            <p class="slip-meta"><span>${esc(r.by)}</span><span class="host">${host(r.url)}</span>${
              weekOf[r.url] ? `<span class="wk-badge">week ${weekOf[r.url]}</span>` : ""
            }</p>
          </span>
        </a></li>`;
      }

      function renderShelves() {
        const visible = RESOURCES.filter(matches);
        const topics = state.topic === "all" ? TOPICS : [topicOf(state.topic)];
        const html = topics
          .map((t) => {
            const rs = visible.filter((r) => r.t === t.id);
            if (!rs.length) return "";
            return `<section class="shelf" id="${t.id}" aria-labelledby="h-${t.id}">
              <div class="shelf-head">
                <h2 id="h-${t.id}"><span class="tab" style="--sw:var(--c-${t.id})" aria-hidden="true"></span>${esc(t.name)}</h2>
              </div>
              <ul class="slips">${rs.map(slip).join("")}</ul>
            </section>`;
          })
          .join("");

        const shown = topics.reduce((n, t) => n + visible.filter((r) => r.t === t.id).length, 0);
        $("#count-shown").textContent = shown;
        $("#count-total").textContent = RESOURCES.length;
        $("#count-unit").textContent = "resources";

        $("#shelves").innerHTML =
          html ||
          `<div class="empty"><strong>Nothing on this shelf</strong>No resources match “${esc(state.q || "")}”${
            state.format !== "all" ? " in " + FORMATS[state.format].label.toLowerCase() + "s" : ""
          }. Try a broader word or another format.<br /><button type="button" id="reset">Show everything</button></div>`;

        $("#shelves").classList.toggle("grid-view", state.view === "grid");
        $("#view-list").setAttribute("aria-pressed", state.view === "list");
        $("#view-grid").setAttribute("aria-pressed", state.view === "grid");
        $("#q-clear").hidden = !state.q;
      }

      const weekByN = (n) => ROADMAP.find((w) => w.n === n);
      const currentWeek = () => ROADMAP.find((w) => !weekComplete(w));
      const nextKey = (w) => required(w).find((k) => !done.has(k));
      const pctOf = (w) => Math.round((weekDone(w) / required(w).length) * 100);
      const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>';

      function renderHero() {
        const total = ROADMAP.reduce((a, w) => a + required(w).length, 0);
        const got = ROADMAP.reduce((a, w) => a + (weekComplete(w) ? required(w).length : weekDone(w)), 0);
        const weeks = ROADMAP.filter(weekComplete).length;
        const cur = currentWeek();
        const stage = STAGES.find((s) => s.id === (cur || ROADMAP[ROADMAP.length - 1]).stage);
        $("#count-shown").textContent = got;
        $("#count-total").textContent = total;
        $("#count-unit").textContent = "items done";

        return `<div class="rm-hero">
          <div class="stats">
            <div class="stat"><b>${weeks}/${ROADMAP.length}</b><span>weeks complete</span></div>
            <div class="stat"><b>${got}/${total}</b><span title="Core courses and articles ticked off; optional ones don't count">items done</span></div>
            <div class="stat"><b>${esc(stage.name)}</b><span>current stage</span></div>
          </div>
        </div>`;
      }

      function renderPath() {
        const cur = currentWeek();
        const anyDone = ROADMAP.some((w) => weekDone(w) > 0);
        let i = 0;
        const rows = STAGES.map((s, si) => {
          const ws = ROADMAP.filter((w) => w.stage === s.id);
          const full = ws.every(weekComplete);
          const head = `<div class="checkpoint${full ? " done" : ""}">
            <span class="k">Stage ${si + 1} · weeks ${ws[0].n}–${ws[ws.length - 1].n}${full ? " · complete" : ""}</span>
            <b>${esc(s.name)}: ${esc(s.sub)}</b>
          </div>`;
          const stops = ws
            .map((w) => {
              // a gentle wave: alternate stops swing left and right of centre
              const k = Math.round(Math.sin(i++ * 1.05) * 100) / 100;
              const complete = weekComplete(w);
              const d = weekDone(w);
              const n = required(w).length;
              const cls = complete ? "is-done" : w === cur ? "is-current" : d ? "is-started" : "is-todo";
              const dim = state.q && !weekMatches(w) ? " dim" : "";
              const status = complete ? "complete" : d === n ? "ready to complete" : w === cur ? (d ? `in progress · ${d}/${n}` : "up next") : d ? `${d}/${n} done` : `${n} item${n === 1 ? "" : "s"}`;
              return `<div class="stop-row">
                <button class="stop ${cls}${dim}" type="button" data-week="${w.n}" aria-pressed="${state.open && state.sel === w.n}"
                  aria-label="Week ${w.n}: ${esc(w.title)}, ${status}" style="--k:${k};--p:${complete ? 100 : pctOf(w)};--sw:var(--c-${w.t})">
                  ${w === cur ? `<span class="here">${anyDone ? "You are here" : "Start here"}</span>` : ""}
                  <span class="node"><span class="face">${complete ? CHECK : w.n}</span></span>
                  <span class="stop-label${k > 0.3 ? " left" : ""}" aria-hidden="true">
                    <span class="wk">Week ${pad(w.n)} · ${esc(topicOf(w.t).name)}</span>
                    <span class="t">${esc(w.title)}</span>
                    <span class="m">${status}</span>
                  </span>
                </button>
              </div>`;
            })
            .join("");
          return head + stops;
        }).join("");

        const hits = state.q ? ROADMAP.filter(weekMatches).length : 0;
        const note = state.q
          ? `<p class="search-note">${hits ? `${hits} of ${ROADMAP.length} weeks mention “${esc(state.q)}” and stay highlighted.` : `No week mentions “${esc(state.q)}”.`} <button class="link-btn" type="button" id="reset">clear search</button></p>`
          : "";
        return note + `<div class="path" id="path"><svg class="path-svg" aria-hidden="true"></svg>${rows}</div>`;
      }

      // connect the stops with a curve; the solid part runs up to where you are
      function drawPath() {
        const path = $("#path");
        if (!path || state.mode !== "roadmap") return;
        const box = path.getBoundingClientRect();
        const pts = [...path.querySelectorAll(".node")].map((n) => {
          const r = n.getBoundingClientRect();
          return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top];
        });
        if (!pts.length) return;
        const curve = (upto) => {
          let d = `M ${pts[0][0]} ${pts[0][1]}`;
          for (let j = 1; j <= upto; j++) {
            const [a, b] = [pts[j - 1], pts[j]];
            const my = (a[1] + b[1]) / 2;
            d += ` C ${a[0]} ${my} ${b[0]} ${my} ${b[0]} ${b[1]}`;
          }
          return d;
        };
        let reach = ROADMAP.findIndex((w) => !weekComplete(w));
        if (reach === -1) reach = pts.length - 1;
        path.querySelector(".path-svg").innerHTML =
          `<path class="base" d="${curve(pts.length - 1)}"/>` + (reach > 0 ? `<path class="fill" d="${curve(reach)}"/>` : "");
      }

      const ICON = {
        left: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        right: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        close: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
        check: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      };

      // one reading-list row; core items carry their suggested order as the checkbox face
      function step(s, nk, num) {
        const r = byUrl[s.url];
        if (!r) return "";
        const on = done.has(r.url);
        const next = r.url === nk;
        return `<li class="step${on ? " is-done" : ""}${next ? " is-next" : ""}">
          <label class="mark">
            <input class="tick" type="checkbox" data-key="${esc(r.url)}"${on ? " checked" : ""} aria-label="Mark ${esc(r.title)} as done" />
            <span aria-hidden="true"><b>${num || ""}</b>${ICON.check}</span>
          </label>
          <div class="step-body">
            <a class="step-link" href="${esc(r.url)}" target="_blank" rel="noopener"><span class="step-title">${esc(r.title)}</span></a>
            <p class="step-meta">${FORMATS[r.f].label} from ${esc(r.by)}${next ? ", start here" : ""}</p>
            ${s.note ? `<p class="step-note">${esc(s.note)}</p>` : ""}
          </div>
        </li>`;
      }

      function renderPanel() {
        const w = weekByN(state.sel) || ROADMAP[0];
        const si = STAGES.findIndex((s) => s.id === w.stage);
        const d = weekDone(w);
        const n = required(w).length;
        const nk = nextKey(w);
        const nxt = weekByN(w.n + 1);
        const complete = weekComplete(w);
        const core = w.learn.filter((s) => !s.opt);
        const extras = w.learn.filter((s) => s.opt);
        const panel = $("#panel");
        panel.style.setProperty("--sw", `var(--c-${w.t})`);
        panel.innerHTML = `<div class="panel-head">
            <div class="panel-top">
              <span>${esc(STAGES[si].name)} stage, week ${w.n} of ${ROADMAP.length}</span>
              <span class="arrows">
                <button class="icon-btn" type="button" data-go="${w.n - 1}"${w.n === 1 ? " disabled" : ""} aria-label="Previous week" title="Previous week">${ICON.left}</button>
                <button class="icon-btn" type="button" data-go="${w.n + 1}"${nxt ? "" : " disabled"} aria-label="Next week" title="Next week">${ICON.right}</button>
                <button class="icon-btn" type="button" data-close aria-label="Close" title="Close">${ICON.close}</button>
              </span>
            </div>
            <div class="wk-head">
              <span class="wk-num" aria-hidden="true">${w.n}</span>
              <div>
                <h2 id="panel-title">${esc(w.title)}</h2>
                <p class="goal">${esc(w.goal)}</p>
              </div>
            </div>
          </div>
          <div class="panel-body">
            <section>
              <div class="list-head"><h3>This week's materials</h3><span>${complete ? "All done" : `${d} of ${n} done`}</span></div>
              <ol class="steps">${core.map((s, i) => step(s, nk, i + 1)).join("")}</ol>
            </section>
            ${
              extras.length
                ? `<section class="extras">
                    <div class="list-head"><h3>Optional extras</h3><span>Not needed to finish the week</span></div>
                    <ul class="steps">${extras.map((s) => step(s, nk)).join("")}</ul>
                  </section>`
                : ""
            }
            <div class="wk-actions">
              ${
                complete
                  ? `<div class="done-line">
                      <span class="swatch">${ICON.check}</span>
                      <span>Week ${w.n} complete</span>
                      <button class="link-btn" type="button" data-undo="${w.n}">Undo</button>
                    </div>
                    ${nxt ? `<button class="next-btn" type="button" data-go="${nxt.n}">Start week ${nxt.n}: ${esc(nxt.title)}</button>` : ""}`
                  : `<button class="complete-btn" type="button" data-complete="${w.n}">${ICON.check}Mark week ${w.n} complete</button>
                    <span class="hint">${d === n ? "You've done every core item." : `${d} of ${n} core items done so far.`}</span>`
              }
            </div>
          </div>
          <div class="panel-foot">
            <span>Progress is saved in this browser only.</span>
            ${done.size ? `<button class="link-btn" type="button" id="rm-reset">Reset progress</button>` : ""}
          </div>`;
      }

      function renderRoadmap() {
        $("#rm-main").innerHTML = renderHero() + renderPath();
        renderPanel();
        drawPath();
        $("#q-clear").hidden = !state.q;
      }

      function render() {
        const road = state.mode === "roadmap";
        $("#mode-roadmap").setAttribute("aria-pressed", road);
        $("#mode-library").setAttribute("aria-pressed", !road);
        $("#view-toggle").hidden = road;
        $(".shell").classList.toggle("solo", road);
        $("#roadmap").hidden = !road;
        $("#shelves").hidden = road;
        if (road) {
          renderRoadmap();
        } else {
          closeSheet();
          renderRail();
          renderShelves();
        }
      }

      function openSheet() {
        state.open = true;
        $("#panel").classList.add("open");
        $("#backdrop").classList.add("open");
        document.documentElement.classList.add("drawer-open");
        document.querySelectorAll(".stop").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.week === state.sel));
        const close = $("#panel [data-close]");
        if (close) close.focus({ preventScroll: true });
      }
      function closeSheet() {
        const wasOpen = $("#panel").classList.contains("open");
        state.open = false;
        $("#panel").classList.remove("open");
        $("#backdrop").classList.remove("open");
        document.documentElement.classList.remove("drawer-open");
        document.querySelectorAll(".stop").forEach((b) => b.setAttribute("aria-pressed", "false"));
        const stop = document.querySelector(`.stop[data-week="${state.sel}"]`);
        if (wasOpen && stop) stop.focus({ preventScroll: true });
      }

      // select a week: fill the drawer and, when asked, slide it in
      function selectWeek(n, opts = {}) {
        if (!weekByN(n)) return;
        state.sel = n;
        history.replaceState(null, "", "#week-" + n);
        renderRoadmap();
        $("#panel").scrollTop = 0;
        if (opts.scroll) {
          const stop = document.querySelector(`.stop[data-week="${n}"]`);
          if (stop) stop.scrollIntoView({ block: "center", behavior: opts.instant ? "auto" : "smooth" });
        }
        if (opts.open) openSheet();
        if (opts.focus) {
          const t = [...document.querySelectorAll("#panel .tick")].find((x) => x.dataset.key === opts.focus);
          if (t) {
            t.focus({ preventScroll: true });
            t.closest(".step").scrollIntoView({ block: "nearest" });
          }
        }
      }

      function toast(msg, t) {
        const el = $("#toast");
        el.textContent = msg;
        el.style.setProperty("--sw", `var(--c-${t})`);
        el.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove("show"), 3200);
      }

      function setMode(m) {
        state.mode = m;
        savePrefs();
        history.replaceState(null, "", location.pathname + location.search);
        render();
        window.scrollTo(0, 0);
      }
      $("#mode-roadmap").addEventListener("click", () => setMode("roadmap"));
      $("#mode-library").addEventListener("click", () => setMode("library"));

      function reset() {
        state.topic = "all";
        state.format = "all";
        state.q = "";
        $("#q").value = "";
        render();
      }

      $("#rail-nav").addEventListener("click", (e) => {
        const b = e.target.closest("[data-topic]");
        if (!b) return;
        state.topic = b.dataset.topic;
        render();
        $("#main").scrollIntoView({ block: "start", behavior: "smooth" });
      });
      $("#fmt-row").addEventListener("click", (e) => {
        const b = e.target.closest("[data-format]");
        if (!b) return;
        state.format = b.dataset.format;
        render();
      });
      $("#shelves").addEventListener("click", (e) => {
        if (e.target.id === "reset") reset();
      });
      $("#roadmap").addEventListener("click", (e) => {
        if (e.target.id === "reset") return reset();
        const wk = e.target.closest("[data-week]");
        if (wk) return selectWeek(+wk.dataset.week, { open: true, focus: wk.dataset.focus });
        const go = e.target.closest("[data-go]");
        if (go) return selectWeek(+go.dataset.go, { open: true });
        if (e.target.closest("[data-close]")) return closeSheet();
        const fin = e.target.closest("[data-complete]");
        if (fin) {
          const w = weekByN(+fin.dataset.complete);
          done.add("week:" + w.n);
          required(w).forEach((k) => done.add(k));
          saveProgress();
          renderRoadmap();
          const nxt = weekByN(w.n + 1);
          toast(nxt ? `Week ${w.n} complete! Next up: ${nxt.title}` : "Roadmap complete! Time to teach it.", w.t);
          const go = $("#panel [data-go='" + (w.n + 1) + "'].next-btn");
          if (go) go.focus({ preventScroll: true });
          return;
        }
        const undo = e.target.closest("[data-undo]");
        if (undo) {
          done.delete("week:" + undo.dataset.undo);
          saveProgress();
          renderRoadmap();
          const btn = $("#panel [data-complete]");
          if (btn) btn.focus({ preventScroll: true });
          return;
        }
        if (e.target.id === "rm-reset") {
          const b = e.target;
          if (b.dataset.armed) {
            done.clear();
            saveProgress();
            renderRoadmap();
          } else {
            b.dataset.armed = "1";
            b.textContent = "Click again to confirm";
            setTimeout(() => {
              if (b.isConnected) {
                delete b.dataset.armed;
                b.textContent = "Reset progress";
              }
            }, 4000);
          }
        }
      });
      $("#roadmap").addEventListener("change", (e) => {
        const k = e.target.dataset.key;
        if (!k) return;
        if (e.target.checked) done.add(k);
        else done.delete(k);
        saveProgress();
        renderRoadmap();
        const again = [...document.querySelectorAll("#panel .tick")].find((t) => t.dataset.key === k);
        if (again) again.focus({ preventScroll: true });
      });
      $("#backdrop").addEventListener("click", closeSheet);
      new ResizeObserver(() => drawPath()).observe($("#main"));
      if (document.fonts) document.fonts.ready.then(drawPath);
      $("#q").addEventListener("input", (e) => {
        state.q = e.target.value.trim();
        render();
      });
      $("#q-clear").addEventListener("click", (e) => {
        e.preventDefault();
        state.q = "";
        $("#q").value = "";
        render();
        $("#q").focus();
      });

      function setView(v) {
        state.view = v;
        savePrefs();
        renderShelves();
      }
      $("#view-list").addEventListener("click", () => setView("list"));
      $("#view-grid").addEventListener("click", () => setView("grid"));

      // theme: opens in light unless the visitor chose dark before;
      // each click flips between light and dark
      const root = document.documentElement;
      const themeBtn = $("#theme-btn");
      let theme = "light";
      try {
        if (localStorage.getItem("shelf-theme") === "dark") theme = "dark";
      } catch (e) {}

      function applyTheme() {
        root.setAttribute("data-theme", theme);
        themeBtn.textContent = "theme: " + theme;
        themeBtn.setAttribute("aria-label", "Switch to " + (theme === "dark" ? "light" : "dark") + " theme");
      }
      applyTheme();
      themeBtn.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        applyTheme();
        try {
          localStorage.setItem("shelf-theme", theme);
        } catch (e) {}
      });

      document.addEventListener("keydown", (e) => {
        const typing = e.target.matches("input[type=search]");
        if (e.key === "/" && !typing) {
          e.preventDefault();
          $("#q").focus();
        } else if (e.key === "Escape") {
          if ($("#panel").classList.contains("open")) return closeSheet();
          if (typing) $("#q").blur();
          reset();
        } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && state.open && !e.metaKey && !e.altKey) {
          e.preventDefault();
          selectWeek(state.sel + (e.key === "ArrowRight" ? 1 : -1), { open: true });
        } else if (e.key === "v" && !typing && !e.metaKey && !e.ctrlKey && state.mode === "library") {
          setView(state.view === "list" ? "grid" : "list");
        }
      });

      // deep links: index.html#week-5 opens the roadmap at that week,
      // index.html#mcp opens the library on that topic
      const hash = location.hash.slice(1);
      const wkMatch = /^week-(\d+)$/.exec(hash);
      state.sel = (currentWeek() || ROADMAP[ROADMAP.length - 1]).n;
      if (wkMatch && weekByN(+wkMatch[1])) {
        state.mode = "roadmap";
        state.sel = +wkMatch[1];
      } else if (topicOf(hash)) {
        state.mode = "library";
        state.topic = hash;
      }
      render();
      if (wkMatch) selectWeek(state.sel, { scroll: true, instant: true, open: true });
      window.addEventListener("hashchange", () => {
        const m = /^#week-(\d+)$/.exec(location.hash);
        if (!m) return;
        if (state.mode !== "roadmap") setMode("roadmap");
        selectWeek(+m[1], { scroll: true, open: true });
      });
    </script>
  </body>
</html>
